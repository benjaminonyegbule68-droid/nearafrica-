<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Businesses | NearAfrica</title>

    <meta
        name="description"
        content="Discover businesses, services and places across Africa with NearAfrica."
    >

    <link rel="stylesheet" href="styles.css">

    <style>
        /* =====================================================
           EXPLORE PAGE
        ===================================================== */

        .explore-page {
            min-height: 100vh;
            background: #0b0b0b;
            color: #fff;
        }

        .explore-hero {
            padding: 120px 6% 60px;
            text-align: center;
        }

        .explore-hero h1 {
            font-size: clamp(38px, 6vw, 68px);
            margin-bottom: 15px;
        }

        .explore-hero h1 span {
            color: #d4af37;
        }

        .explore-hero p {
            max-width: 700px;
            margin: 0 auto;
            color: #aaa;
            line-height: 1.7;
        }

        /* SEARCH */

        .search-area {
            width: min(1100px, 92%);
            margin: 0 auto 50px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: #151515;
            padding: 10px;
            border: 1px solid #292929;
            border-radius: 14px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            padding: 15px;
        }

        .search-box input::placeholder {
            color: #777;
        }

        .search-button {
            background: #d4af37;
            color: #111;
            border: none;
            border-radius: 9px;
            padding: 0 25px;
            font-weight: 700;
            cursor: pointer;
        }

        .search-button:hover {
            opacity: .9;
        }

        /* FILTERS */

        .filters {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .filters select {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #292929;
            background: #151515;
            color: #fff;
            outline: none;
        }

        /* RESULTS */

        .results-section {
            width: min(1200px, 92%);
            margin: 0 auto;
            padding-bottom: 100px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .results-header h2 {
            margin: 0;
            font-size: 25px;
        }

        .results-count {
            color: #999;
            font-size: 14px;
        }

        .business-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .business-card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 15px;
            overflow: hidden;
            transition: transform .2s ease, border-color .2s ease;
        }

        .business-card:hover {
            transform: translateY(-4px);
            border-color: #d4af37;
        }

        .business-card-content {
            padding: 22px;
        }

        .business-category {
            color: #d4af37;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .business-card h3 {
            margin: 9px 0;
            font-size: 21px;
        }

        .business-location {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 13px;
        }

        .business-description {
            color: #999;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .verified {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #d4af37;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .business-link {
            display: block;
            text-align: center;
            background: #d4af37;
            color: #111;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
        }

        .business-link:hover {
            opacity: .9;
        }

        /* STATES */

        .state-message {
            text-align: center;
            padding: 60px 20px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 15px;
            color: #aaa;
        }

        .state-message h3 {
            color: #fff;
            margin-bottom: 10px;
        }

        .loading {
            color: #d4af37;
        }

        .error {
            color: #ff8a8a;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .business-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            .explore-hero {
                padding-top: 100px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-button {
                padding: 14px;
            }

            .business-grid {
                grid-template-columns: 1fr;
            }

            .results-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="explore-page">

    <!-- HEADER -->

    <header>
        <a href="index.html" class="logo">
            Near<span>Africa</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="list-business.html">List Your Business</a>
        </nav>
    </header>


    <!-- HERO -->

    <section class="explore-hero">

        <h1>
            Discover Businesses
            <span>Near You</span>
        </h1>

        <p>
            Find businesses, services and places across Africa.
            Search by name, category, country, state or city.
        </p>

    </section>


    <!-- SEARCH -->

    <section class="search-area">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search businesses, services or locations..."
                autocomplete="off"
            >

            <button
                class="search-button"
                id="searchButton"
            >
                Search
            </button>

        </div>


        <div class="filters">

            <select id="categoryFilter">

                <option value="">
                    All Categories
                </option>

                <option value="Spa">
                    Spas
                </option>

                <option value="Restaurant">
                    Restaurants
                </option>

                <option value="Barber">
                    Barbers
                </option>

                <option value="Hair Salon">
                    Hair Salons
                </option>

                <option value="Hotel">
                    Hotels
                </option>

                <option value="Fashion">
                    Fashion Stores
                </option>

                <option value="Gym">
                    Gyms
                </option>

                <option value="Hospital">
                    Hospitals / Clinics
                </option>

                <option value="Mechanic">
                    Mechanics
                </option>

                <option value="Real Estate">
                    Real Estate
                </option>

                <option value="School">
                    Schools
                </option>

                <option value="Supermarket">
                    Supermarkets
                </option>

                <option value="Photographer">
                    Photographers
                </option>

                <option value="Event Planner">
                    Event Planners
                </option>

            </select>


            <select id="countryFilter">

                <option value="">
                    All Countries
                </option>

                <option value="Nigeria">
                    Nigeria
                </option>

                <option value="Ghana">
                    Ghana
                </option>

                <option value="Kenya">
                    Kenya
                </option>

                <option value="South Africa">
                    South Africa
                </option>

                <option value="Uganda">
                    Uganda
                </option>

                <option value="Tanzania">
                    Tanzania
                </option>

            </select>


            <select id="stateFilter">

                <option value="">
                    All States
                </option>

            </select>

        </div>

    </section>


    <!-- RESULTS -->

    <section class="results-section">

        <div class="results-header">

            <h2>
                Businesses
            </h2>

            <div
                class="results-count"
                id="resultsCount"
            >
                Loading...
            </div>

        </div>


        <div
            id="businessResults"
            class="business-grid"
        >

            <div class="state-message">

                <div class="loading">
                    Loading businesses...
                </div>

            </div>

        </div>

    </section>

</div>


<script>

    /* =====================================================
       NEARAFRICA API
    ===================================================== */

    const API_URL =
        "https://nearafrica-api.uxmangee.workers.dev";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const searchInput =
        document.getElementById("searchInput");

    const searchButton =
        document.getElementById("searchButton");

    const categoryFilter =
        document.getElementById("categoryFilter");

    const countryFilter =
        document.getElementById("countryFilter");

    const stateFilter =
        document.getElementById("stateFilter");

    const businessResults =
        document.getElementById("businessResults");

    const resultsCount =
        document.getElementById("resultsCount");


    /* =====================================================
       LOAD BUSINESSES
    ===================================================== */

    async function loadBusinesses() {

        try {

            businessResults.innerHTML = `
                <div class="state-message">
                    <div class="loading">
                        Loading businesses...
                    </div>
                </div>
            `;

            const params =
                new URLSearchParams();


            const search =
                searchInput.value.trim();

            const category =
                categoryFilter.value;

            const country =
                countryFilter.value;

            const state =
                stateFilter.value;


            if (search) {
                params.set("q", search);
            }

            if (category) {
                params.set("category", category);
            }

            if (country) {
                params.set("country", country);
            }

            if (state) {
                params.set("state", state);
            }


            const url =
                `${API_URL}/businesses?${params.toString()}`;


            const response =
                await fetch(url);


            if (!response.ok) {
                throw new Error(
                    `API returned ${response.status}`
                );
            }


            const data =
                await response.json();


            if (!data.success) {
                throw new Error(
                    data.message ||
                    "Could not load businesses."
                );
            }


            const businesses =
                Array.isArray(data.businesses)
                    ? data.businesses
                    : [];


            resultsCount.textContent =
                `${businesses.length} business${businesses.length === 1 ? "" : "es"}`;


            populateStates(businesses);


            renderBusinesses(businesses);

        } catch (error) {

            console.error(
                "NearAfrica API error:",
                error
            );

            resultsCount.textContent =
                "Unable to load";

            businessResults.innerHTML = `

                <div class="state-message">

                    <h3>
                        We couldn't load businesses
                    </h3>

                    <p>
                        Please try again in a moment.
                    </p>

                </div>

            `;
        }
    }


    /* =====================================================
       RENDER BUSINESSES
    ===================================================== */

    function renderBusinesses(
        businesses
    ) {

        if (!businesses.length) {

            businessResults.innerHTML = `

                <div class="state-message">

                    <h3>
                        No businesses found
                    </h3>

                    <p>
                        Try another search, location or category.
                    </p>

                </div>

            `;

            return;
        }


        businessResults.innerHTML =
            businesses.map(
                business => createBusinessCard(business)
            ).join("");
    }


    /* =====================================================
       BUSINESS CARD
    ===================================================== */

    function createBusinessCard(
        business
    ) {

        const id =
            encodeURIComponent(
                business.id
            );


        const name =
            escapeHTML(
                business.business_name ||
                "Unnamed Business"
            );


        const category =
            escapeHTML(
                business.category ||
                "Business"
            );


        const city =
            escapeHTML(
                business.city ||
                ""
            );


        const state =
            escapeHTML(
                business.state ||
                ""
            );


        const country =
            escapeHTML(
                business.country ||
                ""
            );


        const description =
            escapeHTML(
                business.description ||
                "No description available."
            );


        const location =
            [city, state, country]
                .filter(Boolean)
                .join(", ");


        const verified =
            Number(business.verified) === 1;


        return `

            <article class="business-card">

                <div class="business-card-content">

                    <div class="business-category">
                        ${category}
                    </div>

                    <h3>
                        ${name}
                    </h3>

                    ${
                        verified
                            ? `
                                <div class="verified">
                                    ✓ Verified Business
                                </div>
                              `
                            : ""
                    }

                    <div class="business-location">
                        📍 ${location || "Location unavailable"}
                    </div>

                    <p class="business-description">
                        ${description}
                    </p>

                    <a
                        class="business-link"
                        href="business.html?id=${id}"
                    >
                        View Business
                    </a>

                </div>

            </article>

        `;
    }


    /* =====================================================
       POPULATE STATES
    ===================================================== */

    function populateStates(
        businesses
    ) {

        const current =
            stateFilter.value;


        const states =
            [
                ...new Set(
                    businesses
                        .map(
                            business =>
                                business.state
                        )
                        .filter(Boolean)
                )
            ]
            .sort();


        stateFilter.innerHTML = `
            <option value="">
                All States
            </option>
        `;


        states.forEach(
            state => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    state;

                option.textContent =
                    state;

                stateFilter.appendChild(
                    option
                );
            }
        );


        if (
            states.includes(current)
        ) {

            stateFilter.value =
                current;
        }
    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(
        value
    ) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    /* =====================================================
       EVENTS
    ===================================================== */

    searchButton.addEventListener(
        "click",
        loadBusinesses
    );


    searchInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                loadBusinesses();
            }
        }
    );


    categoryFilter.addEventListener(
        "change",
        loadBusinesses
    );


    countryFilter.addEventListener(
        "change",
        loadBusinesses
    );


    stateFilter.addEventListener(
        "change",
        loadBusinesses
    );


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    loadBusinesses();

</script>

</body>
</html>
