<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Explore businesses across Nigeria with NearAfrica."
  >

  <title>Explore Businesses | NearAfrica</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>

    /* =========================================================
       EXPLORE PAGE
       ========================================================= */

    .explore-page {
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .explore-hero {
      padding: 48px 20px 30px;
      text-align: center;
    }

    .explore-hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.2rem);
    }

    .explore-hero p {
      margin: 0 auto;
      max-width: 700px;
      opacity: 0.75;
      line-height: 1.7;
    }

    .explore-controls {
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 0 20px;
    }

    .filter-panel {
      display: grid;
      grid-template-columns:
        minmax(200px, 2fr)
        repeat(3, minmax(140px, 1fr))
        auto;
      gap: 12px;
      align-items: end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .filter-group label {
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0.8;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: inherit;
      outline: none;
      box-sizing: border-box;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: rgba(212,175,55,0.7);
    }

    .filter-button {
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .results-header {
      max-width: 1200px;
      margin: 0 auto 18px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .results-header h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .results-status {
      opacity: 0.7;
      font-size: 0.9rem;
    }

    .business-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .business-card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .business-card:hover {
      transform: translateY(-3px);
      border-color: rgba(212,175,55,0.4);
    }

    .business-card-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.05);
    }

    .business-card-content {
      padding: 18px;
    }

    .business-card-title {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .business-card-category {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 0.78rem;
      opacity: 0.75;
    }

    .business-card-location {
      margin: 0 0 10px;
      font-size: 0.9rem;
      opacity: 0.75;
    }

    .business-card-description {
      margin: 0 0 15px;
      font-size: 0.9rem;
      line-height: 1.55;
      opacity: 0.8;
    }

    .business-card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .business-card-actions a,
    .business-card-actions button {
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .business-card-actions a:hover,
    .business-card-actions button:hover {
      border-color: rgba(212,175,55,0.5);
    }

    .empty-state,
    .loading-state,
    .error-state {
      max-width: 800px;
      margin: 30px auto;
      padding: 35px 20px;
      text-align: center;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .pagination {
      max-width: 1200px;
      margin: 30px auto 0;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pagination button {
      min-width: 40px;
      min-height: 40px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: inherit;
      cursor: pointer;
    }

    .pagination button.active {
      font-weight: 700;
      border-color: rgba(212,175,55,0.7);
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 950px) {

      .filter-panel {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .business-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 620px) {

      .filter-panel {
        grid-template-columns: 1fr;
      }

      .business-grid {
        grid-template-columns: 1fr;
      }

      .explore-hero {
        padding-top: 30px;
      }

    }

  </style>

</head>


<body>


  <!-- =======================================================
       NAVIGATION
       ======================================================= -->

  <header class="site-header">

    <div class="container">

      <a
        href="index.html"
        class="logo"
      >
        NearAfrica
      </a>

      <nav
        class="main-nav"
        aria-label="Main navigation"
      >

        <a href="index.html">
          Home
        </a>

        <a
          href="explore.html"
          aria-current="page"
        >
          Explore
        </a>

        <a href="help-wanted.html">
          Help Wanted
        </a>

      </nav>

    </div>

  </header>


  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main class="explore-page">


    <!-- =====================================================
         HERO
         ===================================================== -->

    <section class="explore-hero">

      <h1>
        Explore Businesses
      </h1>

      <p>
        Discover businesses, services, and opportunities across Africa.
      </p>

    </section>


    <!-- =====================================================
         FILTERS
         ===================================================== -->

    <section class="explore-controls">

      <div class="filter-panel">

        <div class="filter-group">

          <label for="searchInput">
            Search
          </label>

          <input
            id="searchInput"
            type="search"
            placeholder="Search businesses..."
            autocomplete="off"
          >

        </div>


        <div class="filter-group">

          <label for="categoryFilter">
            Category
          </label>

          <select id="categoryFilter">

            <option value="">
              All categories
            </option>

          </select>

        </div>


        <div class="filter-group">

          <label for="stateFilter">
            State
          </label>

          <select id="stateFilter">

            <option value="">
              All states
            </option>

          </select>

        </div>


        <div class="filter-group">

          <label for="cityFilter">
            City
          </label>

          <select id="cityFilter">

            <option value="">
              All cities
            </option>

          </select>

        </div>


        <button
          id="clearFilters"
          type="button"
          class="filter-button"
        >
          Clear
        </button>

      </div>

    </section>


    <!-- =====================================================
         RESULTS HEADER
         ===================================================== -->

    <section class="results-header">

      <h2 id="resultsTitle">
        Businesses
      </h2>

      <div
        id="resultsStatus"
        class="results-status"
      >
        Loading businesses...
      </div>

    </section>


    <!-- =====================================================
         RESULTS
         ===================================================== -->

    <section
      id="businessGrid"
      class="business-grid"
      aria-live="polite"
    >

      <div class="loading-state">
        Loading businesses...
      </div>

    </section>


    <!-- =====================================================
         PAGINATION
         ===================================================== -->

    <div
      id="pagination"
      class="pagination"
    ></div>


  </main>


  <!-- =======================================================
       CONFIGURATION
       ======================================================= -->

  <script src="config.js"></script>


  <!-- =======================================================
       NEARAFRICA APPLICATION
       ======================================================= -->

  <script src="app-new.js"></script>


</body>

</html>
