<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

<meta
    name="description"
    content="Explore businesses across Nigeria with NearAfrica."
  >

  <title>Explore Businesses | NearAfrica</title>

  <link
    rel="canonical"
    href="https://nearafrica.com.ng/explore.html"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>


    /* =========================================================
       EXPLORE PAGE
       ========================================================= */

    .explore-page {
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .explore-hero {
      padding: 48px 20px 30px;
      text-align: center;
    }

    .explore-hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.2rem);
    }

    .explore-hero p {
      margin: 0 auto;
      max-width: 700px;
      opacity: 0.75;
      line-height: 1.7;
    }

    .explore-controls {
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 0 20px;
    }

    .filter-panel {
      display: grid;
      grid-template-columns:
        minmax(200px, 2fr)
        repeat(3, minmax(140px, 1fr))
        auto;
      gap: 12px;
      align-items: end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .filter-group label {
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0.8;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: inherit;
      outline: none;
      box-sizing: border-box;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: rgba(212,175,55,0.7);
    }

    .filter-button {
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .results-header {
      max-width: 1200px;
      margin: 0 auto 18px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .results-header h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .results-status {
      opacity: 0.7;
      font-size: 0.9rem;
    }

    .business-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .business-card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .business-card:hover {
      transform: translateY(-3px);
      border-color: rgba(212,175,55,0.4);
    }

    .business-card-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.05);
    }

    .business-card-content {
      padding: 18px;
    }

    .business-card-title {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .business-card-category {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 0.78rem;
      opacity: 0.75;
    }

    .business-card-location {
      margin: 0 0 10px;
      font-size: 0.9rem;
      opacity: 0.75;
    }

    .business-card-description {
      margin: 0 0 15px;
      font-size: 0.9rem;
      line-height: 1.55;
      opacity: 0.8;
    }

    .business-card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .business-card-actions a,
    .business-card-actions button {
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .business-card-actions a:hover,
    .business-card-actions button:hover {
      border-color: rgba(212,175,55,0.5);
    }

    .empty-state,
    .loading-state,
    .error-state {
      max-width: 800px;
      margin: 30px auto;
      padding: 35px 20px;
      text-align: center;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .pagination {
      max-width: 1200px;
      margin: 30px auto 0;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pagination button {
      min-width: 40px;
      min-height: 40px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: inherit;
      cursor: pointer;
    }

    .pagination button.active {
      font-weight: 700;
      border-color: rgba(212,175,55,0.7);
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 950px) {

      .filter-panel {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .business-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 620px) {

      .filter-panel {
        grid-template-columns: 1fr;
      }

      .business-grid {
        grid-template-columns: 1fr;
      }

      .explore-hero {
        padding-top: 30px;
      }

    }

  
    .explore-language {
      display: inline-flex;
      align-items: center;
    }
    .explore-language select {
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #51431c;
      background: #080808;
      color: #d4af37;
      font: inherit;
    }

  </style>

</head>


<body>


  <!-- =======================================================
       NAVIGATION
       ======================================================= -->

  <header class="site-header">

    <div class="container">

      <a
        href="index.html"
        class="logo"
        data-i18n="siteName"
      >
        NearAfrica
      </a>

      <nav
        class="main-nav"
        aria-label="Main navigation"
      >

        <a href="index.html" data-i18n="nav.home">
          Home
        </a>

        <a
          href="explore.html"
          aria-current="page"
          data-i18n="nav.explore"
        >
          Explore
        </a>

        <a href="help-wanted.html" data-i18n="nav.helpWanted">
          Help Wanted
        </a>

        <div class="explore-language">
          <select
            id="languageSelector"
            data-language-selector
            aria-label="Language"
          >
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="ar">العربية</option>
            <option value="pt">Português</option>
            <option value="sw">Kiswahili</option>
            <option value="ha">Hausa</option>
            <option value="yo">Yorùbá</option>
            <option value="ig">Igbo</option>
          </select>
        </div>

      </nav>

    </div>

  </header>


  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main class="explore-page">


    <!-- =====================================================
         HERO
         ===================================================== -->

    <section class="explore-hero">

      <h1 data-i18n="explore.title">
        Explore Businesses
      </h1>

      <p data-i18n="explore.subtitle">
        Discover businesses, services, and opportunities across Africa.
      </p>

    </section>


    <!-- =====================================================
         FILTERS
         ===================================================== -->

    <section class="explore-controls">

      <div class="filter-panel">

        <div class="filter-group">

          <label for="searchInput" data-i18n="search.search">
            Search
          </label>

          <input
            id="searchInput"
            type="search"
            placeholder="Search businesses..."
            data-i18n-placeholder="search.searchPlaceholder"
            autocomplete="off"
          >

        </div>


        <div class="filter-group">

          <label for="categoryFilter" data-i18n="explore.category">
            Category
          </label>

          <select id="categoryFilter">

            <option value="" data-i18n="explore.allCategories">
              All categories
            </option>

          </select>

        </div>


        <div class="filter-group">

          <label for="stateFilter" data-i18n="explore.state">
            State
          </label>

          <select id="stateFilter">

            <option value="" data-i18n="explore.allStates">
              All states
            </option>

          </select>

        </div>


        <div class="filter-group">

          <label for="cityFilter">
            City
          </label>

          <select id="cityFilter">

            <option value="">
              All cities
            </option>

          </select>

        </div>


        <button
          id="clearFilters"
          type="button"
          class="filter-button"
          data-i18n="actions.cancel"
        >
          Clear
        </button>

      </div>

    </section>


    <!-- =====================================================
         RESULTS HEADER
         ===================================================== -->

    <section class="results-header">

      <h2 id="resultsTitle" data-i18n="explore.businesses">
        Businesses
      </h2>

     <div
  id="resultCount" data-i18n="actions.loading"
  class="result-count"
>Loading businesses...</div>

    </section>


    <!-- =====================================================
         RESULTS
         ===================================================== -->

      <section class="sponsored-section" id="exploreSponsoredSection" aria-label="Sponsored businesses" hidden>
    <h2>Sponsored</h2>
    <p class="sponsored-note">Paid placements. Separate from search results below.</p>
    <div class="sponsored-grid" id="exploreSponsoredGrid"></div>
  </section>

    <section
      id="businessGrid"
      class="business-grid"
      aria-live="polite"
    >

      <div class="loading-state" data-i18n="actions.loading">
        Loading businesses...
      </div>

    </section>


    <!-- =====================================================
         PAGINATION
         ===================================================== -->

    <div
      id="pagination"
      class="pagination"
    ></div>


  </main>


  <!-- =======================================================
       CONFIGURATION
       ======================================================= -->

  <script src="config.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>


  <!-- =======================================================
       NEARAFRICA APPLICATION
       ======================================================= -->

  <script src="app-new.js"></script>
  
<script>
(function () {
  var API = "https://nearafrica-api.nearafrica-onyxtech.workers.dev";
  var section = document.getElementById("exploreSponsoredSection");
  var grid = document.getElementById("exploreSponsoredGrid");
  if (!section || !grid) return;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function profileUrl(b) {
    if (b.slug) return "pages/business.html?slug=" + encodeURIComponent(b.slug);
    if (b.id) return "pages/business.html?id=" + encodeURIComponent(b.id);
    return "business-profile-fixed.html";
  }

  fetch(API + "/ads/active?placement=explore&limit=6")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var ads = (data && data.ads) || [];
      if (!ads.length) return;

      grid.innerHTML = ads.map(function (ad) {
        var b = ad.business || {};
        var name = b.business_name || "Business";
        var meta = [b.category, b.city, b.state].filter(Boolean).join(" · ");
        return (
          '<a class="sponsored-card" href="' + esc(profileUrl(b)) + '">' +
            '<span class="sponsored-badge">Sponsored</span>' +
            "<h3>" + esc(name) + "</h3>" +
            (meta ? '<p class="sponsored-meta">' + esc(meta) + "</p>" : "") +
          "</a>"
        );
      }).join("");

      section.hidden = false;
    })
    .catch(function () {
      /* keep section hidden if API fails */
    });
})();
</script>

</body>

</html>
