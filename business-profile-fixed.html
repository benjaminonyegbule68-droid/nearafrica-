<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Profile | NearAfrica</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root{
  --bg:#080808;
  --card:#151515;
  --card2:#1b1b1b;
  --gold:#d4af37;
  --gold2:#f0c75e;
  --white:#f5f5f5;
  --muted:#a7a7a7;
  --border:#292929;
  --danger:#d9534f;
  --success:#39b96a;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at top right,
      rgba(212,175,55,.08),
      transparent 32%
    ),
    var(--bg);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
}

a{
  color:inherit;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.65;
}

.container{
  width:min(1180px,92%);
  margin:0 auto;
}

/* =========================
   HEADER
========================= */

.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(8,8,8,.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

.header-inner{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:800;
  white-space:nowrap;
}

.logo-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  color:#111;
  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );
  font-weight:900;
}

.logo span{
  color:var(--gold2);
}

.nav{
  display:flex;
  align-items:center;
  gap:22px;
}

.nav a{
  text-decoration:none;
  color:#d7d7d7;
  font-size:14px;
}

.nav a:hover{
  color:var(--gold2);
}

.mobile-menu{
  display:none;
  background:none;
  border:1px solid var(--border);
  color:white;
  border-radius:8px;
  padding:8px 11px;
}

/* =========================
   PAGE
========================= */

.page{
  padding:40px 0 80px;
}

.loading{
  min-height:60vh;
  display:grid;
  place-items:center;
  text-align:center;
}

.spinner{
  width:42px;
  height:42px;
  border:3px solid #333;
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.hidden{
  display:none!important;
}

#statusMessage{
  display:none;
  padding:14px 16px;
  border-radius:10px;
  margin-bottom:22px;
  border:1px solid var(--border);
  background:var(--card);
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:#888;
}

.empty h2{
  color:#ddd;
}

/* =========================
   HERO
========================= */

.profile-hero{
  border:1px solid var(--border);
  border-radius:22px;
  background:
    radial-gradient(
      circle at 85% 15%,
      rgba(212,175,55,.16),
      transparent 28%
    ),
    linear-gradient(145deg,#171717,#0e0e0e);
  padding:30px;
  margin-bottom:25px;
}

.profile-top{
  display:flex;
  align-items:flex-start;
  gap:24px;
}

.business-logo{
  width:130px;
  height:130px;
  flex:0 0 130px;
  border-radius:18px;
  overflow:hidden;
  background:#222;
  border:1px solid #333;
  display:grid;
  place-items:center;
  color:var(--gold2);
  font-size:40px;
  font-weight:800;
}

.business-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.profile-main{
  flex:1;
  min-width:0;
}

.profile-main h1{
  margin:0 0 8px;
  font-size:clamp(30px,5vw,48px);
  line-height:1.1;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  color:var(--muted);
  margin:10px 0 15px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  background:#202020;
  border:1px solid #333;
}

.badge.gold{
  color:#111;
  background:var(--gold2);
  border-color:var(--gold2);
}

.badge.green{
  color:#a9f0c4;
  border-color:#285b3d;
  background:#122319;
}

.profile-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:20px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:1px solid #363636;
  background:#202020;
  color:#eee;
  padding:10px 15px;
  border-radius:9px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:.2s;
}

.btn:hover{
  border-color:var(--gold);
  color:var(--gold2);
}

.btn-primary{
  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );
  color:#111;
  border-color:var(--gold2);
  font-weight:800;
}

.btn-danger{
  border-color:#65312f;
  color:#ffb7b4;
  background:#211212;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:24px;
}

.stat{
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:24px;
  color:var(--gold2);
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   CONTENT
========================= */

.profile-grid{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(280px,1fr);
  gap:22px;
}

.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  margin-bottom:22px;
}

.profile-card h2{
  margin:0 0 18px;
  color:var(--gold2);
  font-size:22px;
}

.profile-card h3{
  color:#eee;
}

.description{
  color:#ccc;
  white-space:pre-line;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.info-item{
  padding:15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#111;
}

.info-label{
  color:#888;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:5px;
}

.info-value{
  color:#eee;
  word-break:break-word;
}

/* =========================
   PRODUCTS
========================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.product{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:#101010;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.product-body{
  padding:15px;
}

.product-body h3{
  margin:0 0 6px;
}

.product-body p{
  color:#aaa;
  margin:0 0 10px;
}

.price{
  color:var(--gold2);
  font-weight:800;
}

/* =========================
   HOURS
========================= */

.hours{
  display:grid;
  gap:7px;
}

.hours-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 12px;
  border-radius:8px;
  background:#111;
  border:1px solid #202020;
}

.hours-time{
  color:#aaa;
  text-align:right;
}

/* =========================
   PHOTOS
========================= */

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.photo-grid img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--border);
  cursor:pointer;
}

/* =========================
   REVIEWS
========================= */

.review-list{
  display:grid;
  gap:13px;
}

.review{
  padding:15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#101010;
}

.review-header{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.review-name{
  font-weight:700;
}

.review-rating{
  color:var(--gold2);
}

.review-comment{
  color:#bbb;
  margin-top:8px;
  white-space:pre-line;
}

.review-date{
  color:#666;
  font-size:12px;
  margin-top:8px;
}

/* =========================
   MAP
========================= */

#businessMap{
  height:350px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
}

/* =========================
   FORM
========================= */

.form{
  display:grid;
  gap:11px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  background:#090909;
  color:#eee;
  border:1px solid #333;
  border-radius:8px;
  padding:12px;
  outline:none;
}

.form textarea{
  min-height:120px;
}

.form input:focus,
.form textarea:focus,
.form select:focus{
  border-color:var(--gold);
}

/* =========================
   FOOTER
========================= */

footer{
  border-top:1px solid var(--border);
  padding:28px 0;
  color:#777;
  text-align:center;
}

footer a{
  color:var(--gold2);
  text-decoration:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .nav{
    display:none;
    position:absolute;
    top:72px;
    left:0;
    right:0;
    padding:15px;
    background:#0c0c0c;
    border-bottom:1px solid var(--border);
    flex-direction:column;
  }

  .nav.open{
    display:flex;
  }

  .mobile-menu{
    display:block;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }

  .profile-top{
    flex-direction:column;
  }

  .business-logo{
    width:105px;
    height:105px;
    flex-basis:105px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .product-grid{
    grid-template-columns:1fr;
  }

  .photo-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:550px){

  .page{
    padding-top:22px;
  }

  .profile-hero{
    padding:20px;
  }

  .profile-card{
    padding:18px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .photo-grid img{
    height:145px;
  }

  #businessMap{
    height:280px;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">

    <a class="logo" href="index.html">
      <div class="logo-mark">NA</div>
      Near<span>Africa</span>
    </a>

    <nav class="nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="list-business.html">List Your Business</a>
      <a href="claim-business.html">Claim Business</a>
    </nav>

    <button
      class="mobile-menu"
      id="mobileMenuButton"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      ☰
    </button>

  </div>
</header>

<main class="page">

  <div class="container">

    <div id="statusMessage"></div>

    <div id="loadingState" class="loading">

      <div>

        <div class="spinner"></div>

        <div>
          Loading business profile...
        </div>

      </div>

    </div>

    <div id="notFoundState" class="empty hidden">

      <h2>
        Business Not Found
      </h2>

      <p id="notFoundMessage">
        This business could not be loaded.
      </p>

      <a
        class="btn btn-primary"
        href="explore.html"
      >
        Back to Explore
      </a>

    </div>

    <div
      id="businessContent"
      class="hidden"
    ></div>

  </div>

</main>

<footer>
  <div class="container">
    © <span id="year"></span> NearAfrica.
    Find Great Businesses Near You.
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(() => {

  "use strict";

  const API_URL =
    "https://nearafrica-api.nearafrica-onyxtech.workers.dev";

  let activeBusiness = null;
  let activeMap = null;

  function clean(value){
    return String(value ?? "").trim();
  }

  function escapeHtml(value){
    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function escapeAttribute(value){
    return escapeHtml(value);
  }

  function formatNumber(value){
    const number = Number(value);

    if(!Number.isFinite(number)){
      return "0";
    }

    return number.toLocaleString();
  }

  function stars(rating){

    const value =
      Math.max(
        0,
        Math.min(
          5,
          Math.round(
            Number(rating) || 0
          )
        )
      );

    return (
      "★".repeat(value) +
      "☆".repeat(5 - value)
    );
  }

  function getIdentifier(){

    const params =
      new URLSearchParams(
        window.location.search
      );

    return (
      params.get("id") ||
      params.get("business_id") ||
      params.get("slug") ||
      ""
    ).trim();
  }

  async function apiRequest(path, options = {}){

    let response;

    try{

      response =
        await fetch(
          API_URL + path,
          {
            ...options,
            cache:"no-store",
            headers:{
              Accept:"application/json",
              ...(options.headers || {})
            }
          }
        );

    }catch(error){

      throw new Error(
        "Unable to connect to NearAfrica right now."
      );
    }

    let data = {};

    try{
      data = await response.json();
    }catch(error){
      data = {};
    }

    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        `Request failed (${response.status})`
      );
    }

    if(data.status === "error"){

      throw new Error(
        data.message ||
        "Request failed."
      );
    }

    return data;
  }

  function getBusinessName(business){

    return (
      business.business_name ||
      business.name ||
      "Business"
    );
  }

  function getLocation(business){

    return [
      business.address,
      business.area,
      business.city,
      business.state,
      business.country
    ]
      .map(clean)
      .filter(Boolean)
      .join(", ");
  }

  function getImage(business){

    const candidates = [
      business.logo_url,
      business.logo,
      business.image_url,
      business.image,
      business.imageUrl
    ];

    for(const value of candidates){

      if(clean(value)){
        return clean(value);
      }
    }

    if(Array.isArray(business.images)){

      for(const image of business.images){

        if(typeof image === "string" && clean(image)){
          return clean(image);
        }

        if(image && typeof image === "object"){

          const value =
            image.url ||
            image.image_url ||
            image.public_url ||
            image.src;

          if(clean(value)){
            return clean(value);
          }
        }
      }
    }

    return "";
  }

  function getImageUrl(image){

    if(typeof image === "string"){
      return clean(image);
    }

    if(!image || typeof image !== "object"){
      return "";
    }

    return clean(
      image.url ||
      image.image_url ||
      image.public_url ||
      image.src ||
      ""
    );
  }

  function showStatus(message, type = "info"){

    const element =
      document.getElementById(
        "statusMessage"
      );

    if(!element){
      return;
    }

    if(!message){

      element.style.display = "none";
      element.textContent = "";
      return;
    }

    element.style.display = "block";
    element.textContent = message;

    if(type === "error"){
      element.style.color = "#ffb1ad";
      element.style.borderColor = "#65312f";
    }else if(type === "success"){
      element.style.color = "#9ee8b9";
      element.style.borderColor = "#285b3d";
    }else{
      element.style.color = "#ccc";
      element.style.borderColor = "#292929";
    }
  }

  function initializeMap(business){

    const mapElement =
      document.getElementById(
        "businessMap"
      );

    if(
      !mapElement ||
      typeof L === "undefined"
    ){
      return;
    }

    const latitude =
      Number(business.latitude);

    const longitude =
      Number(business.longitude);

    if(
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude)
    ){

      mapElement.innerHTML = `
        <div style="
          height:100%;
          display:grid;
          place-items:center;
          background:#111;
          color:#777;
          text-align:center;
          padding:20px;
        ">
          Location coordinates are not available.
        </div>
      `;

      return;
    }

    if(activeMap){
      activeMap.remove();
      activeMap = null;
    }

    activeMap =
      L.map(
        mapElement
      ).setView(
        [latitude, longitude],
        15
      );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          "© OpenStreetMap contributors"
      }
    ).addTo(activeMap);

    L.marker(
      [latitude, longitude]
    )
    .addTo(activeMap)
    .bindPopup(
      escapeHtml(
        getBusinessName(business)
      )
    )
    .openPopup();
  }

  function renderProducts(products){

    if(!Array.isArray(products) || !products.length){
      return "";
    }

    return `
      <section class="profile-card">

        <h2>
          Products & Services
        </h2>

        <div class="product-grid">

          ${products.map(product => {

            const image =
              getImageUrl(
                product.image_url ||
                product.image ||
                product.public_url
              );

            const name =
              product.name ||
              product.title ||
              "Product";

            const description =
              product.description || "";

            const price =
              product.price;

            return `
              <article class="product">

                ${
                  image
                    ? `
                      <img
                        src="${escapeAttribute(image)}"
                        alt="${escapeAttribute(name)}"
                        loading="lazy"
                        onerror="this.style.display='none'"
                      >
                    `
                    : ""
                }

                <div class="product-body">

                  <h3>
                    ${escapeHtml(name)}
                  </h3>

                  ${
                    description
                      ? `
                        <p>
                          ${escapeHtml(description)}
                        </p>
                      `
                      : ""
                  }

                  ${
                    price !== undefined &&
                    price !== null &&
                    clean(price)
                      ? `
                        <div class="price">
                          ${escapeHtml(
                            product.currency || "NGN"
                          )}
                          ${escapeHtml(price)}
                        </div>
                      `
                      : ""
                  }

                </div>

              </article>
            `;

          }).join("")}

        </div>

      </section>
    `;
  }

  function renderImages(images, businessName){

    if(!Array.isArray(images) || !images.length){
      return "";
    }

    const html =
      images
        .map(image => {

          const source =
            getImageUrl(image);

          if(!source){
            return "";
          }

          return `
            <img
              src="${escapeAttribute(source)}"
              alt="${escapeAttribute(businessName)}"
              loading="lazy"
              onclick="window.open('${escapeAttribute(source)}','_blank','noopener,noreferrer')"
              onerror="this.style.display='none'"
            >
          `;

        })
        .join("");

    if(!html){
      return "";
    }

    return `
      <section class="profile-card">

        <h2>
          Photos
        </h2>

        <div class="photo-grid">
          ${html}
        </div>

      </section>
    `;
  }

  function renderHours(hours){

    if(!Array.isArray(hours) || !hours.length){
      return "";
    }

    return `
      <section class="profile-card">

        <h2>
          Opening Hours
        </h2>

        <div class="hours">

          ${hours.map(hour => {

            const day =
              hour.day ||
              hour.day_name ||
              hour.weekday ||
              "";

            const open =
              hour.open ||
              hour.open_time ||
              "";

            const close =
              hour.close ||
              hour.close_time ||
              "";

            const closed =
              hour.closed === true ||
              hour.is_closed === true ||
              Number(hour.closed) === 1 ||
              Number(hour.is_closed) === 1;

            return `
              <div class="hours-row">

                <strong>
                  ${escapeHtml(day)}
                </strong>

                <span class="hours-time">

                  ${
                    closed
                      ? "Closed"
                      : escapeHtml(
                          [open,close]
                            .filter(Boolean)
                            .join(" — ")
                        ) || "Hours unavailable"
                  }

                </span>

              </div>
            `;

          }).join("")}

        </div>

      </section>
    `;
  }

  function renderReviews(reviews){

    const list =
      Array.isArray(reviews)
        ? reviews
        : [];

    return `
      <section class="profile-card">

        <h2>
          Reviews
        </h2>

        ${
          list.length

            ? `
              <div class="review-list">

                ${list.map(review => {

                  const name =
                    review.name ||
                    review.reviewer_name ||
                    "Anonymous";

                  const comment =
                    review.comment ||
                    review.review ||
                    "";

                  return `
                    <article class="review">

                      <div class="review-header">

                        <div class="review-name">
                          ${escapeHtml(name)}
                        </div>

                        <div class="review-rating">
                          ${stars(review.rating)}
                        </div>

                      </div>

                      <div class="review-comment">
                        ${escapeHtml(comment)}
                      </div>

                      ${
                        review.created_at
                          ? `
                            <div class="review-date">
                              ${escapeHtml(
                                new Date(
                                  review.created_at
                                ).toLocaleDateString()
                              )}
                            </div>
                          `
                          : ""
                      }

                    </article>
                  `;

                }).join("")}

              </div>
            `

            : `
              <div class="empty">
                No approved reviews yet.
              </div>
            `
        }

      </section>
    `;
  }

  function displayBusiness(business, result){

    activeBusiness = business;

    const name =
      getBusinessName(business);

    const location =
      getLocation(business);

    const category =
      clean(business.category);

    const description =
      clean(business.description);

    const phone =
      clean(business.phone);

    const whatsapp =
      clean(
        business.whatsapp
      ).replace(
        /[^\d+]/g,
        ""
      );

    const email =
      clean(business.email);

    const website =
      clean(business.website);

    const image =
      getImage(business);

    const verified =
      Number(business.verified) === 1;

    const claimed =
      Number(business.claimed) === 1;

    const featured =
      Number(business.featured) === 1;

    const statistics =
      result.statistics || {};

    const views =
      Number(
        statistics.views ??
        business.views ??
        0
      );

    const averageRating =
      Number(
        statistics.average_rating ??
        business.average_rating ??
        0
      );

    const reviewCount =
      Number(
        statistics.review_count ??
        (Array.isArray(result.reviews)
          ? result.reviews.length
          : business.review_count || 0)
      );

    const reviews =
      Array.isArray(result.reviews)
        ? result.reviews
        : [];

    const products =
      Array.isArray(result.products)
        ? result.products
        : [];

    const hours =
      Array.isArray(result.hours)
        ? result.hours
        : [];

    const images =
      Array.isArray(result.images)
        ? result.images
        : Array.isArray(business.images)
          ? business.images
          : [];

    const initial =
      name
        .charAt(0)
        .toUpperCase();

    const content =
      document.getElementById(
        "businessContent"
      );

    content.innerHTML = `

      <section class="profile-hero">

        <div class="profile-top">

          <div class="business-logo">

            ${
              image

                ? `
                  <img
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(name)}"
                    onerror="
                      this.onerror=null;
                      this.style.display='none';
                      this.parentElement.textContent='${escapeAttribute(initial)}';
                    "
                  >
                `

                : escapeHtml(initial)
            }

          </div>

          <div class="profile-main">

            <h1>
              ${escapeHtml(name)}
            </h1>

            <div class="meta">

              ${
                category
                  ? `
                    <span>
                      ${escapeHtml(category)}
                    </span>
                  `
                  : ""
              }

              ${
                location
                  ? `
                    <span>•</span>
                    <span>
                      ${escapeHtml(location)}
                    </span>
                  `
                  : ""
              }

            </div>

            <div class="badges">

              ${
                verified
                  ? `
                    <span class="badge green">
                      ✓ Verified
                    </span>
                  `
                  : ""
              }

              ${
                claimed
                  ? `
                    <span class="badge gold">
                      ✓ Claimed
                    </span>
                  `
                  : ""
              }

              ${
                featured
                  ? `
                    <span class="badge gold">
                      Featured
                    </span>
                  `
                  : ""
              }

            </div>

            <div class="profile-actions">

              ${
                phone
                  ? `
                    <a
                      class="btn btn-primary"
                      href="tel:${escapeAttribute(phone)}"
                    >
                      Call
                    </a>
                  `
                  : ""
              }

              ${
                whatsapp
                  ? `
                    <a
                      class="btn"
                      href="https://wa.me/${escapeAttribute(
                        whatsapp.replace(/^\\+/,"")
                      )}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      WhatsApp
                    </a>
                  `
                  : ""
              }

              ${
                email
                  ? `
                    <a
                      class="btn"
                      href="mailto:${escapeAttribute(email)}"
                    >
                      Email
                    </a>
                  `
                  : ""
              }

              ${
                website
                  ? `
                    <a
                      class="btn"
                      href="${escapeAttribute(
                        /^https?:\\/\\//i.test(website)
                          ? website
                          : "https://" + website
                      )}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Website
                    </a>
                  `
                  : ""
              }

            </div>

          </div>

        </div>

        <div class="stats">

          <div class="stat">
            <strong>
              ${formatNumber(views)}
            </strong>
            <span>
              Views
            </span>
          </div>

          <div class="stat">
            <strong>
              ${
                averageRating
                  ? averageRating.toFixed(1)
                  : "—"
              }
            </strong>
            <span>
              ${
                averageRating
                  ? stars(averageRating)
                  : "No rating yet"
              }
            </span>
          </div>

          <div class="stat">
            <strong>
              ${formatNumber(reviewCount)}
            </strong>
            <span>
              Reviews
            </span>
          </div>

        </div>

      </section>

      <div class="profile-grid">

        <div>

          ${
            description
              ? `
                <section class="profile-card">

                  <h2>
                    About
                  </h2>

                  <div class="description">
                    ${escapeHtml(description)}
                  </div>

                </section>
              `
              : ""
          }

          ${renderProducts(products)}

          ${renderImages(images,name)}

          ${renderReviews(reviews)}

          <section class="profile-card">

            <h2>
              Location
            </h2>

            ${
              location
                ? `
                  <p style="color:#aaa">
                    ${escapeHtml(location)}
                  </p>
                `
                : ""
            }

            <div id="businessMap"></div>

          </section>

        </div>

        <aside>

          <section class="profile-card">

            <h2>
              Business Information
            </h2>

            <div class="info-grid">

              ${
                category
                  ? `
                    <div class="info-item">
                      <div class="info-label">
                        Category
                      </div>
                      <div class="info-value">
                        ${escapeHtml(category)}
                      </div>
                    </div>
                  `
                  : ""
              }

              ${
                location
                  ? `
                    <div class="info-item">
                      <div class="info-label">
                        Address
                      </div>
                      <div class="info-value">
                        ${escapeHtml(location)}
                      </div>
                    </div>
                  `
                  : ""
              }

              ${
                phone
                  ? `
                    <div class="info-item">
                      <div class="info-label">
                        Phone
                      </div>
                      <div class="info-value">
                        ${escapeHtml(phone)}
                      </div>
                    </div>
                  `
                  : ""
              }

              ${
                email
                  ? `
                    <div class="info-item">
                      <div class="info-label">
                        Email
                      </div>
                      <div class="info-value">
                        ${escapeHtml(email)}
                      </div>
                    </div>
                  `
                  : ""
              }

              ${
                website
                  ? `
                    <div class="info-item">
                      <div class="info-label">
                        Website
                      </div>
                      <div class="info-value">
                        ${escapeHtml(website)}
                      </div>
                    </div>
                  `
                  : ""
              }

            </div>

          </section>

          ${renderHours(hours)}

          <section class="profile-card">

            <h2>
              Listing Actions
            </h2>

            <div
              style="
                display:grid;
                gap:9px;
              "
            >

              <button
                type="button"
                class="btn"
                id="reportButton"
              >
                Report Listing
              </button>

              <button
                type="button"
                class="btn"
                id="correctionButton"
              >
                Suggest a Correction
              </button>

            </div>

          </section>

        </aside>

      </div>
    `;

    document
      .getElementById(
        "loadingState"
      )
      .classList.add("hidden");

    content.classList.remove("hidden");

    initializeMap(business);

    setupActions();

  }

  function setupActions(){

    const reportButton =
      document.getElementById(
        "reportButton"
      );

    const correctionButton =
      document.getElementById(
        "correctionButton"
      );

    if(reportButton){

      reportButton.addEventListener(
        "click",
        () => {

          const reason =
            window.prompt(
              "Why are you reporting this listing?"
            );

          if(!reason){
            return;
          }

          submitReport(reason);

        }
      );

    }

    if(correctionButton){

      correctionButton.addEventListener(
        "click",
        () => {

          const correction =
            window.prompt(
              "What information should be corrected?"
            );

          if(!correction){
            return;
          }

          submitCorrection(correction);

        }
      );

    }

  }

  async function submitReport(reason){

    try{

      await apiRequest(
        "/reports",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            business_id:
              activeBusiness.id,
            report_type:
              "listing_report",
            reason
          })
        }
      );

      showStatus(
        "Report submitted successfully.",
        "success"
      );

    }catch(error){

      showStatus(
        error.message ||
        "Unable to submit report.",
        "error"
      );

    }

  }

  async function submitCorrection(correction){

    try{

      await apiRequest(
        `/businesses/${encodeURIComponent(
          activeBusiness.id
        )}/corrections`,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            requested_changes:{
              description:
                correction
            }
          })
        }
      );

      showStatus(
        "Correction request submitted.",
        "success"
      );

    }catch(error){

      showStatus(
        error.message ||
        "Unable to submit correction.",
        "error"
      );

    }

  }

  async function recordView(id){

    try{

      await fetch(
        `${API_URL}/businesses/${encodeURIComponent(
          id
        )}/view`,
        {
          method:"POST",
          cache:"no-store"
        }
      );

    }catch(error){

      console.warn(
        "Business view tracking failed:",
        error
      );

    }

  }

  function showNotFound(message){

    document
      .getElementById(
        "loadingState"
      )
      .classList.add("hidden");

    document
      .getElementById(
        "businessContent"
      )
      .classList.add("hidden");

    const state =
      document.getElementById(
        "notFoundState"
      );

    state.classList.remove("hidden");

    document.getElementById(
      "notFoundMessage"
    ).textContent =
      message ||
      "This business could not be found.";

  }

  async function loadBusiness(){

    const identifier =
      getIdentifier();

    if(!identifier){

      showNotFound(
        "No business ID or slug was provided."
      );

      return;
    }

    try{

      const result =
        await apiRequest(
          `/businesses/${encodeURIComponent(
            identifier
          )}?_=${Date.now()}`
        );

      if(!result.business){

        showNotFound(
          result.message ||
          "This business could not be found."
        );

        return;
      }

      displayBusiness(
        result.business,
        result
      );

      recordView(
        result.business.id ||
        identifier
      );

    }catch(error){

      console.error(
        "Business loading failed:",
        error
      );

      showNotFound(
        error.message ||
        "Unable to load this business right now."
      );

    }

  }

  const mobileMenuButton =
    document.getElementById(
      "mobileMenuButton"
    );

  const mainNav =
    document.getElementById(
      "mainNav"
    );

  if(
    mobileMenuButton &&
    mainNav
  ){

    mobileMenuButton.addEventListener(
      "click",
      () => {

        const open =
          mainNav.classList.toggle(
            "open"
          );

        mobileMenuButton.setAttribute(
          "aria-expanded",
          String(open)
        );

      }
    );

  }

  document.getElementById(
    "year"
  ).textContent =
    new Date().getFullYear();

  loadBusiness();

})();
</script>

</body>
</html>
