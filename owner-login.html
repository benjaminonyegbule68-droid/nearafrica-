<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Owner Login | NearAfrica</title>

  <meta
    name="description"
    content="Secure owner login for NearAfrica business owners."
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        Arial,
        sans-serif;

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #0d0d0d,
          #1a1a1a
        );

      color: #ffffff;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;

      margin-bottom: 24px;
    }

    .brand-mark {
      width: 52px;
      height: 52px;

      margin: 0 auto 12px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: #111111;

      border:
        1px solid #d4af37;

      color: #d4af37;

      font-size: 20px;

      font-weight: 800;
    }

    .brand h1 {
      font-size: 28px;

      margin-bottom: 6px;
    }

    .brand p {
      color: #aaaaaa;

      font-size: 14px;
    }

    .card {
      background: #ffffff;

      color: #171717;

      border-radius: 18px;

      padding: 30px;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 22px;

      margin-bottom: 8px;
    }

    .card-intro {
      color: #666666;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      height: 48px;

      border:
        1px solid #d9d9d9;

      border-radius: 9px;

      padding: 0 14px;

      font-size: 14px;

      outline: none;
    }

    input:focus {
      border-color: #d4af37;

      box-shadow:
        0 0 0 3px
        rgba(212, 175, 55, 0.12);
    }

    .login-button {
      width: 100%;

      height: 50px;

      border: none;

      border-radius: 9px;

      background: #111111;

      color: #ffffff;

      font-weight: 700;

      cursor: pointer;

      transition:
        opacity 0.2s ease;
    }

    .login-button:hover {
      opacity: 0.88;
    }

    .login-button:disabled {
      opacity: 0.55;

      cursor: not-allowed;
    }

    .status {
      display: none;

      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 8px;

      font-size: 13px;

      line-height: 1.5;
    }

    .status.error {
      display: block;

      background: #fff1f1;

      color: #a10000;

      border:
        1px solid #ffd1d1;
    }

    .status.success {
      display: block;

      background: #effaf1;

      color: #236b2d;

      border:
        1px solid #ccebd0;
    }

    .links {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 16px;

      margin-top: 22px;

      font-size: 13px;
    }

    .links a {
      color: #777777;

      text-decoration: none;
    }

    .links a:hover {
      color: #111111;
    }

    .note {
      margin-top: 18px;

      padding: 12px 14px;

      border-radius: 8px;

      background: #faf6e7;

      color: #6d5a1b;

      font-size: 12px;

      line-height: 1.5;
    }

    @media (max-width: 520px) {

      body {
        padding: 16px;
      }

      .card {
        padding: 22px;
      }

    }

  </style>

</head>


<body>


  <main class="page">


    <div class="brand">

      <div class="brand-mark">
        NA
      </div>

      <h1>
        NearAfrica
      </h1>

      <p>
        Business Owner Portal
      </p>

    </div>


    <section class="card">

      <h2>
        Owner Login
      </h2>

      <p class="card-intro">
        Sign in to manage your claimed business
        on NearAfrica.
      </p>


      <form id="loginForm">


        <div class="field">

          <label for="businessName">
            Business Name
          </label>

          <input
            id="businessName"
            name="business_name"
            type="text"
            autocomplete="organization"
            placeholder="Enter your business name"
            required
          >

        </div>


        <div class="field">

          <label for="email">
            Owner Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Enter your owner email"
            required
          >

        </div>


        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          Sign In
        </button>


      </form>


      <div
        id="statusMessage"
        class="status"
        role="status"
      ></div>


      <div class="note">
        Owner access requires an approved and
        verified ownership claim for the business.
      </div>


      <div class="links">

        <a href="index.html">
          Home
        </a>

        <a href="explore.html">
          Explore
        </a>

        <a href="claim-business.html">
          Claim Business
        </a>

      </div>

    </section>


  </main>


  <script>

    (() => {

      "use strict";


      const API_BASE =
        "https://nearafrica-api.nearafrica-onyxtech.workers.dev";


      const OWNER_TOKEN_KEY =
        "nearafrica_owner_token";


      const form =
        document.getElementById(
          "loginForm"
        );


      const loginButton =
        document.getElementById(
          "loginButton"
        );


      const statusMessage =
        document.getElementById(
          "statusMessage"
        );


      function showStatus(
        message,
        type
      ) {

        statusMessage.textContent =
          message;

        statusMessage.className =
          `status ${type}`;

      }


      form.addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          const businessName =
            document
              .getElementById(
                "businessName"
              )
              .value
              .trim();


          const email =
            document
              .getElementById(
                "email"
              )
              .value
              .trim()
              .toLowerCase();


          if (!businessName) {

            showStatus(
              "Please enter your business name.",
              "error"
            );

            return;

          }


          if (!email) {

            showStatus(
              "Please enter your owner email.",
              "error"
            );

            return;

          }


          loginButton.disabled =
            true;

          loginButton.textContent =
            "Signing In...";


          statusMessage.className =
            "status";


          try {

            const response =
              await fetch(
                `${API_BASE}/owner/login`,
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json",

                    "Accept":
                      "application/json"
                  },

                  body:
                    JSON.stringify({
                      business_name:
                        businessName,

                      email:
                        email
                    })
                }
              );


            const data =
              await response.json();


            if (
              !response.ok ||
              !data ||
              data.status !== "ok"
            ) {

              throw new Error(
                data &&
                data.message
                  ? data.message
                  : "Owner login failed."
              );

            }


            if (!data.token) {

              throw new Error(
                "The server did not return an owner session token."
              );

            }


            try {

              localStorage.setItem(
                OWNER_TOKEN_KEY,
                data.token
              );

            } catch (storageError) {

              console.error(
                "OWNER TOKEN STORAGE ERROR:",
                storageError
              );

              throw new Error(
                "Login succeeded, but this browser could not save the owner session."
              );

            }


            showStatus(
              "Login successful. Opening your owner dashboard...",
              "success"
            );


            window.setTimeout(
              () => {

                window.location.href =
                  data.dashboard_url ||
                  "pages/owner-dashboard.html";

              },
              500
            );


          } catch (error) {

            console.error(
              "OWNER LOGIN ERROR:",
              error
            );


            showStatus(
              error.message ||
                "Unable to sign in. Please try again.",
              "error"
            );


          } finally {

            loginButton.disabled =
              false;

            loginButton.textContent =
              "Sign In";

          }

        }
      );


    })();

  </script>


</body>

</html>
