<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NearAfrica Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #0d0d0d;
            color: #f5f5f5;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 32px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .login-logo {
            width: 58px;
            height: 58px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #d4af37;
            color: #111;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 18px;
        }

        .login-card h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .login-card p {
            color: #999;
            margin: 0 0 25px;
            line-height: 1.6;
        }

        .login-card input {
            width: 100%;
            padding: 14px 15px;
            background: #0e0e0e;
            color: white;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
            margin-bottom: 12px;
        }

        .login-card input:focus {
            border-color: #d4af37;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #d4af37;
            color: #111;
            font-weight: 800;
        }

        .primary-btn:hover {
            opacity: 0.9;
        }

        .login-error {
            margin-top: 15px;
            color: #ff6b6b;
            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================
           ADMIN
        ========================= */

        .admin-shell {
            min-height: 100vh;
        }

        .topbar {
            height: 72px;
            border-bottom: 1px solid #292929;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #d4af37;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .brand span {
            color: #d4af37;
        }

        .logout-btn {
            border: 1px solid #383838;
            background: transparent;
            color: #ddd;
            padding: 9px 14px;
            border-radius: 8px;
        }

        .logout-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .main {
            padding: 28px;
            max-width: 1500px;
            margin: auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            margin: 0 0 6px;
            font-size: 30px;
        }

        .page-title p {
            margin: 0;
            color: #888;
        }

        /* =========================
           STATS
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 20px;
        }

        .stat-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
        }

        /* =========================
           TABS
        ========================= */

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .tab {
            white-space: nowrap;
            border: 1px solid #303030;
            background: #151515;
            color: #aaa;
            padding: 10px 15px;
            border-radius: 9px;
        }

        .tab:hover {
            color: #fff;
        }

        .tab.active {
            background: #d4af37;
            border-color: #d4af37;
            color: #111;
            font-weight: 800;
        }

        /* =========================
           CONTENT
        ========================= */

        .panel {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 15px;
            overflow: hidden;
        }

        .panel-header {
            padding: 18px 20px;
            border-bottom: 1px solid #292929;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .refresh-btn {
            border: 1px solid #383838;
            background: #111;
            color: #ddd;
            padding: 9px 13px;
            border-radius: 8px;
        }

        .refresh-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #252525;
            vertical-align: middle;
        }

        th {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        td {
            color: #ddd;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .muted {
            color: #777;
        }

        .empty {
            padding: 45px 20px;
            text-align: center;
            color: #777;
        }

        .loading {
            padding: 45px 20px;
            text-align: center;
            color: #aaa;
        }

        .error-box {
            margin: 18px;
            padding: 14px;
            border-radius: 10px;
            background: rgba(255, 80, 80, 0.08);
            border: 1px solid rgba(255, 80, 80, 0.3);
            color: #ff8585;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status.pending {
            background: rgba(212, 175, 55, 0.13);
            color: #e6c85c;
        }

        .status.approved,
        .status.active {
            background: rgba(70, 200, 120, 0.12);
            color: #70d99a;
        }

        .status.rejected {
            background: rgba(255, 80, 80, 0.12);
            color: #ff8585;
        }

        /* =========================
           ACTION BUTTONS
        ========================= */

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 0;
            border-radius: 7px;
            padding: 8px 11px;
            font-size: 12px;
            font-weight: 700;
        }

        .approve-btn {
            background: #46c878;
            color: #07140c;
        }

        .approve-btn:hover {
            opacity: 0.85;
        }

        .reject-btn {
            background: #ef5350;
            color: white;
        }

        .reject-btn:hover {
            opacity: 0.85;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .claim-id {
            font-family: monospace;
            font-size: 12px;
            color: #999;
        }

        .business-id {
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            word-break: break-all;
        }

        /* =========================
           TOAST
        ========================= */

        #toast {
            position: fixed;
            right: 22px;
            bottom: 22px;
            max-width: 360px;
            padding: 14px 17px;
            border-radius: 10px;
            background: #222;
            border: 1px solid #333;
            color: white;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
            z-index: 1000;
            display: none;
        }

        #toast.success {
            border-color: #46c878;
        }

        #toast.error {
            border-color: #ef5350;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .topbar {
                padding: 0 15px;
            }

            .main {
                padding: 18px 12px;
            }

            .brand-text {
                display: none;
            }

            .page-title h1 {
                font-size: 25px;
            }

            .stats-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .stat-card {
                padding: 15px;
            }

            .stat-value {
                font-size: 23px;
            }

        }

    </style>

</head>

<body>

<script>

/* =========================================================
   CURRENT NEARAFRICA API
========================================================= */

const API_BASE =
    "https://nearafrica-api.nearafrica-onyxtech.workers.dev";


/* =========================================================
   STATE
========================================================= */

let adminKey =
    sessionStorage.getItem(
        "nearafrica_admin_key"
    ) || "";

let currentResource =
    "businesses";


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const adminApp =
    document.getElementById(
        "adminApp"
    );

const adminKeyInput =
    document.getElementById(
        "adminKeyInput"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const content =
    document.getElementById(
        "content"
    );

const panelTitle =
    document.getElementById(
        "panelTitle"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type = "success"
) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.className =
        type;

    toast.style.display =
        "block";

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(() => {

            toast.style.display =
                "none";

        }, 4000);
}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    path,
    options = {}
) {

    const headers = {
        ...(options.headers || {})
    };

    if (adminKey) {

        headers[
            "X-Admin-Key"
        ] = adminKey;

    }

    if (
        options.body &&
        !headers["Content-Type"]
    ) {

        headers[
            "Content-Type"
        ] = "application/json";

    }

    const response =
        await fetch(
            API_BASE + path,
            {
                ...options,
                headers
            }
        );

    let data = null;

    try {

        data =
            await response.json();

    } catch {

        data = {};

    }

    if (
        response.status === 401
    ) {

        throw new Error(
            "Unauthorized. Check that your Admin API Key is correct and that the Worker ADMIN_API_KEY secret matches it."
        );

    }

    if (!response.ok) {

        throw new Error(
            data.message ||
            data.error ||
            `Request failed (${response.status})`
        );

    }

    return data;

}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

    const key =
        adminKeyInput.value.trim();

    if (!key) {

        loginError.textContent =
            "Please enter your Admin API Key.";

        return;

    }

    loginButton.disabled =
        true;

    loginButton.textContent =
        "Signing in...";

    loginError.textContent =
        "";

    try {

        /*
         * We deliberately test the CURRENT API.
         * Do not put the key in the URL.
         */
        const response =
            await fetch(
                API_BASE +
                "/admin/businesses?limit=1",
                {
                    headers: {
                        "X-Admin-Key":
                            key
                    }
                }
            );

        let data = {};

        try {

            data =
                await response.json();

        } catch {}

        if (
            response.status === 401
        ) {

            throw new Error(
                "Invalid Admin API Key."
            );

        }

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                `Login failed (${response.status})`
            );

        }

        adminKey =
            key;

        sessionStorage.setItem(
            "nearafrica_admin_key",
            adminKey
        );

        showAdmin();

    } catch (error) {

        console.error(
            "Admin login error:",
            error
        );

        loginError.textContent =
            error.message ||
            "Unable to sign in.";

    } finally {

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Sign In";

    }

}


/* =========================================================
   SHOW ADMIN
========================================================= */

function showAdmin() {

    loginScreen.classList.add(
        "hidden"
    );

    adminApp.classList.remove(
        "hidden"
    );

    loadStats();

    loadResource(
        currentResource
    );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    adminKey = "";

    sessionStorage.removeItem(
        "nearafrica_admin_key"
    );

    adminApp.classList.add(
        "hidden"
    );

    loginScreen.classList.remove(
        "hidden"
    );

    adminKeyInput.value =
        "";

    loginError.textContent =
        "";

}


/* =========================================================
   STATS
========================================================= */

async function loadStats() {

    try {

        const result =
            await apiRequest(
                "/admin/stats"
            );

        const stats =
            result.stats ||
            result.data ||
            result;

        document.getElementById(
            "statBusinesses"
        ).textContent =
            stats.businesses ??
            stats.business_count ??
            0;

        document.getElementById(
            "statSubmissions"
        ).textContent =
            stats.submissions ??
            stats.submission_count ??
            0;

        document.getElementById(
            "statClaims"
        ).textContent =
            stats.claims ??
            stats.claim_count ??
            0;

        document.getElementById(
            "statReviews"
        ).textContent =
            stats.reviews ??
            stats.review_count ??
            0;

        document.getElementById(
            "statReports"
        ).textContent =
            stats.reports ??
            stats.report_count ??
            0;

        document.getElementById(
            "statHelpWanted"
        ).textContent =
            stats.help_wanted ??
            stats.helpWanted ??
            0;

    } catch (error) {

        console.error(
            "Stats error:",
            error
        );

    }

}


/* =========================================================
   LOAD RESOURCE
========================================================= */

async function loadResource(
    resource
) {

    currentResource =
        resource;

    panelTitle.textContent =
        resource
            .replaceAll("_", " ")
            .replace(
                /\b\w/g,
                c => c.toUpperCase()
            );

    content.innerHTML =
        `<div class="loading">
            Loading ${resource.replaceAll("_", " ")}...
        </div>`;

    try {

        const result =
            await apiRequest(
                `/admin/${encodeURIComponent(resource)}?limit=100`
            );

        const records =
            getRecords(
                result,
                resource
            );

        if (!records.length) {

            content.innerHTML =
                `<div class="empty">
                    No ${resource.replaceAll("_", " ")} found.
                </div>`;

            return;

        }

        if (
            resource === "claims"
        ) {

            renderClaims(
                records
            );

            return;

        }

       if (
    resource === "submissions"
) {

    renderSubmissions(
        records
    );

    return;

}

if (
    resource === "reports"
) {

    renderReports(
        records
    );

    return;

}

renderGeneric(
    records,
    resource
);

    } catch (error) {

        console.error(
            `${resource} error:`,
            error
        );

        content.innerHTML =
            `<div class="error-box">
                ${escapeHtml(
                    error.message ||
                    "Unable to load data."
                )}
            </div>`;

    }

}


/* =========================================================
   EXTRACT RECORDS
========================================================= */

function getRecords(
    result,
    resource
) {

    if (
        Array.isArray(result)
    ) {

        return result;

    }

    if (
        Array.isArray(
            result[resource]
        )
    ) {

        return result[resource];

    }

    if (
        Array.isArray(
            result.data
        )
    ) {

        return result.data;

    }

    if (
        Array.isArray(
            result.results
        )
    ) {

        return result.results;

    }

    return [];

}


/* =========================================================
   CLAIMS
========================================================= */

function renderClaims(
    claims
) {

    const rows =
        claims.map(
            claim => {

                const status =
                    String(
                        claim.status ||
                        "pending"
                    ).toLowerCase();

                const claimId =
                    claim.id ||
                    claim.claim_id ||
                    "";

                const businessId =
                    claim.business_id ||
                    "";

                const claimant =
                    claim.claimant_name ||
                    "Unknown";

                const email =
                    claim.claimant_email ||
                    "—";

                const evidence =
                    claim.evidence_type ||
                    claim.proof ||
                    "—";

                const details =
                    claim.evidence_details ||
                    claim.message ||
                    "—";

                let actions =
                    `<span class="muted">No action needed</span>`;

                if (
                    status === "pending"
                ) {

                    actions = `
                        <div class="actions">

                            <button
                                class="action-btn approve-btn"
                                type="button"
                                onclick="approveClaim('${escapeAttribute(claimId)}')"
                            >
                                Approve
                            </button>

                            <button
                                class="action-btn reject-btn"
                                type="button"
                                onclick="rejectClaim('${escapeAttribute(claimId)}')"
                            >
                                Reject
                            </button>

                        </div>
                    `;

                }

                return `
                    <tr>

                        <td>
                            <strong>
                                ${escapeHtml(
                                    claimant
                                )}
                            </strong>

                            <div class="claim-id">
                                ${escapeHtml(
                                    claimId
                                )}
                            </div>

/* =========================================================
   APPROVE CLAIM
========================================================= */

async function approveClaim(
    claimId
) {

    if (!claimId) {

        showToast(
            "Invalid claim ID.",
            "error"
        );

        return;

    }

    const confirmed =
        confirm(
            "Approve this claim?\n\nThis will mark the business as claimed and assign ownership."
        );

    if (!confirmed) {

        return;

    }

    try {

        showToast(
            "Approving claim...",
            "success"
        );

        const result =
            await apiRequest(
                `/admin/claims/${encodeURIComponent(claimId)}/approve`,
                {
                    method: "POST"
                }
            );

        console.log(
            "Approve claim response:",
            result
        );

        showToast(
            result.message ||
            "Claim approved successfully.",
            "success"
        );

        await loadResource(
            "claims"
        );

        await loadStats();

    } catch (error) {

        console.error(
            "Approve claim error:",
            error
        );

        showToast(
            error.message ||
            "Unable to approve claim.",
            "error"
        );

    }

}


/* =========================================================
   REJECT CLAIM
========================================================= */

async function rejectClaim(
    claimId
) {

    if (!claimId) {

        showToast(
            "Invalid claim ID.",
            "error"
        );

        return;

    }

    const confirmed =
        confirm(
            "Reject this claim?"
        );

    if (!confirmed) {

        return;

    }

    try {

        /*
         * The frontend uses the standard REST route.
         * If the current Worker does not yet contain
         * this route, the API will return Route not found.
         */
        const result =
            await apiRequest(
                `/admin/claims/${encodeURIComponent(claimId)}/reject`,
                {
                    method: "POST"
                }
            );

        console.log(
            "Reject claim response:",
            result
        );

        showToast(
            result.message ||
            "Claim rejected successfully.",
            "success"
        );

        await loadResource(
            "claims"
        );

        await loadStats();

    } catch (error) {

        console.error(
            "Reject claim error:",
            error
        );

        showToast(
            error.message ||
            "Unable to reject claim.",
            "error"
        );

    }

}

/* =========================================================
   GENERIC TABLE
========================================================= */

function renderGeneric(
    records,
    resource
) {

    if (!records.length) {

        content.innerHTML =
            `<div class="empty">
                No records found.
            </div>`;

        return;

    }

    const keys =
        Object.keys(
            records[0]
        ).slice(
            0,
            8
        );

    const headers =
        keys.map(
            key => `
                <th>
                    ${escapeHtml(
                        key.replaceAll(
                            "_",
                            " "
                        )
                    )}
                </th>
            `
        ).join("");

    const rows =
        records.map(
            record => {

                return `
                    <tr>
                        ${keys.map(
                            key => {

                                let value =
                                    record[key];

                                if (
                                    value === null ||
                                    value === undefined ||
                                    value === ""
                                ) {

                                    value = "—";

                                }

                                return `
                                    <td>
                                        ${escapeHtml(
                                            String(value)
                                        )}
                                    </td>
                                `;

                            }
                        ).join("")}
                    </tr>
                `;

            }
        ).join("");

    content.innerHTML = `

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        ${headers}
                    </tr>
                </thead>

                <tbody>
                    ${rows}
                </tbody>

            </table>

        </div>

    `;

}


/* =========================================================
   ESCAPING
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeAttribute(
    value
) {

    return String(
        value ?? ""
    )
    .replaceAll(
        "\\",
        "\\\\"
    )
    .replaceAll(
        "'",
        "\\'"
    );

}
