<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NearAfrica Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #171717;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header span {
      color: #d4af37;
    }

    main {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .login-panel {
      max-width: 500px;
      margin: 80px auto;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      margin: 8px 0 15px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      margin: 3px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .gold {
      background: #d4af37;
      color: #111;
    }

    .dark {
      background: #222;
      color: white;
    }

    .red {
      background: #b42318;
      color: white;
    }

    .green {
      background: #16803c;
      color: white;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .error {
      color: #b42318;
      margin-top: 10px;
    }

    .success {
      color: #16803c;
      margin-top: 10px;
    }

    .muted {
      color: #777;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .stat h3 {
      margin: 0 0 8px;
      color: #666;
      font-size: 14px;
    }

    .stat strong {
      font-size: 28px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      background: #e8e8e8;
      color: #222;
    }

    .tab.active {
      background: #d4af37;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #fafafa;
      font-size: 13px;
    }

    td {
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee;
      font-size: 12px;
      font-weight: bold;
    }

    .badge.active,
    .badge.approved {
      background: #dff6e7;
      color: #16803c;
    }

    .badge.pending {
      background: #fff3cd;
      color: #856404;
    }

    .badge.rejected,
    .badge.suspended {
      background: #fce4e4;
      color: #b42318;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .action-row {
      white-space: nowrap;
    }

    .action-row button {
      margin: 2px;
    }

    .submission-name {
      min-width: 180px;
    }

    .notice {
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #fff8df;
      border: 1px solid #ead58a;
      color: #6d5700;
    }

    .success-box {
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #e8f7ee;
      border: 1px solid #9ed4b2;
      color: #166534;
    }

    @media (max-width: 700px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        padding: 0 12px;
      }

      .panel {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Near<span>Africa</span> Admin</h1>

  <button
    id="logoutBtn"
    class="dark hidden"
  >
    Log Out
  </button>
</header>


<main>

  <!-- ================================================== -->
  <!-- LOGIN -->
  <!-- ================================================== -->

  <section
    id="loginPanel"
    class="panel login-panel"
  >

    <h2>Admin Login</h2>

    <p class="muted">
      Enter your NearAfrica Admin API key.
    </p>

    <input
      id="adminKey"
      type="password"
      placeholder="Admin API Key"
      autocomplete="off"
    >

    <button
      id="loginBtn"
      class="gold"
    >
      Log In
    </button>

    <p
      id="loginError"
      class="error"
    ></p>

  </section>


  <!-- ================================================== -->
  <!-- ADMIN -->
  <!-- ================================================== -->

  <section
    id="adminPanel"
    class="hidden"
  >

    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <h3>Businesses</h3>
        <strong id="statBusinesses">0</strong>
      </div>

      <div class="stat">
        <h3>Submissions</h3>
        <strong id="statSubmissions">0</strong>
      </div>

      <div class="stat">
        <h3>Claims</h3>
        <strong id="statClaims">0</strong>
      </div>

      <div class="stat">
        <h3>Reviews</h3>
        <strong id="statReviews">0</strong>
      </div>

      <div class="stat">
        <h3>Reports</h3>
        <strong id="statReports">0</strong>
      </div>

      <div class="stat">
        <h3>Subscriptions</h3>
        <strong id="statSubscriptions">0</strong>
      </div>

    </div>


    <div class="panel">

      <div class="topbar">

        <div>
          <h2 id="sectionTitle">
            Businesses
          </h2>

          <p class="muted">
            Manage NearAfrica data.
          </p>
        </div>

        <button
          id="refreshBtn"
          class="blue"
        >
          Refresh
        </button>

      </div>


      <!-- ================================================== -->
      <!-- TABS -->
      <!-- ================================================== -->

      <div class="tabs">

        <button
          class="tab active"
          data-resource="businesses"
        >
          Businesses
        </button>

        <button
          class="tab"
          data-resource="submissions"
        >
          Submissions
        </button>

        <button
          class="tab"
          data-resource="claims"
        >
          Claims
        </button>

        <button
          class="tab"
          data-resource="reviews"
        >
          Reviews
        </button>

        <button
          class="tab"
          data-resource="reports"
        >
          Reports
        </button>

        <button
          class="tab"
          data-resource="help-wanted"
        >
          Help Wanted
        </button>

        <button
          class="tab"
          data-resource="subscriptions"
        >
          Subscriptions
        </button>

        <button
          class="tab"
          data-resource="discoveries"
        >
          Discoveries
        </button>

      </div>


      <div id="content">

        <div class="loading">
          Loading...
        </div>

      </div>

    </div>

  </section>

</main>


<script>

/* ==========================================================
   CONFIG
   ========================================================== */

const API_BASE =
  "https://nearafrica-api.nearafrica-onyxtech.workers.dev";

const STORAGE_KEY =
  "nearafrica_admin_key";

let adminKey =
  sessionStorage.getItem(
    STORAGE_KEY
  ) || "";

let currentResource =
  "businesses";


/* ==========================================================
   ELEMENTS
   ========================================================== */

const loginPanel =
  document.getElementById(
    "loginPanel"
  );

const adminPanel =
  document.getElementById(
    "adminPanel"
  );

const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const adminKeyInput =
  document.getElementById(
    "adminKey"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const content =
  document.getElementById(
    "content"
  );

const sectionTitle =
  document.getElementById(
    "sectionTitle"
  );


/* ==========================================================
   API REQUEST
   ========================================================== */

async function apiRequest(
  path,
  options = {}
) {

  const headers = {
    ...(options.headers || {}),
    "X-Admin-Key": adminKey
  };

  const response =
    await fetch(
      API_BASE + path,
      {
        ...options,
        headers
      }
    );

  let data = null;

  try {

    data =
      await response.json();

  } catch {

    data = {
      success: false,
      error:
        "Invalid server response"
    };

  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      `Request failed (${response.status})`
    );

  }

  return data;
}


/* ==========================================================
   LOGIN
   ========================================================== */

async function login() {

  const key =
    adminKeyInput.value.trim();

  if (!key) {

    loginError.textContent =
      "Please enter your Admin API key.";

    return;
  }

  loginError.textContent =
    "Checking key...";

  loginBtn.disabled = true;

  try {

    adminKey =
      key;

    const data =
      await apiRequest(
        "/admin/businesses?limit=1"
      );

    if (!data.success) {

      throw new Error(
        data.error ||
        "Authentication failed."
      );

    }

    sessionStorage.setItem(
      STORAGE_KEY,
      key
    );

    loginError.textContent =
      "";

    showAdmin();

    await loadResource(
      currentResource
    );

  } catch (error) {

    adminKey = "";

    loginError.textContent =
      error.message ||
      "Invalid Admin API key.";

  } finally {

    loginBtn.disabled =
      false;

  }
}


/* ==========================================================
   SHOW ADMIN
   ========================================================== */

function showAdmin() {

  loginPanel.classList.add(
    "hidden"
  );

  adminPanel.classList.remove(
    "hidden"
  );

  logoutBtn.classList.remove(
    "hidden"
  );
}


/* ==========================================================
   LOGOUT
   ========================================================== */

function logout() {

  sessionStorage.removeItem(
    STORAGE_KEY
  );

  adminKey = "";

  adminPanel.classList.add(
    "hidden"
  );

  logoutBtn.classList.add(
    "hidden"
  );

  loginPanel.classList.remove(
    "hidden"
  );

  adminKeyInput.value =
    "";

  loginError.textContent =
    "";

}


/* ==========================================================
   LOAD RESOURCE
   ========================================================== */

async function loadResource(
  resource
) {

  currentResource =
    resource;

  sectionTitle.textContent =
    formatTitle(
      resource
    );

  content.innerHTML =
    '<div class="loading">Loading...</div>';

  try {

    const data =
      await apiRequest(
        `/admin/${resource}?limit=100`
      );

    const items =
      Array.isArray(
        data.items
      )
        ? data.items
        : [];

    renderResource(
      resource,
      items
    );

    updateStats(
      resource,
      items
    );

  } catch (error) {

    content.innerHTML = `
      <div class="panel">
        <p class="error">
          ${escapeHtml(
            error.message
          )}
        </p>
      </div>
    `;

    if (
      error.message ===
      "Unauthorized"
    ) {

      logout();

    }

  }

}


/* ==========================================================
   TITLE
   ========================================================== */

function formatTitle(
  value
) {

  return value
    .split("-")
    .map(
      word =>
        word.charAt(0).toUpperCase() +
        word.slice(1)
    )
    .join(" ");

}


/* ==========================================================
   STATS
   ========================================================== */

function updateStats(
  resource,
  items
) {

  const map = {

    businesses:
      "statBusinesses",

    submissions:
      "statSubmissions",

    claims:
      "statClaims",

    reviews:
      "statReviews",

    reports:
      "statReports",

    subscriptions:
      "statSubscriptions"

  };

  if (map[resource]) {

    document.getElementById(
      map[resource]
    ).textContent =
      items.length;

  }

}


/* ==========================================================
   RENDER RESOURCE
   ========================================================== */

function renderResource(
  resource,
  items
) {

  if (!items.length) {

    content.innerHTML = `
      <div class="empty">
        No ${escapeHtml(
          formatTitle(resource)
        )}
        available.
      </div>
    `;

    return;
  }


  if (
    resource ===
    "businesses"
  ) {

    renderBusinesses(
      items
    );

    return;

  }


  if (
    resource ===
    "submissions"
  ) {

    renderSubmissions(
      items
    );

    return;

  }


  renderGeneric(
    resource,
    items
  );

}


/* ==========================================================
   BUSINESSES
   ========================================================== */

function renderBusinesses(
  items
) {

  const rows =
    items.map(
      business => {

        const status =
          business.status ||
          "unknown";

        return `
          <tr>

            <td>
              <strong>
                ${escapeHtml(
                  business.business_name ||
                  "Unnamed"
                )}
              </strong>

              <br>

              <span class="muted">
                ${escapeHtml(
                  business.id || ""
                )}
              </span>
            </td>

            <td>
              ${escapeHtml(
                business.category ||
                "—"
              )}
            </td>

            <td>
              ${escapeHtml(
                business.city ||
                "—"
              )},
              ${escapeHtml(
                business.state ||
                "—"
              )}
            </td>

            <td>

              <span
                class="badge ${escapeHtml(status)}"
              >
                ${escapeHtml(status)}
              </span>

            </td>

            <td>
              ${business.verified ? "Yes" : "No"}
            </td>

            <td>
              ${business.claimed ? "Yes" : "No"}
            </td>

            <td>
              ${Number(
                business.views || 0
              )}
            </td>

            <td class="action-row">

              <button
                class="green"
                onclick="changeBusinessStatus(
                  '${escapeJs(
                    business.id
                  )}',
                  'active'
                )"
              >
                Activate
              </button>

              <button
                class="red"
                onclick="changeBusinessStatus(
                  '${escapeJs(
                    business.id
                  )}',
                  'rejected'
                )"
              >
                Reject
              </button>

              <button
                class="dark"
                onclick="changeBusinessStatus(
                  '${escapeJs(
                    business.id
                  )}',
                  'suspended'
                )"
              >
                Suspend
              </button>

            </td>

          </tr>
        `;

      }
    ).join("");


  content.innerHTML = `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Business</th>
            <th>Category</th>
            <th>Location</th>
            <th>Status</th>
            <th>Verified</th>
            <th>Claimed</th>
            <th>Views</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody>
          ${rows}
        </tbody>

      </table>

    </div>

  `;

}


/* ==========================================================
   SUBMISSIONS
   ========================================================== */

function renderSubmissions(
  items
) {

  const rows =
    items.map(
      submission => {

        const status =
          submission.status ||
          "pending";

        const submissionId =
          submission.id;

        const isPending =
          status ===
          "pending";


        return `
          <tr>

            <td>
              <strong>
                ${escapeHtml(
                  submission.id ??
                  "—"
                )}
              </strong>
            </td>


            <td class="submission-name">

              <strong>
                ${escapeHtml(
                  submission.name ||
                  submission.business_name ||
                  "Unnamed Business"
                )}
              </strong>

              ${
                submission.description
                  ? `
                    <br>
                    <span class="muted">
                      ${escapeHtml(
                        submission.description
                      )}
                    </span>
                  `
                  : ""
              }

            </td>


            <td>
              ${escapeHtml(
                submission.category ||
                "—"
              )}
            </td>


            <td>

              <span
                class="badge ${escapeHtml(status)}"
              >
                ${escapeHtml(status)}
              </span>

            </td>


            <td>
              ${escapeHtml(
                submission.email ||
                "—"
              )}
            </td>


            <td>
              ${escapeHtml(
                submission.phone ||
                "—"
              )}
            </td>


            <td>
              ${escapeHtml(
                submission.city ||
                "—"
              )},
              ${escapeHtml(
                submission.state ||
                "—"
              )}
            </td>


            <td>
              ${escapeHtml(
                submission.country ||
                "Nigeria"
              )}
            </td>


            <td>
              ${escapeHtml(
                submission.created_at ||
                "—"
              )}
            </td>


            <td class="action-row">

              ${
                isPending
                  ? `

                    <button
                      class="green"
                      onclick="approveSubmission(
                        '${escapeJs(
                          submissionId
                        )}',
                        '${escapeJs(
                          submission.name ||
                          submission.business_name ||
                          "this business"
                        )}'
                      )"
                    >
                      Approve
                    </button>

                    <button
                      class="red"
                      onclick="rejectSubmission(
                        '${escapeJs(
                          submissionId
                        )}',
                        '${escapeJs(
                          submission.name ||
                          submission.business_name ||
                          "this business"
                        )}'
                      )"
                    >
                      Reject
                    </button>

                  `
                  : `

                    <span class="muted">
                      No actions
                    </span>

                  `
              }

            </td>

          </tr>
        `;

      }
    ).join("");


  content.innerHTML = `

    <div class="notice">

      <strong>
        Submission review
      </strong>

      <br>

      Approving a submission creates the
      business in the NearAfrica directory
      and changes its status to active.

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>ID</th>
            <th>Business</th>
            <th>Category</th>
            <th>Status</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Location</th>
            <th>Country</th>
            <th>Created</th>
            <th>Actions</th>

          </tr>

        </thead>


        <tbody>

          ${rows}

        </tbody>

      </table>

    </div>

  `;

}


/* ==========================================================
   APPROVE SUBMISSION
   ========================================================== */

async function approveSubmission(
  submissionId,
  businessName
) {

  const confirmed =
    confirm(
      `Approve "${businessName}"?\n\n` +
      `This will create the business in the ` +
      `NearAfrica directory and make it active.`
    );

  if (!confirmed) {
    return;
  }


  try {

    content.innerHTML = `
      <div class="loading">
        Approving ${escapeHtml(
          businessName
        )}...
      </div>
    `;


    const data =
      await apiRequest(
        `/admin/submissions/${encodeURIComponent(
          submissionId
        )}/approve`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({})
        }
      );


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Approval failed."
      );

    }


    content.innerHTML = `

      <div class="success-box">

        <strong>
          Business approved successfully.
        </strong>

        <br><br>

        ${escapeHtml(
          businessName
        )}

        has been added to the
        NearAfrica business directory.

      </div>

    `;


    await loadResource(
      "submissions"
    );


  } catch (error) {

    content.innerHTML = `

      <div class="panel">

        <p class="error">

          ${escapeHtml(
            error.message ||
            "Could not approve submission."
          )}

        </p>

        <button
          class="blue"
          onclick="loadResource('submissions')"
        >
          Back to Submissions
        </button>

      </div>

    `;

  }

}


/* ==========================================================
   REJECT SUBMISSION
   ========================================================== */

async function rejectSubmission(
  submissionId,
  businessName
) {

  const reason =
    prompt(
      `Why are you rejecting "${businessName}"?\n\n` +
      `You can leave this blank.`
    );


  if (
    reason ===
    null
  ) {
    return;
  }


  const confirmed =
    confirm(
      `Reject "${businessName}"?`
    );


  if (!confirmed) {
    return;
  }


  try {

    content.innerHTML = `
      <div class="loading">
        Rejecting ${escapeHtml(
          businessName
        )}...
      </div>
    `;


    const data =
      await apiRequest(
        `/admin/submissions/${encodeURIComponent(
          submissionId
        )}/reject`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              reason:
                reason.trim()
            })
        }
      );


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Rejection failed."
      );

    }


    await loadResource(
      "submissions"
    );


  } catch (error) {

    content.innerHTML = `

      <div class="panel">

        <p class="error">

          ${escapeHtml(
            error.message ||
            "Could not reject submission."
          )}

        </p>

        <button
          class="blue"
          onclick="loadResource('submissions')"
        >
          Back to Submissions
        </button>

      </div>

    `;

  }

}


/* ==========================================================
   GENERIC RESOURCE TABLE
   ========================================================== */

function renderGeneric(
  resource,
  items
) {

  const keys =
    getUsefulKeys(
      items
    );


  const header =
    keys.map(
      key =>
        `<th>${escapeHtml(
          formatTitle(key)
        )}</th>`
    ).join("");


  const rows =
    items.map(
      item => {

        const cells =
          keys.map(
            key => {

              let value =
                item[key];


              if (
                value === null ||
                value === undefined
              ) {

                value =
                  "—";

              }


              if (
                typeof value ===
                "object"
              ) {

                value =
                  JSON.stringify(
                    value
                  );

              }


              return `
                <td>
                  ${escapeHtml(
                    String(value)
                  )}
                </td>
              `;

            }
          ).join("");


        return `
          <tr>
            ${cells}
          </tr>
        `;

      }
    ).join("");


  content.innerHTML = `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            ${header}
          </tr>

        </thead>


        <tbody>
          ${rows}
        </tbody>

      </table>

    </div>

  `;

}


/* ==========================================================
   USEFUL KEYS
   ========================================================== */

function getUsefulKeys(
  items
) {

  const preferred = [

    "id",

    "business_name",

    "name",

    "category",

    "status",

    "claimant_name",

    "claimant_email",

    "rating",

    "comment",

    "reason",

    "report_type",

    "email",

    "phone",

    "city",

    "state",

    "country",

    "created_at",

    "updated_at"

  ];


  const available =
    new Set();


  items.forEach(
    item => {

      Object.keys(
        item
      ).forEach(
        key =>
          available.add(
            key
          )
      );

    }
  );


  const selected =
    preferred.filter(
      key =>
        available.has(
          key
        )
    );


  if (
    !selected.length
  ) {

    return Array.from(
      available
    ).slice(
      0,
      10
    );

  }


  return selected.slice(
    0,
    12
  );

}


/* ==========================================================
   CHANGE BUSINESS STATUS
   ========================================================== */

async function changeBusinessStatus(
  businessId,
  status
) {

  const confirmed =
    confirm(
      `Change this business status to "${status}"?`
    );


  if (!confirmed) {
    return;
  }


  try {

    await apiRequest(
      `/admin/businesses/${encodeURIComponent(
        businessId
      )}/status`,
      {
        method: "PATCH",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            status
          })
      }
    );


    await loadResource(
      "businesses"
    );


  } catch (error) {

    alert(
      error.message ||
      "Could not update business status."
    );

  }

}


/* ==========================================================
   ESCAPING
   ========================================================== */

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeJs(
  value
) {

  return String(
    value
  )
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    );

}
