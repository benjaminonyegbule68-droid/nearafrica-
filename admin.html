<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NearAfrica Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, rgba(212, 175, 55, 0.12), transparent 35%),
        #0b0b0b;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      padding: 35px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .login-logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #d4af37, #9d7d19);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #080808;
      font-size: 28px;
      font-weight: 900;
    }

    .login-card h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .login-card p {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 13px 14px;
      background: #0a0a0a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #d4af37;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #080808;
      font-weight: 800;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #e4c45c;
    }

    .login-error {
      margin-top: 15px;
      padding: 11px;
      border-radius: 9px;
      background: rgba(220, 53, 69, 0.12);
      border: 1px solid rgba(220, 53, 69, 0.35);
      color: #ff7b86;
      display: none;
      font-size: 14px;
      line-height: 1.4;
    }

    /* =========================
       ADMIN APP
    ========================= */

    .admin-app {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      padding: 0 25px;
      background: #111;
      border-bottom: 1px solid #252525;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #d4af37, #9d7d19);
      color: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .brand-text strong {
      display: block;
      font-size: 18px;
    }

    .brand-text span {
      display: block;
      color: #777;
      font-size: 11px;
      margin-top: 2px;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #999;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
    }

    .status-dot.online {
      background: #39d98a;
      box-shadow: 0 0 10px rgba(57, 217, 138, 0.5);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #333;
      color: #bbb;
      padding: 8px 13px;
      border-radius: 8px;
    }

    .logout-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    /* =========================
       LAYOUT
    ========================= */

    .layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    .sidebar {
      width: 235px;
      flex-shrink: 0;
      background: #0e0e0e;
      border-right: 1px solid #222;
      padding: 20px 14px;
    }

    .sidebar-title {
      color: #555;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin: 10px 10px 10px;
    }

    .nav-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: #999;
      text-align: left;
      padding: 11px 12px;
      border-radius: 9px;
      margin-bottom: 4px;
      transition: 0.2s;
    }

    .nav-btn:hover {
      background: #181818;
      color: #eee;
    }

    .nav-btn.active {
      background: rgba(212, 175, 55, 0.12);
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.18);
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 28px;
      overflow-x: hidden;
    }

    /* =========================
       DASHBOARD HEADER
    ========================= */

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .page-header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .page-header p {
      color: #777;
      font-size: 14px;
    }

    .refresh-btn {
      padding: 10px 15px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #151515;
      color: #ddd;
    }

    .refresh-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    /* =========================
       STATS
    ========================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #111;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 19px;
    }

    .stat-card span {
      display: block;
      color: #777;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .stat-card strong {
      display: block;
      font-size: 26px;
      color: #eee;
    }

    /* =========================
       CONTENT
    ========================= */

    .content-card {
      background: #111;
      border: 1px solid #242424;
      border-radius: 15px;
      overflow: hidden;
    }

    .content-card-header {
      padding: 18px 20px;
      border-bottom: 1px solid #242424;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .content-card-header h2 {
      font-size: 18px;
    }

    .record-count {
      color: #777;
      font-size: 12px;
    }

    .loading {
      padding: 45px 20px;
      text-align: center;
      color: #777;
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: #777;
    }

    .error-box {
      margin: 18px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(220, 53, 69, 0.10);
      border: 1px solid rgba(220, 53, 69, 0.28);
      color: #ff818b;
      line-height: 1.5;
      font-size: 14px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      text-align: left;
      padding: 13px 17px;
      border-bottom: 1px solid #1f1f1f;
      vertical-align: top;
    }

    th {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 600;
    }

    td {
      color: #ccc;
      font-size: 13px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .business-name {
      color: #eee;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .muted {
      color: #666;
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge.active,
    .badge.approved,
    .badge.verified {
      background: rgba(57, 217, 138, 0.11);
      color: #55dc98;
      border: 1px solid rgba(57, 217, 138, 0.2);
    }

    .badge.pending {
      background: rgba(212, 175, 55, 0.11);
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .badge.rejected,
    .badge.suspended {
      background: rgba(220, 53, 69, 0.11);
      color: #ff727d;
      border: 1px solid rgba(220, 53, 69, 0.2);
    }

    .badge.unverified,
    .badge.unclaimed {
      background: rgba(150, 150, 150, 0.1);
      color: #999;
      border: 1px solid #303030;
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: 1px solid #333;
      background: #171717;
      color: #ccc;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 11px;
    }

    .action-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .action-btn.approve {
      border-color: rgba(57, 217, 138, 0.35);
      color: #55dc98;
    }

    .action-btn.approve:hover {
      background: rgba(57, 217, 138, 0.08);
    }

    .action-btn.danger {
      border-color: rgba(220, 53, 69, 0.35);
      color: #ff727d;
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* =========================
       TOAST
    ========================= */

    .toast-container {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 200;
      width: min(380px, calc(100vw - 40px));
    }

    .toast {
      padding: 14px 16px;
      border-radius: 10px;
      background: #171717;
      border: 1px solid #333;
      color: #ddd;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.45;
    }

    .toast.success {
      border-color: rgba(57, 217, 138, 0.4);
    }

    .toast.error {
      border-color: rgba(220, 53, 69, 0.4);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {
      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .sidebar {
        width: 190px;
      }
    }

    @media (max-width: 700px) {
      .topbar {
        padding: 0 14px;
      }

      .brand-text span {
        display: none;
      }

      .api-status {
        display: none;
      }

      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #222;
        padding: 10px;
        display: flex;
        gap: 5px;
        overflow-x: auto;
      }

      .sidebar-title {
        display: none;
      }

      .nav-btn {
        width: auto;
        white-space: nowrap;
        margin: 0;
      }

      .main {
        padding: 18px 12px;
      }

      .page-header {
        align-items: stretch;
        flex-direction: column;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-card strong {
        font-size: 21px;
      }
    }

    @media (max-width: 420px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .brand-text strong {
        font-size: 16px;
      }

      .logout-btn {
        padding: 7px 9px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
  ========================== -->

  <section class="login-screen" id="loginScreen">

    <div class="login-card">

      <div class="login-logo">
        NA
      </div>

      <h1>NearAfrica Admin</h1>

      <p>
        Secure administration and moderation dashboard.
      </p>

      <form id="loginForm">

        <div class="input-group">
          <label for="adminKey">
            Admin API Key
          </label>

          <input
            type="password"
            id="adminKey"
            placeholder="Enter admin key"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          Sign In
        </button>

      </form>

      <div
        class="login-error"
        id="loginError"
      ></div>

    </div>

  </section>


  <!-- =========================
       ADMIN APPLICATION
  ========================== -->

  <section class="admin-app" id="adminApp">

    <!-- TOP BAR -->

    <header class="topbar">

      <div class="brand">

        <div class="brand-logo">
          NA
        </div>

        <div class="brand-text">
          <strong>NearAfrica</strong>
          <span>Administration</span>
        </div>

      </div>

      <div class="topbar-actions">

        <div class="api-status">

          <span
            class="status-dot"
            id="apiStatusDot"
          ></span>

          <span id="apiStatusText">
            Checking API...
          </span>

        </div>

        <button
          class="logout-btn"
          id="logoutBtn"
        >
          Logout
        </button>

      </div>

    </header>


    <!-- MAIN LAYOUT -->

    <div class="layout">

      <!-- SIDEBAR -->

      <aside class="sidebar">

        <div class="sidebar-title">
          Management
        </div>

        <button
          class="nav-btn active"
          data-resource="businesses"
        >
          Businesses
        </button>

        <button
          class="nav-btn"
          data-resource="submissions"
        >
          Submissions
        </button>

        <button
          class="nav-btn"
          data-resource="claims"
        >
          Claims
        </button>

        <button
          class="nav-btn"
          data-resource="reviews"
        >
          Reviews
        </button>

        <button
          class="nav-btn"
          data-resource="reports"
        >
          Reports
        </button>

        <button
          class="nav-btn"
          data-resource="discoveries"
        >
          Discoveries
        </button>

      </aside>


      <!-- MAIN CONTENT -->

      <main class="main">

        <div class="page-header">

          <div>
            <h1 id="pageTitle">
              Businesses
            </h1>

            <p id="pageDescription">
              Manage businesses listed on NearAfrica.
            </p>
          </div>

          <button
            class="refresh-btn"
            id="refreshBtn"
          >
            ↻ Refresh
          </button>

        </div>


        <!-- STATS -->

        <div class="stats-grid">

          <div class="stat-card">
            <span>Businesses</span>
            <strong id="statBusinesses">—</strong>
          </div>

          <div class="stat-card">
            <span>Pending Submissions</span>
            <strong id="statSubmissions">—</strong>
          </div>

          <div class="stat-card">
            <span>Pending Claims</span>
            <strong id="statClaims">—</strong>
          </div>

          <div class="stat-card">
            <span>Pending Reviews</span>
            <strong id="statReviews">—</strong>
          </div>

        </div>


        <!-- CONTENT -->

        <section class="content-card">

          <div class="content-card-header">

            <h2 id="tableTitle">
              Businesses
            </h2>

            <span
              class="record-count"
              id="recordCount"
            >
              0 records
            </span>

          </div>

          <div id="tableContent">

            <div class="loading">
              Loading...
            </div>

          </div>

        </section>

      </main>

    </div>

  </section>


  <!-- TOASTS -->

  <div
    class="toast-container"
    id="toastContainer"
  ></div>


<script>
/* ============================================================
   NEARAFRICA ADMIN
   CURRENT V17 API
============================================================ */

const API_BASE =
  "https://nearafrica-api.nearafrica-onyxtech.workers.dev";


/* ============================================================
   RESOURCE CONFIGURATION
============================================================ */

const RESOURCE_CONFIG = {

  businesses: {
    title: "Businesses",
    description:
      "Manage businesses listed on NearAfrica.",
    key: "businesses"
  },

  submissions: {
    title: "Submissions",
    description:
      "Review businesses submitted by users.",
    key: "submissions"
  },

  claims: {
    title: "Claims",
    description:
      "Review business ownership claims.",
    key: "claims"
  },

  reviews: {
    title: "Reviews",
    description:
      "Moderate submitted business reviews.",
    key: "reviews"
  },

  reports: {
    title: "Reports",
    description:
      "Review reports submitted about businesses.",
    key: "reports"
  },

  discoveries: {
    title: "Discoveries",
    description:
      "Review businesses discovered through external sources.",
    key: "discoveries"
  }

};


/* ============================================================
   STATE
============================================================ */

let adminKey =
  sessionStorage.getItem("nearafrica_admin_key") || "";

let currentResource = "businesses";


/* ============================================================
   DOM
============================================================ */

const loginScreen =
  document.getElementById("loginScreen");

const adminApp =
  document.getElementById("adminApp");

const loginForm =
  document.getElementById("loginForm");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const adminKeyInput =
  document.getElementById("adminKey");

const logoutBtn =
  document.getElementById("logoutBtn");

const refreshBtn =
  document.getElementById("refreshBtn");

const tableContent =
  document.getElementById("tableContent");

const recordCount =
  document.getElementById("recordCount");

const tableTitle =
  document.getElementById("tableTitle");

const pageTitle =
  document.getElementById("pageTitle");

const pageDescription =
  document.getElementById("pageDescription");

const apiStatusDot =
  document.getElementById("apiStatusDot");

const apiStatusText =
  document.getElementById("apiStatusText");


/* ============================================================
   GENERIC API REQUEST
============================================================ */

async function apiRequest(
  path,
  options = {}
) {

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (adminKey) {
    headers["X-Admin-Key"] = adminKey;
  }

  const response =
    await fetch(
      API_BASE + path,
      {
        ...options,
        headers
      }
    );

  let data = null;

  try {
    data = await response.json();
  } catch (error) {
    data = null;
  }

  if (!response.ok) {

    const message =
      data?.message ||
      data?.error ||
      `Request failed (${response.status})`;

    throw new Error(message);
  }

  return data;
}


/* ============================================================
   TOAST
============================================================ */

function showToast(
  message,
  type = "success"
) {

  const container =
    document.getElementById("toastContainer");

  const toast =
    document.createElement("div");

  toast.className =
    `toast ${type}`;

  toast.textContent =
    message;

  container.appendChild(toast);

  setTimeout(() => {

    toast.remove();

  }, 4500);
}


/* ============================================================
   LOGIN ERROR
============================================================ */

function showLoginError(message) {

  loginError.textContent =
    message;

  loginError.style.display =
    "block";
}


function hideLoginError() {

  loginError.textContent =
    "";

  loginError.style.display =
    "none";
}


/* ============================================================
   LOGIN
============================================================ */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    hideLoginError();

    const key =
      adminKeyInput.value.trim();

    if (!key) {

      showLoginError(
        "Please enter the admin API key."
      );

      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent =
      "Checking...";

    try {

      /*
       * The v17 API returns:
       *
       * {
       *   status: "ok",
       *   businesses: [...]
       * }
       *
       * It does NOT return success:true.
       */

      const response =
        await fetch(
          API_BASE +
          "/admin/businesses?limit=1",
          {
            method: "GET",
            headers: {
              "X-Admin-Key": key
            }
          }
        );

      let data = null;

      try {

        data =
          await response.json();

      } catch (error) {

        data = null;
      }

      if (
        !response.ok ||
        !data ||
        data.status !== "ok"
      ) {

        throw new Error(
          data?.message ||
          data?.error ||
          `Authentication failed (${response.status})`
        );
      }

      adminKey =
        key;

      sessionStorage.setItem(
        "nearafrica_admin_key",
        adminKey
      );

      showAdmin();

    } catch (error) {

      showLoginError(
        error.message ||
        "Unable to connect to the admin API."
      );

    } finally {

      loginBtn.disabled = false;
      loginBtn.textContent =
        "Sign In";
    }

  }
);


/* ============================================================
   SHOW ADMIN
============================================================ */

function showAdmin() {

  loginScreen.style.display =
    "none";

  adminApp.style.display =
    "block";

  checkApiStatus();

  loadStats();

  loadResource(
    currentResource
  );
}


/* ============================================================
   LOGOUT
============================================================ */

logoutBtn.addEventListener(
  "click",
  function() {

    sessionStorage.removeItem(
      "nearafrica_admin_key"
    );

    adminKey = "";

    adminApp.style.display =
      "none";

    loginScreen.style.display =
      "flex";

    adminKeyInput.value =
      "";

    hideLoginError();

  }
);


/* ============================================================
   API STATUS
============================================================ */

async function checkApiStatus() {

  try {

    const data =
      await apiRequest(
        "/health"
      );

    if (data.status === "ok") {

      apiStatusDot.classList.add(
        "online"
      );

      apiStatusText.textContent =
        "API Online";

    } else {

      throw new Error(
        "API did not return OK"
      );
    }

  } catch (error) {

    apiStatusDot.classList.remove(
      "online"
    );

/* ============================================================
   LOAD STATS
============================================================ */

async function loadStats() {

  try {

    const data =
      await apiRequest(
        "/admin/stats"
      );

    if (
      !data ||
      data.status !== "ok"
    ) {

      throw new Error(
        data?.message ||
        "Unable to load statistics."
      );
    }

    /*
     * v17 returns a counts object.
     *
     * We deliberately tolerate different
     * possible field names so the dashboard
     * doesn't break if a count is missing.
     */

    const counts =
      data.counts ||
      data.stats ||
      data;

    const businesses =
      getCount(
        counts,
        [
          "businesses",
          "business_count"
        ]
      );

    const submissions =
      getCount(
        counts,
        [
          "submissions",
          "submission_count"
        ]
      );

    const claims =
      getCount(
        counts,
        [
          "claims",
          "claim_count",
          "business_claims"
        ]
      );

    const reviews =
      getCount(
        counts,
        [
          "reviews",
          "review_count"
        ]
      );

    document.getElementById(
      "statBusinesses"
    ).textContent =
      formatNumber(businesses);

    document.getElementById(
      "statSubmissions"
    ).textContent =
      formatNumber(submissions);

    document.getElementById(
      "statClaims"
    ).textContent =
      formatNumber(claims);

    document.getElementById(
      "statReviews"
    ).textContent =
      formatNumber(reviews);

  } catch (error) {

    console.error(
      "Stats error:",
      error
    );

    document.getElementById(
      "statBusinesses"
    ).textContent = "—";

    document.getElementById(
      "statSubmissions"
    ).textContent = "—";

    document.getElementById(
      "statClaims"
    ).textContent = "—";

    document.getElementById(
      "statReviews"
    ).textContent = "—";
  }
}


/* ============================================================
   COUNT HELPER
============================================================ */

function getCount(
  object,
  keys
) {

  for (
    const key of keys
  ) {

    if (
      object &&
      object[key] !== undefined &&
      object[key] !== null
    ) {

      const value =
        Number(object[key]);

      if (
        Number.isFinite(value)
      ) {

        return value;
      }
    }
  }

  return 0;
}


/* ============================================================
   NUMBER FORMAT
============================================================ */

function formatNumber(value) {

  const number =
    Number(value);

  if (
    !Number.isFinite(number)
  ) {

    return "0";
  }

  return number.toLocaleString();
}

/* ============================================================
   LOAD RESOURCE
============================================================ */

async function loadResource(
  resource
) {

  const config =
    RESOURCE_CONFIG[resource];

  if (!config) {

    return;
  }

  pageTitle.textContent =
    config.title;

  pageDescription.textContent =
    config.description;

  tableTitle.textContent =
    config.title;

  recordCount.textContent =
    "Loading...";

  tableContent.innerHTML =
    `
      <div class="loading">
        Loading ${escapeHtml(
          config.title.toLowerCase()
        )}...
      </div>
    `;

  try {

    /*
     * Important:
     *
     * The v17 API does NOT return:
     *
     * data.items
     *
     * Instead it returns:
     *
     * data.businesses
     * data.submissions
     * data.claims
     * data.reviews
     * data.reports
     * data.discoveries
     */

    const data =
      await apiRequest(
        `/admin/${resource}?limit=100`
      );

    if (
      !data ||
      data.status !== "ok"
    ) {

      throw new Error(
        data?.message ||
        "The API returned an unsuccessful response."
      );
    }

    const items =
      Array.isArray(
        data[config.key]
      )
        ? data[config.key]
        : [];

    recordCount.textContent =
      `${items.length.toLocaleString()} record${
        items.length === 1
          ? ""
          : "s"
      }`;

    renderResource(
      resource,
      items
    );

  } catch (error) {

    console.error(
      `Failed loading ${resource}:`,
      error
    );

    recordCount.textContent =
      "Error";

    tableContent.innerHTML =
      `
        <div class="error-box">
          <strong>
            Failed to load ${escapeHtml(
              config.title
            )}
          </strong>
          <br><br>
          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}
        </div>
      `;

  }
}


/* ============================================================
   RENDER RESOURCE
============================================================ */

function renderResource(
  resource,
  items
) {

  if (!items.length) {

    tableContent.innerHTML =
      `
        <div class="empty">
          No ${escapeHtml(
            RESOURCE_CONFIG[
              resource
            ].title.toLowerCase()
          )} found.
        </div>
      `;

    return;
  }

  switch (resource) {

    case "businesses":
      renderBusinesses(items);
      break;

    case "submissions":
      renderSubmissions(items);
      break;

    case "claims":
      renderClaims(items);
      break;

    case "reviews":
      renderReviews(items);
      break;

    case "reports":
      renderReports(items);
      break;

    case "discoveries":
      renderDiscoveries(items);
      break;

    default:

      renderGeneric(
        items
      );
  }
}

/* ============================================================

============================================================ */

async function approveSubmission(
  id
) {

  if (!id) {

    showToast(
      "Submission ID is missing.",
      "error"
    );

    return;
  }

  const confirmed =
    confirm(
      "Approve this submission and create the business listing?"
    );

  if (!confirmed) {

    return;
  }

  try {

    const data =
      await apiRequest(
        `/admin/submissions/${encodeURIComponent(
          id
        )}/approve`,
        {
          method: "POST"
        }
      );

    /*
     * v17 returns:
     *
     * {
     *   status: "ok",
     *   message: "...",
     *   business_id: "...",
     *   slug: "..."
     * }
     */

    if (
      !data ||
      data.status !== "ok"
    ) {

      throw new Error(
        data?.message ||
        "Submission approval failed."
      );
    }

    showToast(
      data.message ||
      "Submission approved successfully.",
      "success"
    );

    await Promise.all([
      loadStats(),
      loadResource("submissions")
    ]);

  } catch (error) {

    console.error(
      "Approval error:",
      error
    );

    showToast(
      error.message ||
      "Unable to approve submission.",
      "error"
    );
  }
}

/* ============================================================
   BADGE CLASS
============================================================ */

function badgeClass(
  status
) {

  const value =
    String(
      status ||
      ""
    )
      .toLowerCase()
      .replace(
        /[^a-z0-9_-]/g,
        ""
      );

  if (
    value === "active" ||
    value === "approved" ||
    value === "verified" ||
    value === "resolved"
  ) {

    return "active";
  }

  if (
    value === "pending"
  ) {

    return "pending";
  }

  if (
    value === "rejected" ||
    value === "suspended"
  ) {

    return value;
  }

  return "unverified";
}


/* ============================================================
   STAR DISPLAY
============================================================ */

function renderStars(
  rating
) {

  const number =
    Number(
      rating
    );

  if (
    !Number.isFinite(number)
  ) {

    return "—";
  }

  const rounded =
    Math.max(
      0,
      Math.min(
        5,
        Math.round(number)
      )
    );

  return (
    "★".repeat(
      rounded
    ) +
    "☆".repeat(
      5 - rounded
    )
  );
}


/* ============================================================
   HTML ESCAPING
============================================================ */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";
  }

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* ============================================================
   JAVASCRIPT STRING ESCAPING
============================================================ */

function escapeJs(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";
  }

  return String(
    value
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );
}


/* ============================================================
   SAFE URL
============================================================ */

function safeUrl(
  value
) {

  try {

    const url =
      new URL(
        String(value)
      );

    if (
      url.protocol === "http:" ||
      url.protocol === "https:"
    ) {

      return url.href;
    }

  } catch (error) {}

  return "#";
}
