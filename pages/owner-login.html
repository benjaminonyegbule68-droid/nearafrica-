<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="NearAfrica Owner Login"
  />

  <title>Owner Login | NearAfrica</title>

  <style>
    :root {
      --bg: #0b0b0b;
      --card: #151515;
      --gold: #d4af37;
      --gold-light: #f0d77a;
      --text: #f5f5f5;
      --muted: #a9a9a9;
      --border: #292929;
      --danger: #ff7777;
      --success: #75d69c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #1b1b1b 0%,
          var(--bg) 55%
        );
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      color: var(--gold);
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .intro {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f0f0f;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: var(--gold);
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: var(--gold-light);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: rgba(255, 119, 119, 0.1);
      border: 1px solid rgba(255, 119, 119, 0.35);
      color: var(--danger);
    }

    .message.success {
      display: block;
      background: rgba(117, 214, 156, 0.1);
      border: 1px solid rgba(117, 214, 156, 0.35);
      color: var(--success);
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: var(--gold);
      text-decoration: none;
    }

    .back a:hover {
      text-decoration: underline;
    }

    .help {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      <img
        src="/logo.png"
        alt="NearAfrica"
      />

      <h1>NearAfrica</h1>

      <p>Business Owner Portal</p>
    </div>

    <section class="card">

      <h2>Owner Login</h2>

      <p class="intro">
        Sign in to manage your claimed NearAfrica
        business listing and access owner features.
      </p>

      <div
        id="message"
        class="message"
        role="alert"
      ></div>

      <form id="ownerLoginForm">

        <div class="field">
          <label for="businessName">
            Business Name
          </label>

          <input
            id="businessName"
            name="business_name"
            type="text"
            autocomplete="organization"
            placeholder="Enter your business name"
            required
          />
        </div>

        <div class="field">
          <label for="email">
            Owner Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Enter the email used for your claim"
            required
          />
        </div>

        <button
          id="loginButton"
          type="submit"
        >
          Sign In
        </button>

      </form>

      <div class="help">
        Your business must have an approved and verified
        owner claim before owner access can be granted.
      </div>

    </section>

    <div class="back">
      <a href="/index.html">
        ← Back to NearAfrica
      </a>
    </div>

  </main>

  <script>
    const API_BASE =
      "https://nearafrica-api.nearafrica-onyxtech.workers.dev";

    const form =
      document.getElementById(
        "ownerLoginForm"
      );

    const button =
      document.getElementById(
        "loginButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    function showMessage(
      text,
      type
    ) {
      message.textContent = text;

      message.className =
        "message " + type;
    }

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const businessName =
          document
            .getElementById(
              "businessName"
            )
            .value
            .trim();

        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();

        if (
          !businessName ||
          !email
        ) {
          showMessage(
            "Please enter your business name and owner email.",
            "error"
          );

          return;
        }

        button.disabled = true;
        button.textContent =
          "Signing in...";

        message.className =
          "message";

        try {

          const response =
            await fetch(
              API_BASE +
                "/owner/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    business_name:
                      businessName,

                    email:
                      email
                  })
              }
            );

          const data =
            await response.json();

          if (
            !response.ok ||
            data.status !== "ok"
          ) {

            showMessage(
              data.message ||
                "Owner login failed.",
              "error"
            );

            return;
          }

          /*
           * Store the existing owner
           * session returned by the Worker.
           */
          sessionStorage.setItem(
            "nearafrica_owner_token",
            data.token
          );

          sessionStorage.setItem(
            "nearafrica_owner_business_id",
            String(
              data.business_id
            )
          );

          sessionStorage.setItem(
            "nearafrica_owner_business_name",
            data.business_name || ""
          );

          sessionStorage.setItem(
            "nearafrica_owner_expires_at",
            data.expires_at || ""
          );

          showMessage(
            "Owner access granted. Redirecting...",
            "success"
          );

          setTimeout(
            function () {

              window.location.href =
                data.dashboard_url ||
                "/pages/owner-dashboard.html";

            },
            500
          );

        } catch (error) {

          console.error(
            "OWNER_LOGIN_FRONTEND_ERROR",
            error
          );

          showMessage(
            "Unable to connect to NearAfrica. Please try again.",
            "error"
          );

        } finally {

          button.disabled = false;
          button.textContent =
            "Sign In";

        }

      }
    );
  </script>

</body>
</html>
