<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Page Not Found | NearAfrica</title>

  <meta
    name="description"
    content="The page you're looking for could not be found on NearAfrica."
  >

  <link rel="icon" href="logo.png">

  <link rel="stylesheet" href="styles.css">

  <style>
    .error-page {
      min-height: 100vh;
      background: #f7f7f5;
      display: flex;
      flex-direction: column;
    }

    .error-header {
      background: #111;
      border-bottom: 1px solid #2a2a2a;
    }

    .error-nav {
      width: min(1200px, calc(100% - 32px));
      min-height: 68px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .error-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
    }

    .error-brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .error-nav-links {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .error-nav-links a {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .error-nav-links a:hover {
      color: #d4af37;
    }

    .error-content {
      flex: 1;
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 0;
    }

    .error-card {
      width: 100%;
      max-width: 650px;
      padding: 50px 30px;
      border: 1px solid #e4e4e4;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
    }

    .error-code {
      margin: 0;
      color: #d4af37;
      font-size: clamp(72px, 15vw, 140px);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -5px;
    }

    .error-card h1 {
      margin: 22px 0 10px;
      color: #111;
      font-size: 30px;
    }

    .error-card p {
      max-width: 520px;
      margin: 0 auto 25px;
      color: #666;
      font-size: 15px;
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .error-actions a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .error-primary {
      background: #111;
      color: #fff;
    }

    .error-primary:hover {
      background: #222;
    }

    .error-secondary {
      border: 1px solid #d4af37;
      color: #705a13;
      background: #faf5df;
    }

    .error-secondary:hover {
      background: #f5edcf;
    }

    .error-footer {
      border-top: 1px solid #e5e5e5;
      background: #fff;
      padding: 25px 16px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .error-nav-links {
        display: none;
      }

      .error-card {
        padding: 40px 20px;
      }

      .error-card h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body class="error-page">

  <header class="error-header">

    <div class="error-nav">

      <a
        href="index.html"
        class="error-brand"
        aria-label="NearAfrica home"
      >
        <img
          src="logo.png"
          alt="NearAfrica"
          onerror="this.style.display='none';"
        >

        <span>NearAfrica</span>
      </a>

      <nav
        class="error-nav-links"
        aria-label="Main navigation"
      >
        <a href="index.html">
          Home
        </a>

        <a href="explore.html">
          Explore
        </a>

        <a href="list-business.html">
          List Your Business
        </a>
      </nav>

    </div>

  </header>


  <main class="error-content">

    <section class="error-card">

      <div class="error-code">
        404
      </div>

      <h1>
        Page Not Found
      </h1>

      <p>
        The page you're looking for doesn't exist or may have
        been moved. You can return home or continue exploring
        businesses on NearAfrica.
      </p>

      <div class="error-actions">

        <a
          href="index.html"
          class="error-primary"
        >
          Back Home
        </a>

        <a
          href="explore.html"
          class="error-secondary"
        >
          Explore Businesses
        </a>

      </div>

    </section>

  </main>


  <footer class="error-footer">
    © 2026 NearAfrica. Find Great Businesses Near You.
  </footer>

</body>
</html>
