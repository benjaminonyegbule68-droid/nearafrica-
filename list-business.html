<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>List Your Business | NearAfrica</title>

  <meta
    name="description"
    content="Add your business to NearAfrica and help customers discover your products and services."
  >

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">

  <div class="container header-inner">

    <a
      href="index.html"
      class="logo"
      aria-label="NearAfrica home"
    >
      <img
        src="logo.png"
        alt="NearAfrica"
        class="logo-img"
        width="160"
        height="40"
      >
    </a>

    <nav
      class="nav-links"
      aria-label="Main navigation"
    >

      <a href="index.html">
        Home
      </a>

      <a href="search.html">
        Explore
      </a>

      <a
        href="list-business.html"
        class="active"
        aria-current="page"
      >
        List Your Business
      </a>

    </nav>

    <div class="header-actions">

      <button
        type="button"
        class="btn-menu"
        id="menu-btn"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </div>

  <nav
    class="mobile-nav"
    id="mobile-nav"
    aria-label="Mobile navigation"
  >

    <a href="index.html">
      Home
    </a>

    <a href="search.html">
      Explore
    </a>

    <a href="list-business.html">
      List Your Business
    </a>

  </nav>

</header>


<main>

  <section class="section">

    <div class="container">

      <div
        class="section-heading"
        style="max-width:760px;margin:0 auto 2rem;"
      >

        <h1>
          Add Your Business
        </h1>

        <p class="text-muted">
          Help customers across Africa discover your
          business on NearAfrica.
        </p>

      </div>


      <div
        class="card"
        style="max-width:800px;margin:0 auto;"
      >

        <form
          id="business-form"
          novalidate
        >

          <!-- ==================================================
               BUSINESS NAME
               ================================================== -->

          <div class="form-group">

            <label for="business-name">
              Business Name *
            </label>

            <input
              type="text"
              id="business-name"
              name="business_name"
              placeholder="e.g. Example Fashion Store"
              required
              maxlength="100"
            >

          </div>


          <!-- ==================================================
               CATEGORY
               ================================================== -->

          <div class="form-group">

            <label for="category">
              Business Category *
            </label>

            <select
              id="category"
              name="category"
              required
            >

              <option value="">
                Select a category
              </option>

              <option value="Restaurants & Food">
                Restaurants & Food
              </option>

              <option value="Hotels & Accommodation">
                Hotels & Accommodation
              </option>

              <option value="Beauty & Spa">
                Beauty & Spa
              </option>

              <option value="Health & Medical">
                Health & Medical
              </option>

              <option value="Shopping & Retail">
                Shopping & Retail
              </option>

              <option value="Supermarkets">
                Supermarkets
              </option>

              <option value="Banks & Finance">
                Banks & Finance
              </option>

              <option value="Professional Services">
                Professional Services
              </option>

              <option value="Education">
                Education
              </option>

              <option value="Real Estate">
                Real Estate
              </option>

              <option value="Automotive">
                Automotive
              </option>

              <option value="Travel & Tourism">
                Travel & Tourism
              </option>

              <option value="Logistics & Delivery">
                Logistics & Delivery
              </option>

              <option value="Technology">
                Technology
              </option>

              <option value="Entertainment">
                Entertainment
              </option>

              <option value="Fitness & Sports">
                Fitness & Sports
              </option>

              <option value="Construction & Home Services">
                Construction & Home Services
              </option>

              <option value="Fashion">
                Fashion
              </option>

              <option value="Agriculture">
                Agriculture
              </option>

              <option value="Religious Organizations">
                Religious Organizations
              </option>

              <option value="Government & Public Services">
                Government & Public Services
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <!-- ==================================================
               COUNTRY
               ================================================== -->

          <div class="form-group">

            <label for="country">
              Country *
            </label>

            <select
              id="country"
              name="country"
              required
            >

              <option value="">
                Select country
              </option>

              <option value="Nigeria">
                Nigeria
              </option>

              <option value="Ghana">
                Ghana
              </option>

              <option value="Kenya">
                Kenya
              </option>

              <option value="South Africa">
                South Africa
              </option>

              <option value="Uganda">
                Uganda
              </option>

              <option value="Tanzania">
                Tanzania
              </option>

              <option value="Rwanda">
                Rwanda
              </option>

              <option value="Cameroon">
                Cameroon
              </option>

              <option value="Egypt">
                Egypt
              </option>

              <option value="Morocco">
                Morocco
              </option>

              <option value="Other">
                Other African Country
              </option>

            </select>

          </div>


          <!-- ==================================================
               STATE / REGION
               ================================================== -->

          <div class="form-group">

            <label for="state-select">
              State / Region *
            </label>


            <!-- Nigerian States -->

            <select
              id="state-select"
              required
              disabled
            >

              <option value="">
                Select country first
              </option>

            </select>


            <!-- Other African Countries -->

            <input
              type="text"
              id="state-other"
              placeholder="Enter your state, province or region"
              maxlength="80"
              style="display:none;"
            >

          </div>


          <!-- ==================================================
               CITY
               ================================================== -->

          <div class="form-group">

            <label for="city">
              City *
            </label>

            <input
              type="text"
              id="city"
              name="city"
              placeholder="e.g. Aba"
              required
              maxlength="80"
            >

          </div>


          <!-- ==================================================
               ADDRESS
               ================================================== -->

          <div class="form-group">

            <label for="address">
              Business Address *
            </label>

            <textarea
              id="address"
              name="address"
              placeholder="Enter the full business address"
              rows="3"
              required
              maxlength="300"
            ></textarea>

          </div>


          <!-- ==================================================
               PHONE
               ================================================== -->

          <div class="form-group">

            <label for="phone">
              Business Phone
            </label>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+234..."
              maxlength="30"
            >

          </div>


          <!-- ==================================================
               WHATSAPP
               ================================================== -->

          <div class="form-group">

            <label for="whatsapp">
              WhatsApp Number
            </label>

            <input
              type="tel"
              id="whatsapp"
              name="whatsapp"
              placeholder="+234..."
              maxlength="30"
            >

          </div>


          <!-- ==================================================
               WEBSITE
               ================================================== -->

          <div class="form-group">

            <label for="website">
              Website
            </label>

            <input
              type="url"
              id="website"
              name="website"
              placeholder="https://example.com"
              maxlength="200"
            >

          </div>


          <!-- ==================================================
               DESCRIPTION
               ================================================== -->

          <div class="form-group">

            <label for="description">
              Business Description *
            </label>

            <textarea
              id="description"
              name="description"
              placeholder="Tell customers what your business offers..."
              rows="5"
              required
              maxlength="1000"
            ></textarea>

          </div>


          <!-- ==================================================
               EMAIL
               ================================================== -->

          <div class="form-group">

            <label for="email">
              Contact Email *
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
              maxlength="150"
            >

          </div>


          <!-- ==================================================
               TERMS
               ================================================== -->

          <div
            class="form-group"
            style="margin-top:1.5rem;"
          >

            <label
              style="display:flex;gap:0.7rem;align-items:flex-start;"
            >

              <input
                type="checkbox"
                id="terms"
                name="terms"
                required
                style="margin-top:0.3rem;"
              >

              <span>
                I confirm that the information provided is
                accurate and that I have permission to submit
                this business.
              </span>

            </label>

          </div>


          <!-- ==================================================
               STATUS
               ================================================== -->

          <div
            id="submission-status"
            role="status"
            aria-live="polite"
            style="margin:1rem 0;"
          ></div>


          <!-- ==================================================
               SUCCESS
               ================================================== -->

          <div
            id="form-success"
            role="status"
            aria-live="polite"
            style="display:none;margin:1rem 0;"
          ></div>


          <!-- ==================================================
               ERROR
               ================================================== -->

          <div
            id="form-error"
            role="alert"
            aria-live="assertive"
            style="display:none;margin:1rem 0;"
          ></div>


          <!-- ==================================================
               SUBMIT
               ================================================== -->

          <button
            type="submit"
            class="btn btn-primary"
            id="submit-business"
          >
            Submit Business
          </button>


          <p
            class="text-muted"
            style="font-size:0.85rem;margin-top:1rem;"
          >
            Your submission will be reviewed by NearAfrica
            before it becomes publicly visible.
          </p>

        </form>

      </div>

    </div>

  </section>

</main>


<!-- ========================================================
     FOOTER
     ======================================================== -->

<footer class="site-footer">

  <div class="container">

    <div class="footer-bottom">

      <span>
        © 2026 NearAfrica
      </span>

      <span>
        Find businesses across Africa
      </span>

    </div>

  </div>

</footer>


<!-- ========================================================
     COUNTRY / STATE LOGIC
     ======================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

  const countrySelect =
    document.getElementById("country");

  const stateSelect =
    document.getElementById("state-select");

  const stateOther =
    document.getElementById("state-other");


  /*
   * All Nigerian states + Federal Capital Territory
   */

  const nigeriaStates = [

    "Abia",
    "Adamawa",
    "Akwa Ibom",
    "Anambra",
    "Bauchi",
    "Bayelsa",
    "Benue",
    "Borno",
    "Cross River",
    "Delta",
    "Ebonyi",
    "Edo",
    "Ekiti",
    "Enugu",
    "Gombe",
    "Imo",
    "Jigawa",
    "Kaduna",
    "Kano",
    "Katsina",
    "Kebbi",
    "Kogi",
    "Kwara",
    "Lagos",
    "Nasarawa",
    "Niger",
    "Ogun",
    "Ondo",
    "Osun",
    "Oyo",
    "Plateau",
    "Rivers",
    "Sokoto",
    "Taraba",
    "Yobe",
    "Zamfara",
    "Federal Capital Territory"

  ];


  /*
   * Change State/Region field
   * based on selected country.
   */

  function updateStateField() {

    const country =
      countrySelect.value;


    /* ==========================================
       NIGERIA
       ========================================== */

    if (country === "Nigeria") {

      stateOther.style.display = "none";

      stateOther.removeAttribute("name");

      stateOther.required = false;

      stateOther.value = "";


      stateSelect.style.display = "block";

      stateSelect.disabled = false;

      stateSelect.name = "state";

      stateSelect.required = true;


      stateSelect.innerHTML =
        '<option value="">Select Nigerian state</option>' +

        nigeriaStates
          .map(function (state) {

            return (
              '<option value="' +
              state +
              '">' +
              state +
              '</option>'
            );

          })
          .join("");


      return;
    }


    /* ==========================================
       OTHER AFRICAN COUNTRIES
       ========================================== */

    if (country !== "") {

      stateSelect.style.display = "none";

      stateSelect.removeAttribute("name");

      stateSelect.required = false;

      stateSelect.disabled = true;

      stateSelect.value = "";


      stateOther.style.display = "block";

      stateOther.name = "state";

      stateOther.required = true;


      if (country === "Ghana") {

        stateOther.placeholder =
          "e.g. Greater Accra Region";

      } else {

        stateOther.placeholder =
          "Enter your state, province or region";

      }


      return;
    }


    /* ==========================================
       NO COUNTRY SELECTED
       ========================================== */

    stateSelect.style.display = "block";

    stateSelect.disabled = true;

    stateSelect.removeAttribute("name");

    stateSelect.required = false;

    stateSelect.innerHTML =
      '<option value="">Select country first</option>';


    stateOther.style.display = "none";

    stateOther.removeAttribute("name");

    stateOther.required = false;

    stateOther.value = "";

  }


  countrySelect.addEventListener(
    "change",
    updateStateField
  );


  /*
   * Run once when the page loads.
   */

  updateStateField();

});

</script>


<!-- ========================================================
     NEARAFRICA SCRIPTS
     ======================================================== -->

<script src="config.js"></script>
<script src="businesses.js"></script>
<script src="utils.js"></script>
<script src="app.js"></script>

</body>
  </html>
