<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>List Your Business | NearAfrica</title>

  <meta
    name="description"
    content="Add your business to NearAfrica and help customers discover your products and services."
  >

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">

  <div class="container header-inner">

    <a href="index.html" class="logo" aria-label="NearAfrica home">
      <img
        src="logo.png"
        alt="NearAfrica"
        class="logo-img"
        width="160"
        height="40"
      >
    </a>

    <nav class="nav-links" aria-label="Main navigation">

      <a href="index.html">Home</a>

      <a href="search.html">Explore</a>

      <a
        href="list-business.html"
        class="active"
        aria-current="page"
      >
        List Your Business
      </a>

    </nav>

    <div class="header-actions">

      <button
        type="button"
        class="btn-menu"
        id="menu-btn"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </div>

  <nav
    class="mobile-nav"
    id="mobile-nav"
    aria-label="Mobile navigation"
  >

    <a href="index.html">Home</a>
    <a href="search.html">Explore</a>
    <a href="list-business.html">List Your Business</a>

  </nav>

</header>


<main>

  <section class="section">

    <div class="container">

      <div
        class="section-heading"
        style="max-width:760px;margin:0 auto 2rem;"
      >

        <h1>
          Add Your Business
        </h1>

        <p class="text-muted">
          Help customers across Africa discover your business
          on NearAfrica.
        </p>

      </div>


      <!-- =================================================
           BUSINESS SUBMISSION FORM
      ================================================== -->

      <div
        class="card"
        style="max-width:800px;margin:0 auto;"
      >

        <form
          id="business-submission-form"
          novalidate
        >

          <!-- BUSINESS NAME -->

          <div class="form-group">

            <label for="business-name">
              Business Name *
            </label>

            <input
              type="text"
              id="business-name"
              name="businessName"
              placeholder="e.g. Example Fashion Store"
              required
              maxlength="100"
            >

          </div>


          <!-- CATEGORY -->

          <div class="form-group">

            <label for="category">
              Business Category *
            </label>

            <select
              id="category"
              name="category"
              required
            >

              <option value="">
                Select a category
              </option>

              <option value="Restaurant">
                Restaurant
              </option>

              <option value="Fashion">
                Fashion & Clothing
              </option>

              <option value="Beauty">
                Beauty & Personal Care
              </option>

              <option value="Health">
                Health & Medical
              </option>

              <option value="Hotel">
                Hotels & Accommodation
              </option>

              <option value="Education">
                Education
              </option>

              <option value="Real Estate">
                Real Estate
              </option>

              <option value="Automotive">
                Automotive
              </option>

              <option value="Technology">
                Technology
              </option>

              <option value="Professional Services">
                Professional Services
              </option>

              <option value="Shopping">
                Shopping & Retail
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <!-- COUNTRY -->

          <div class="form-group">

            <label for="country">
              Country *
            </label>

            <select
              id="country"
              name="country"
              required
            >

              <option value="">
                Select country
              </option>

              <option value="Nigeria">
                Nigeria
              </option>

              <option value="Ghana">
                Ghana
              </option>

              <option value="Kenya">
                Kenya
              </option>

              <option value="South Africa">
                South Africa
              </option>

              <option value="Uganda">
                Uganda
              </option>

              <option value="Tanzania">
                Tanzania
              </option>

              <option value="Rwanda">
                Rwanda
              </option>

              <option value="Cameroon">
                Cameroon
              </option>

              <option value="Egypt">
                Egypt
              </option>

              <option value="Morocco">
                Morocco
              </option>

              <option value="Other">
                Other African Country
              </option>

            </select>

          </div>


          <!-- STATE / REGION -->

          <div class="form-group">

            <label for="state">
              State / Region *
            </label>

            <input
              type="text"
              id="state"
              name="state"
              placeholder="e.g. Abia"
              required
              maxlength="80"
            >

          </div>


          <!-- CITY -->

          <div class="form-group">

            <label for="city">
              City *
            </label>

            <input
              type="text"
              id="city"
              name="city"
              placeholder="e.g. Aba"
              required
              maxlength="80"
            >

          </div>


          <!-- ADDRESS -->

          <div class="form-group">

            <label for="address">
              Business Address *
            </label>

            <textarea
              id="address"
              name="address"
              placeholder="Enter the business address"
              rows="3"
              required
              maxlength="300"
            ></textarea>

          </div>


          <!-- PHONE -->

          <div class="form-group">

            <label for="phone">
              Business Phone
            </label>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+234..."
              maxlength="30"
            >

          </div>


          <!-- WHATSAPP -->

          <div class="form-group">

            <label for="whatsapp">
              WhatsApp Number
            </label>

            <input
              type="tel"
              id="whatsapp"
              name="whatsapp"
              placeholder="+234..."
              maxlength="30"
            >

          </div>


          <!-- WEBSITE -->

          <div class="form-group">

            <label for="website">
              Website
            </label>

            <input
              type="url"
              id="website"
              name="website"
              placeholder="https://example.com"
              maxlength="200"
            >

          </div>


          <!-- DESCRIPTION -->

          <div class="form-group">

            <label for="description">
              Business Description *
            </label>

            <textarea
              id="description"
              name="description"
              placeholder="Tell customers what your business offers..."
              rows="5"
              required
              maxlength="1000"
            ></textarea>

          </div>


          <!-- OWNER EMAIL -->

          <div class="form-group">

            <label for="email">
              Contact Email *
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
              maxlength="150"
            >

          </div>


          <!-- TERMS -->

          <div
            class="form-group"
            style="margin-top:1.5rem;"
          >

            <label
              style="display:flex;gap:0.7rem;align-items:flex-start;"
            >

              <input
                type="checkbox"
                id="terms"
                name="terms"
                required
                style="margin-top:0.3rem;"
              >

              <span>
                I confirm that the information provided is
                accurate and that I have permission to submit
                this business.
              </span>

            </label>

          </div>


          <!-- STATUS -->

          <div
            id="submission-status"
            role="status"
            aria-live="polite"
            style="margin:1rem 0;"
          ></div>


          <!-- SUBMIT -->

          <button
            type="submit"
            class="btn btn-primary"
            id="submit-business"
          >
            Submit Business
          </button>

          <p
            class="text-muted"
            style="font-size:0.85rem;margin-top:1rem;"
          >
            Your submission will be reviewed by NearAfrica
            before it becomes publicly visible.
          </p>

        </form>

      </div>

    </div>

  </section>

</main>


<footer class="site-footer">

  <div class="container">

    <div class="footer-bottom">

      <span>
        © 2026 NearAfrica
      </span>

      <span>
        Find businesses across Africa
      </span>

    </div>

  </div>

</footer>


<!-- Existing NearAfrica scripts -->

<script src="config.js"></script>
<script src="businesses.js"></script>
<script src="utils.js"></script>
<script src="app.js"></script>


<!-- Temporary form handler -->
<script>

  const form = document.getElementById(
    "business-submission-form"
  );

  const statusBox = document.getElementById(
    "submission-status"
  );

  form.addEventListener("submit", function(event) {

    event.preventDefault();

    if (!form.checkValidity()) {

      statusBox.textContent =
        "Please complete all required fields.";

      statusBox.style.color = "crimson";

      form.reportValidity();

      return;
    }

    statusBox.textContent =
      "Your business information is ready to be submitted. The NearAfrica database will be connected next.";

    statusBox.style.color = "green";

  });

</script>

</body>
                </html>
