<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Business Profile | NearAfrica</title>

  <style>
    :root {
      --bg: #0b0b0b;
      --bg-secondary: #121212;
      --card: #151515;
      --card-hover: #1b1b1b;
      --border: #292929;
      --gold: #d4af37;
      --gold-light: #e3c55b;
      --text: #f4f4f4;
      --text-muted: #a6a6a6;
      --danger: #e57373;
      --success: #81c784;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none !important;
    }

    .site-header {
      border-bottom: 1px solid var(--border);
      background: rgba(11, 11, 11, 0.96);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .brand span {
      color: var(--gold);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 22px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .nav a:hover {
      color: var(--text);
    }

    .profile-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 34px 22px 60px;
    }

    .loading,
    .error-state {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      color: var(--text-muted);
    }

    .error-state h2 {
      color: var(--text);
      margin-top: 0;
    }

    .profile-header {
      background:
        linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.12),
          rgba(21, 21, 21, 0.95)
        );
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .profile-header-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 25px;
    }

    .business-title-wrap {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .business-logo {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .business-placeholder {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202020;
      border: 1px solid var(--border);
      color: var(--gold);
      font-size: 30px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .profile-header h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.15;
    }

    .business-category {
      color: var(--gold-light);
      font-size: 14px;
      margin-bottom: 7px;
    }

    .business-location {
      color: var(--text-muted);
      font-size: 14px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
    }

    .badge.gold {
      color: var(--gold-light);
      border-color: rgba(212, 175, 55, 0.35);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text);
      border-radius: 9px;
      padding: 10px 14px;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .btn:hover {
      background: var(--card-hover);
      border-color: #3a3a3a;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
    }

    .btn-danger {
      color: #ffaaaa;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .stat {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(0, 0, 0, 0.18);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
    }

    .profile-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 15px;
      padding: 23px;
      margin-bottom: 20px;
    }

    .profile-card h2 {
      margin: 0 0 15px;
      font-size: 19px;
    }

    .profile-card p {
      color: var(--text-muted);
      margin-top: 0;
    }

    .info-list {
      display: grid;
      gap: 13px;
    }

    .info-item {
      padding-bottom: 13px;
      border-bottom: 1px solid var(--border);
    }

    .info-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .info-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .info-value {
      word-break: break-word;
    }

    .hours-list {
      display: grid;
      gap: 0;
    }

    .hours-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 15px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .hours-row:last-child {
      border-bottom: 0;
    }

    .hours-day {
      font-weight: 700;
      color: var(--text);
    }

    .hours-time {
      color: var(--text-muted);
    }

    .hours-closed {
      color: var(--danger);
    }

    .hours-open {
      color: var(--success);
    }

    .hours-today {
      background: rgba(212, 175, 55, 0.08);
      border-radius: 8px;
      padding-left: 10px;
      padding-right: 10px;
      margin-left: -10px;
      margin-right: -10px;
    }

    .photos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .review {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .review:last-child {
      border-bottom: 0;
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .review-name {
      font-weight: 700;
    }

    .review-date {
      color: var(--text-muted);
      font-size: 12px;
    }

    .stars {
      color: var(--gold);
      letter-spacing: 2px;
      margin: 5px 0;
    }

    .review-comment {
      color: var(--text-muted);
      margin: 0;
      white-space: pre-wrap;
    }

    .products-list {
      display: grid;
      gap: 12px;
    }

    .product-card {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 17px;
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .product-name {
      margin: 0;
      font-size: 17px;
    }

    .product-type {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .product-price {
      color: var(--gold-light);
      font-weight: 800;
      white-space: nowrap;
    }

    .product-description {
      color: var(--text-muted);
      margin: 10px 0 0;
    }

    .product-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .product-meta span {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .product-unavailable {
      color: #e6a6a6 !important;
    }

    .empty-state {
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      text-align: center;
    }

    .map {
      width: 100%;
      height: 340px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .claim-box {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background:
        linear-gradient(
          145deg,
          rgba(212, 175, 55, 0.05),
          var(--bg-secondary)
        );
    }

    .claim-box h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .claim-box p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .claim-form,
    .verification-form {
      display: grid;
      gap: 11px;
      margin-top: 16px;
    }

    .claim-form input,
    .claim-form textarea,
    .verification-form input {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      padding: 12px;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .claim-form input:focus,
    .claim-form textarea:focus,
    .verification-form input:focus {
      border-color: var(--gold);
      box-shadow:
        0 0 0 3px rgba(212, 175, 55, 0.08);
    }

    .verification-box {
      display: none;
    }

    .verification-box.active {
      display: block;
    }

    .verification-email {
      color: var(--gold-light) !important;
      font-weight: 700;
      word-break: break-word;
    }

    .otp-input {
      text-align: center;
      font-size: 24px !important;
      font-weight: 800;
      letter-spacing: 8px;
    }

    .otp-input::placeholder {
      letter-spacing: 5px;
      color: #555;
    }

    .verification-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .verification-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 13px;
    }

    .verification-actions .btn {
      flex: 1 1 150px;
    }

    .claim-success {
      padding: 15px;
      border: 1px solid rgba(129, 199, 132, 0.25);
      border-radius: 10px;
      background: rgba(129, 199, 132, 0.06);
    }

    .claim-success-title {
      color: var(--success);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .claim-error {
      padding: 12px;
      border: 1px solid rgba(229, 115, 115, 0.25);
      border-radius: 9px;
      background: rgba(229, 115, 115, 0.05);
    }

    .status {
      margin-top: 11px;
      font-size: 13px;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .status.info {
      color: var(--text-muted);
    }

    .status.warning {
      color: var(--gold-light);
    }

    .resend-note {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .contact-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 850px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }

      .profile-header-main {
        flex-direction: column;
      }

      .header-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 620px) {
      .profile-container {
        padding: 20px 14px 45px;
      }

      .header-inner {
        padding: 13px 14px;
      }

      .nav {
        gap: 12px;
        font-size: 12px;
      }

      .profile-header {
        padding: 21px;
      }

      .business-title-wrap {
        flex-direction: column;
      }

      .profile-header h1 {
        font-size: 27px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .photos-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-top {
        flex-direction: column;
      }

      .product-price {
        white-space: normal;
      }

      .hours-row {
        grid-template-columns: 100px 1fr;
        gap: 10px;
      }

      .verification-actions {
        flex-direction: column;
      }

      .verification-actions .btn {
        width: 100%;
      }

      .otp-input {
        font-size: 21px !important;
        letter-spacing: 6px;
      }
    }
  </style>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body class="business-page">

  <header class="site-header">
    <div class="header-inner">

      <a href="/" class="brand">
        Near<span>Africa</span>
      </a>

      <nav class="nav">
        <a href="/">Home</a>
        <a href="/explore.html">Explore</a>
        <a href="/submit.html">List Your Business</a>
      </nav>

    </div>
  </header>

  <main class="profile-container">

    <div id="businessContent">
      <div class="loading">
        Loading business...
      </div>
    </div>

  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script>
    (() => {

      const API_URL =
        "https://nearafrica-api.nearafrica-onyxtech.workers.dev";

      const content =
        document.getElementById(
          "businessContent"
        );

      let activeMap = null;

      function getBusinessId() {
        const params =
          new URLSearchParams(
            window.location.search
          );

        return (
          params.get("id") ||
          params.get("business_id") ||
          params.get("slug")
        );
      }

      function escapeHtml(value) {
        const div =
          document.createElement("div");

        div.textContent =
          value === null ||
          value === undefined
            ? ""
            : String(value);

        return div.innerHTML;
      }

      function normalizeCategory(
        category
      ) {
        if (!category) {
          return "";
        }

        return String(category)
          .replace(/[-_]/g, " ")
          .replace(/\b\w/g, c =>
            c.toUpperCase()
          );
      }

      function formatLocation(
        business
      ) {
        return [
          business.address,
          business.city,
          business.state,
          business.country
        ]
          .filter(Boolean)
          .join(", ");
      }

      function formatDate(
        value
      ) {
        if (!value) {
          return "";
        }

        const date =
          new Date(value);

        if (
          Number.isNaN(
            date.getTime()
          )
        ) {
          return String(value);
        }

        return date.toLocaleDateString(
          undefined,
          {
            year: "numeric",
            month: "short",
            day: "numeric"
          }
        );
      }

      function renderStars(
        rating
      ) {
        const numeric =
          Number(rating);

        if (
          !Number.isFinite(
            numeric
          )
        ) {
          return "";
        }

        const rounded =
          Math.max(
            0,
            Math.min(
              5,
              Math.round(numeric)
            )
          );

        return "★".repeat(
          rounded
        ) +
        "☆".repeat(
          5 - rounded
        );
      }

      function cleanWhatsAppNumber(
        value
      ) {
        if (!value) {
          return "";
        }

        return String(value)
          .replace(/[^\d]/g, "");
      }

      function normalizeWebsite(
        value
      ) {
        if (!value) {
          return "";
        }

        const trimmed =
          String(value).trim();

        if (
          /^https?:\/\//i.test(
            trimmed
          )
        ) {
          return trimmed;
        }

        return (
          "https://" +
          trimmed
        );
      }

      function showNotFound(
        message
      ) {
        content.innerHTML = `
          <div class="error-state">
            <h2>Business Not Found</h2>

            <p>
              ${escapeHtml(
                message ||
                "This business could not be found."
              )}
            </p>

            <a
              href="/"
              class="btn btn-primary"
            >
              Back to NearAfrica
            </a>
          </div>
        `;
      }

      function formatProductPrice(
        product
      ) {
        if (
          product.price === null ||
          product.price === undefined ||
          product.price === ""
        ) {
          return "Price not specified";
        }

        const price =
          Number(product.price);

        if (
          !Number.isFinite(
            price
          )
        ) {
          return "Price not specified";
        }

        const currency =
          product.currency ||
          "NGN";

        return (
          currency +
          " " +
          price.toLocaleString(
            undefined,
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }
          )
        );
      }

      function renderProducts(
        products
      ) {
        if (
          !Array.isArray(
            products
          ) ||
          products.length === 0
        ) {
          return `
            <div class="empty-state">
              No products or services have been added yet.
            </div>
          `;
        }

        return `
          <div class="products-list">
            ${products
              .map(product => {

                const type =
                  product.item_type ===
                  "service"
                    ? "Service"
                    : "Product";

                const available =
                  Number(
                    product.available
                  ) === 1;

                return `
                  <div class="product-card">

                    <div class="product-top">

                      <div>
                        <h3 class="product-name">
                          ${escapeHtml(
                            product.name ||
                            "Unnamed item"
                          )}
                        </h3>

                        <div class="product-type">
                          ${escapeHtml(
                            type
                          )}
                        </div>
                      </div>

                      <div class="product-price">
                        ${escapeHtml(
                          formatProductPrice(
                            product
                          )
                        )}
                      </div>

                    </div>

                    <p class="product-description">
                      ${escapeHtml(
                        product.description ||
                        "No description provided."
                      )}
                    </p>

                    <div class="product-meta">

                      ${
                        product.category
                          ? `
                            <span>
                              Category:
                              ${escapeHtml(
                                product.category
                              )}
                            </span>
                          `
                          : ""
                      }

                      <span
                        class="${
                          available
                            ? ""
                            : "product-unavailable"
                        }"
                      >
                        ${
                          available
                            ? "Available"
                            : "Currently unavailable"
                        }
                      </span>

                    </div>

                  </div>
                `;
              })
              .join("")}
          </div>
        `;
      }

      function normalizeHours(hours) {

        if (!hours) {
          return null;
        }

        if (
          Array.isArray(hours)
        ) {
          return hours;
        }

        if (
          typeof hours === "object"
        ) {

          if (
            Array.isArray(
              hours.results
            )
          ) {
            return hours.results;
          }

          if (
            Array.isArray(
              hours.hours
            )
          ) {
            return hours.hours;
          }

          return hours;
        }

        return null;
      }

      function formatHoursValue(
        value
      ) {

        if (
          value === null ||
          value === undefined ||
          value === ""
        ) {
          return "Not specified";
        }

        if (
          typeof value === "string"
        ) {
          return value;
        }

        return String(value);
      }

      function getDayName(
        value
      ) {

        if (
          value === null ||
          value === undefined ||
          value === ""
        ) {
          return "";
        }

        return String(value)
          .trim()
          .toLowerCase();
      }

      function renderHours(
        hours
      ) {

        const normalized =
          normalizeHours(
            hours
          );

        if (
          !normalized
        ) {
          return `
            <div class="empty-state">
              Opening hours are not available yet.
            </div>
          `;
        }

        const dayOrder = [
          "monday",
          "tuesday",
          "wednesday",
          "thursday",
          "friday",
          "saturday",
          "sunday"
        ];

        const dayLabels = {
          monday: "Monday",
          tuesday: "Tuesday",
          wednesday: "Wednesday",
          thursday: "Thursday",
          friday: "Friday",
          saturday: "Saturday",
          sunday: "Sunday"
        };

        const sundayFirst = [
          "sunday",
          "monday",
          "tuesday",
          "wednesday",
          "thursday",
          "friday",
          "saturday"
        ];

        const today =
          new Date()
            .toLocaleDateString(
              "en-US",
              {
                weekday: "long"
              }
            )
            .toLowerCase();

        if (
          Array.isArray(
            normalized
          )
        ) {

          const byDay = {};

          normalized.forEach(
            item => {

              if (
                !item ||
                typeof item !==
                  "object"
              ) {
                return;
              }

              let day = "";

              if (
                item.day_of_week !==
                  undefined &&
                item.day_of_week !==
                  null &&
                item.day_of_week !== ""
              ) {

                const numericDay =
                  Number(
                    item.day_of_week
                  );

                if (
                  Number.isInteger(
                    numericDay
                  ) &&
                  numericDay >= 0 &&
                  numericDay <= 6
                ) {

                  day =
                    sundayFirst[
                      numericDay
                    ];
                }
              }

              if (!day) {

                day =
                  getDayName(
                    item.day ||
                    item.day_name ||
                    item.weekday
                  );
              }

              if (day) {
                byDay[day] =
                  item;
              }
            }
          );

          return `
            <div class="hours-list">

              ${dayOrder
                .map(day => {

                  const item =
                    byDay[day];

                  if (!item) {

                    return `
                      <div
                        class="hours-row ${
                          today === day
                            ? "hours-today"
                            : ""
                        }"
                      >

                        <div class="hours-day">
                          ${dayLabels[day]}
                        </div>

                        <div class="hours-time hours-closed">
                          Hours not available
                        </div>

                      </div>
                    `;
                  }

                  const isClosed =
                    Number(
                      item.is_closed
                    ) === 1 ||
                    item.is_closed === true ||
                    Number(
                      item.closed
                    ) === 1 ||
                    item.closed === true ||
                    String(
                      item.status ||
                      ""
                    ).toLowerCase() ===
                      "closed";

                  const is24Hours =
                    Number(
                      item.is_24_hours
                    ) === 1 ||
                    item.is_24_hours === true ||
                    String(
                      item.status ||
                      ""
                    ).toLowerCase() ===
                      "24";

                  const opening =
                    item.opening_time ||
                    item.open_time ||
                    item.open ||
                    item.opens_at;

                  const closing =
                    item.closing_time ||
                    item.close_time ||
                    item.close ||
                    item.closes_at;

                  let display =
                    "Closed";

                  let displayClass =
                    "hours-closed";

                  if (
                    is24Hours
                  ) {

                    display =
                      "24 Hours";

                    displayClass =
                      "hours-open";

                  } else if (
                    !isClosed
                  ) {

                    if (
                      opening ||
                      closing
                    ) {

                      display =
                        `${formatHoursValue(
                          opening
                        )} – ${formatHoursValue(
                          closing
                        )}`;

                      displayClass =
                        "hours-open";

                    } else if (
                      item.hours
                    ) {

                      display =
                        item.hours;

                      displayClass =
                        "hours-open";

                    } else {

                      display =
                        "Hours not available";

                      displayClass =
                        "hours-closed";
                    }
                  }

                  return `
                    <div
                      class="hours-row ${
                        today === day
                          ? "hours-today"
                          : ""
                      }"
                    >

                      <div class="hours-day">
                        ${dayLabels[day]}
                      </div>

                      <div
                        class="hours-time ${displayClass}"
                      >
                        ${escapeHtml(
                          display
                        )}
                      </div>

                    </div>
                  `;
                })
                .join("")}

            </div>
          `;
        }

        if (
          typeof normalized ===
            "object"
        ) {

          return `
            <div class="hours-list">

              ${dayOrder
                .map(day => {

                  const item =
                    normalized[day];

                  let display =
                    "Closed";

                  let closed =
                    false;

                  let is24Hours =
                    false;

                  if (
                    typeof item ===
                      "string"
                  ) {

                    display =
                      item;

                    closed =
                      item
                        .toLowerCase()
                        .includes(
                          "closed"
                        );

                  } else if (
                    item &&
                    typeof item ===
                      "object"
                  ) {

                    closed =
                      Number(
                        item.is_closed ??
                        item.closed ??
                        0
                      ) === 1 ||
                      item.is_closed === true ||
                      item.closed === true;

                    is24Hours =
                      Number(
                        item.is_24_hours ??
                        0
                      ) === 1 ||
                      item.is_24_hours === true;

                    if (
                      is24Hours
                    ) {

                      display =
                        "24 Hours";

                    } else if (
                      !closed
                    ) {

                      const opening =
                        item.opening_time ||
                        item.open_time ||
                        item.open ||
                        item.opens_at;

                      const closing =
                        item.closing_time ||
                        item.close_time ||
                        item.close ||
                        item.closes_at;

                      if (
                        opening ||
                        closing
                      ) {

                        display =
                          `${formatHoursValue(
                            opening
                          )} – ${formatHoursValue(
                            closing
                          )}`;

                      } else if (
                        item.hours
                      ) {

                        display =
                          item.hours;

                      } else {

                        display =
                          "Hours not available";
                      }
                    }
                  }

                  return `
                    <div
                      class="hours-row ${
                        today === day
                          ? "hours-today"
                          : ""
                      }"
                    >

                      <div class="hours-day">
                        ${dayLabels[day]}
                      </div>

                      <div
                        class="hours-time ${
                          closed
                            ? "hours-closed"
                            : "hours-open"
                        }"
                      >
                        ${escapeHtml(
                          display
                        )}
                      </div>

                    </div>
                  `;
                })
                .join("")}

            </div>
          `;
        }

        return `
          <div class="empty-state">
            Opening hours are not available yet.
          </div>
        `;
      }

      function initializeMap(
        business
      ) {

        const mapElement =
          document.getElementById(
            "businessMap"
          );

        if (
          !mapElement ||
          typeof L ===
            "undefined"
        ) {
          return;
        }

        const latitude =
          Number(
            business.latitude
          );

        const longitude =
          Number(
            business.longitude
          );

        if (
          !Number.isFinite(
            latitude
          ) ||
          !Number.isFinite(
            longitude
          )
        ) {
          return;
        }

        if (activeMap) {
          activeMap.remove();
          activeMap = null;
        }

        activeMap =
          L.map(
            mapElement
          ).setView(
            [
              latitude,
              longitude
            ],
            15
          );

        L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            attribution:
              "&copy; OpenStreetMap contributors"
          }
        ).addTo(
          activeMap
        );

        L.marker([
          latitude,
          longitude
        ])
          .addTo(activeMap)
          .bindPopup(
            escapeHtml(
              business.business_name ||
              business.name ||
              "Business"
            )
          )
          .openPopup();
      }

        const resendOtpButton =

        const otpExpiry =
          document.getElementById(
            "otpExpiry"
          );

        let activeClaimId =
          null;

        let resendCooldownTimer =
          null;

        let resendCooldownSeconds =
          0;

        function setClaimStatus(
          message,
          type = "info"
        ) {

          if (!claimStatus) {
            return;
          }

          claimStatus.className =
            `status ${type}`;

          claimStatus.textContent =
            message || "";
        }

        function setVerificationStatus(
          message,
          type = "info"
        ) {

          if (!verificationStatus) {
            return;
          }

          verificationStatus.className =
            `status ${type}`;

          verificationStatus.textContent =
            message || "";
        }

        function setButtonLoading(
          button,
          loadingText,
          normalText,
          disabled
        ) {

          if (!button) {
            return;
          }

          button.disabled =
            Boolean(disabled);

          button.textContent =
            disabled
              ? loadingText
              : normalText;
        }

        function startResendCooldown(
          seconds = 60
        ) {

          if (!resendOtpButton) {
            return;
          }

          if (resendCooldownTimer) {
            clearInterval(
              resendCooldownTimer
            );

            resendCooldownTimer =
              null;
          }

          resendCooldownSeconds =
            Math.max(
              0,
              Number(seconds) || 0
            );

          if (
            resendCooldownSeconds <=
            0
          ) {

            resendOtpButton.disabled =
              false;

            resendOtpButton.textContent =
              "Resend Code";

            return;
          }

          resendOtpButton.disabled =
            true;

          resendOtpButton.textContent =
            `Resend Code (${resendCooldownSeconds}s)`;

          resendCooldownTimer =
            setInterval(
              () => {

                resendCooldownSeconds--;

                if (
                  resendCooldownSeconds <=
                  0
                ) {

                  clearInterval(
                    resendCooldownTimer
                  );

                  resendCooldownTimer =
                    null;

                  resendOtpButton.disabled =
                    false;

                  resendOtpButton.textContent =
                    "Resend Code";

                  return;
                }

                resendOtpButton.textContent =
                  `Resend Code (${resendCooldownSeconds}s)`;

              },
              1000
            );
        }

        function showVerificationStep(
          result
        ) {

          activeClaimId =
            result.claim_id ||
            null;

          if (!activeClaimId) {

            setClaimStatus(
              "The claim was created, but no claim ID was returned. Please contact NearAfrica support.",
              "error"
            );

            return;
          }

          if (
            verificationEmail
          ) {

            verificationEmail.textContent =
              result.verification_email ||
              "the business email currently listed on NearAfrica";
          }

          if (
            otpExpiry
          ) {

            const minutes =
              Number(
                result.expires_in_minutes
              ) || 10;

            otpExpiry.textContent =
              `${minutes} minute${minutes === 1 ? "" : "s"}`;
          }

          if (
            requestSection
          ) {
            requestSection.style.display =
              "none";
          }

          if (
            verificationSection
          ) {

            verificationSection.classList.add(
              "active"
            );
          }

          if (
            completedSection
          ) {

            completedSection.classList.remove(
              "active"
            );
          }

          setClaimStatus(
            result.message ||
            "Your claim was created. Enter the verification code sent to the business email.",
            "success"
          );

          setVerificationStatus(
            "Enter the 6-digit verification code.",
            "info"
          );

          if (otpInput) {
            otpInput.value = "";
            otpInput.focus();
          }

          startResendCooldown(
            60
          );
        }

        function showCompletedStep() {

          if (
            requestSection
          ) {
            requestSection.style.display =
              "none";
          }

          if (
            verificationSection
          ) {

            verificationSection.classList.remove(
              "active"
            );
          }

          if (
            completedSection
          ) {

            completedSection.classList.add(
              "active"
            );
          }

          setClaimStatus(
            "",
            "success"
          );

          setVerificationStatus(
            "",
            "success"
          );
        }

        form.addEventListener(
          "submit",
          async event => {

            event.preventDefault();

            const name =
              document.getElementById(
                "claimName"
              ).value.trim();

            const email =
              document.getElementById(
                "claimEmail"
              ).value.trim();

            const evidence =
              document.getElementById(
                "claimEvidence"
              ).value.trim();

            if (
              !name ||
              !email ||
              !evidence
            ) {

              setClaimStatus(
                "Please complete all fields.",
                "error"
              );

              return;
            }

            if (
              !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                email
              )
            ) {

              setClaimStatus(
                "Please enter a valid email address.",
                "error"
              );

              return;
            }

            setClaimStatus(
              "Submitting claim...",
              "info"
            );

            setButtonLoading(
              claimSubmitButton,
              "Submitting...",
              "Submit Claim",
              true
            );

            try {

              const response =
                await fetch(
                  `${API_URL}/businesses/${encodeURIComponent(
                    business.id
                  )}/claim`,
                  {
                    method: "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body:
                      JSON.stringify({
                        claimant_name:
                          name,

                        claimant_email:
                          email,

                        evidence_type:
                          "email",

                        evidence_details:
                          evidence
                      })
                  }
                );

              let result = {};

              try {

                result =
                  await response.json();

              } catch (
                parseError
              ) {

                result = {
                  status:
                    "error",
                  message:
                    "The server returned an invalid response."
                };
              }

              if (
                !response.ok ||
                result.status !==
                  "ok"
              ) {

                throw new Error(
                  result.message ||
                  "Unable to submit claim."
                );
              }

              showVerificationStep(
                result
              );

            } catch (error) {

              console.error(
                "Claim submission failed:",
                error
              );

              setClaimStatus(
                error.message ||
                "Unable to submit your claim. Please try again.",
                "error"
              );

            } finally {

              setButtonLoading(
                claimSubmitButton,
                "Submitting...",
                "Submit Claim",
                false
              );
            }
          }
        );

        if (
          verificationForm
        ) {

          verificationForm.addEventListener(
            "submit",
            async event => {

              event.preventDefault();

              if (
                !activeClaimId
              ) {

                setVerificationStatus(
                  "Your claim session is missing. Please submit the claim again.",
                  "error"
                );

                return;
              }

              const otp =
                otpInput
                  ? otpInput.value
                      .replace(
                        /\D/g,
                        ""
                      )
                      .slice(
                        0,
                        6
                      )
                  : "";

              if (
                !/^\d{6}$/.test(
                  otp
                )
              ) {

                setVerificationStatus(
                  "Please enter the 6-digit verification code.",
                  "error"
                );

                if (otpInput) {
                  otpInput.focus();
                }

                return;
              }

              setVerificationStatus(
                "Verifying code...",
                "info"
              );

              setButtonLoading(
                verifyOtpButton,
                "Verifying...",
                "Verify Code",
                true
              );

              if (
                resendOtpButton
              ) {
                resendOtpButton.disabled =
                  true;
              }

              try {

                const response =
                  await fetch(
                    `${API_URL}/claims/${encodeURIComponent(
                      activeClaimId
                    )}/verify`,
                    {
                      method: "POST",

                      headers: {
                        "Content-Type":
                          "application/json"
                      },

                      body:
                        JSON.stringify({
                          otp:
                            otp
                        })
                    }
                  );

                let result = {};

                try {

                  result =
                    await response.json();

                } catch (
                  parseError
                ) {

                  result = {
                    status:
                      "error",
                    message:
                      "The server returned an invalid response."
                  };
                }

                if (
                  !response.ok ||
                  result.status !==
                    "ok"
                ) {

                  throw new Error(
                    result.message ||
                    "The verification code could not be verified."
                  );
                }

                showCompletedStep();

              } catch (error) {

                console.error(
                  "Claim verification failed:",
                  error
                );

                setVerificationStatus(
                  error.message ||
                  "The verification code could not be verified.",
                  "error"
                );

                if (
                  resendCooldownSeconds <=
                  0
                ) {

                  if (
                    resendOtpButton
                  ) {
                    resendOtpButton.disabled =
                      false;
                  }
                }

              } finally {

                setButtonLoading(
                  verifyOtpButton,
                  "Verifying...",
                  "Verify Code",
                  false
                );
              }
            }
          );
        }

        if (
          otpInput
        ) {

          otpInput.addEventListener(
            "input",
            () => {

              otpInput.value =
                otpInput.value
                  .replace(
                    /\D/g,
                    ""
                  )
                  .slice(
                    0,
                    6
                  );
            }
          );
        }

        if (
          resendOtpButton
        ) {

          resendOtpButton.addEventListener(
            "click",
            async () => {

              if (
                !activeClaimId
              ) {

                setVerificationStatus(
                  "Your claim session is missing. Please submit the claim again.",
                  "error"
                );

                return;
              }

              if (
                resendCooldownSeconds >
                0
              ) {

                return;
              }

              setVerificationStatus(
                "Requesting a new verification code...",
                "info"
              );

              setButtonLoading(
                resendOtpButton,
                "Sending...",
                "Resend Code",
                true
              );

              if (
                verifyOtpButton
              ) {
                verifyOtpButton.disabled =
                  true;
              }

              try {

                const response =
                  await fetch(
                    `${API_URL}/claims/${encodeURIComponent(
                      activeClaimId
                    )}/resend`,
                    {
                      method: "POST",

                      headers: {
                        "Content-Type":
                          "application/json"
                      },

                      body:
                        JSON.stringify({})
                    }
                  );

                let result = {};

                try {

                  result =
                    await response.json();

                } catch (
                  parseError
                ) {

                  result = {
                    status:
                      "error",
                    message:
                      "The server returned an invalid response."
                  };
                }

                if (
                  !response.ok ||
                  result.status !==
                    "ok"
                ) {

                  throw new Error(
                    result.message ||
                    "Unable to resend the verification code."
                  );
                }

                if (
                  verificationEmail &&
                  result.verification_email
                ) {

                  verificationEmail.textContent =
                    result.verification_email;
                }

                if (
                  otpExpiry
                ) {

                  const minutes =
                    Number(
                      result.expires_in_minutes
                    ) || 10;

                  otpExpiry.textContent =
                    `${minutes} minute${minutes === 1 ? "" : "s"}`;
                }

                if (otpInput) {
                  otpInput.value = "";
                  otpInput.focus();
                }

                setVerificationStatus(
                  result.message ||
                  "A new verification code has been sent.",
                  "success"
                );

                startResendCooldown(
                  60
                );

              } catch (error) {

                console.error(
                  "Claim verification resend failed:",
                  error
                );

                setVerificationStatus(
                  error.message ||
                  "Unable to resend the verification code.",
                  "error"
                );

                if (
                  resendCooldownSeconds <=
                  0
                ) {

                  resendOtpButton.disabled =
                    false;

                  resendOtpButton.textContent =
                    "Resend Code";
                }

              } finally {

                if (
                  verifyOtpButton
                ) {

                  verifyOtpButton.disabled =
                    false;
                }

                if (
                  resendCooldownSeconds <=
                  0
                ) {

                  resendOtpButton.disabled =
                    false;

                  resendOtpButton.textContent =
                    "Resend Code";
                }
              }
            }
          );
        }
      }

      /*
       * Record one public business-profile view.
       *
       * This is deliberately separate from the business GET request.
       * If analytics tracking fails, the visitor can still use the page.
       */
      async function recordBusinessView(
        businessId
      ) {

        if (!businessId) {
          return;
        }

        try {

          const response =
            await fetch(
              `${API_URL}/businesses/${encodeURIComponent(
                businessId
              )}/view`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                cache: "no-store"
              }
            );

          if (!response.ok) {

            console.warn(
              "Business view tracking returned HTTP",
              response.status
            );

            return;
          }

          let result = {};

          try {

            result =
              await response.json();

          } catch (
            parseError
          ) {
            /*
             * The request itself succeeded.
             * An invalid response body does not
             * affect the visitor's profile.
             */
          }

          if (
            result &&
            result.status &&
            result.status !== "ok"
          ) {

            console.warn(
              "Business view tracking response:",
              result
            );
          }

        } catch (error) {

          /*
           * Analytics must never prevent a visitor
           * from viewing the business profile.
           */
          console.warn(
            "Business view tracking failed:",
            error
          );
        }
      }

      /*
       * Load the public business profile.
       *
       * cache: "no-store" plus a timestamp query parameter
       * prevents an older cached GET response from hiding
       * recent owner-dashboard changes.
       */
      async function loadBusiness() {

        const businessId =
          getBusinessId();

        if (!businessId) {

          showNotFound(
            "No business ID was provided."
          );

          return;
        }

        try {

          const apiUrl =
            `${API_URL}/businesses/${encodeURIComponent(
              businessId
            )}?_=${Date.now()}`;

          const response =
            await fetch(
              apiUrl,
              {
                method: "GET",
                cache: "no-store"
              }
            );

          let result = {};

          try {

            result =
              await response.json();

          } catch (
            parseError
          ) {

            console.error(
              "Business API returned invalid JSON:",
              parseError
            );

            result = {
              status:
                "error",

              message:
                "The server returned an invalid response."
            };
          }

          if (
            !response.ok ||
            result.status !==
              "ok" ||
            !result.business
          ) {

            console.error(
              "Business API error:",
              result
            );

            showNotFound(
              result.message ||
              "This business could not be found."
            );

            return;
          }

          /*
           * Render the business first.
           * The visitor does not need to wait for
           * analytics tracking.
           */
          displayBusiness(
            result.business,
            result
          );

          /*
           * Record the successful public profile visit.
           *
           * We intentionally do not use the original
           * URL identifier here when the API gives us
           * the real business ID. This ensures that
           * business_views always stores the canonical
           * business ID.
           */
          recordBusinessView(
            result.business.id ||
            businessId
          );

        } catch (error) {

          console.error(
            "Business loading failed:",
            error
          );

          showNotFound(
            "Unable to load this business right now."
          );
        }
      }

      loadBusiness();

    })();
  </script>
