<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Profile | NearAfrica</title>

    <meta
        name="description"
        content="Discover businesses across Africa with NearAfrica."
    >

    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        .business-page {
            min-height: 100vh;
            background: #0d0d0d;
            color: #fff;
        }

        .profile-container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px 70px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #d4af37;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .profile-header {
            background: #171717;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .profile-category {
            display: inline-block;
            margin-bottom: 10px;
            color: #d4af37;
            font-size: .9rem;
            font-weight: 600;
        }

        .profile-header h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 3.2rem);
        }

        .profile-location {
            color: #aaa;
            margin-bottom: 15px;
        }

        .profile-rating {
            color: #d4af37;
            margin-bottom: 20px;
        }

        .profile-description {
            color: #bbb;
            line-height: 1.7;
            max-width: 750px;
        }

        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .profile-btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid #333;
            color: #fff;
            background: #202020;
        }

        .profile-btn.primary {
            background: #d4af37;
            color: #111;
            border-color: #d4af37;
        }

        .profile-btn:hover {
            opacity: .9;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .profile-section {
            background: #171717;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 25px;
        }

        .profile-section h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.2rem;
        }

        .detail-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            color: #bbb;
        }

        .detail-label {
            min-width: 100px;
            color: #d4af37;
            font-weight: 600;
        }

        #business-map {
            width: 100%;
            height: 350px;
            border-radius: 12px;
            overflow: hidden;
        }

        .claim-section {
            margin-top: 25px;
            background:
                linear-gradient(
                    135deg,
                    rgba(212,175,55,.12),
                    rgba(212,175,55,.03)
                );
            border: 1px solid rgba(212,175,55,.3);
            border-radius: 18px;
            padding: 30px;
        }

        .claim-section h2 {
            margin-top: 0;
        }

        .claim-section p {
            color: #aaa;
            line-height: 1.6;
        }

        .claim-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 18px;
            background: #d4af37;
            color: #111;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .claim-btn:hover {
            opacity: .9;
        }
