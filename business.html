<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Business | NearAfrica</title>

    <meta
        name="description"
        content="Discover businesses across Africa with NearAfrica."
    >

    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        .business-page {
            min-height: 100vh;
        }

        .profile-container {
            width: min(1180px, 92%);
            margin: 0 auto;
            padding: 40px 0 70px;
        }

        .profile-header {
            background: #111;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 22px;
            padding: 32px;
            margin-bottom: 25px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .profile-top {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .business-logo {
            width: 110px;
            height: 110px;
            border-radius: 18px;
            background: #1c1c1c;
            border: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .business-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .business-logo-placeholder {
            font-size: 42px;
            font-weight: 800;
            color: #d4af37;
        }

        .profile-main {
            flex: 1;
        }

        .business-category {
            display: inline-block;
            color: #d4af37;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-main h1 {
            margin: 0 0 10px;
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.1;
        }

        .business-location {
            color: #bbb;
            margin-bottom: 12px;
        }

        .business-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .stars {
            color: #d4af37;
            letter-spacing: 2px;
        }

        .rating-text {
            color: #ccc;
            font-size: 14px;
        }

        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .verified-badge {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.25);
        }

        .claimed-badge {
            background: rgba(212, 175, 55, 0.12);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .active-badge {
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.25);
        }

        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }

        .profile-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            background: #171717;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .profile-btn:hover {
            transform: translateY(-1px);
            border-color: #d4af37;
        }

        .profile-btn.primary {
            background: #d4af37;
            color: #111;
            border-color: #d4af37;
        }

       .profile-btn.primary:hover {
    background: #e4c45a;
}

.profile-btn.report-btn {
    color: #f87171;
    border-color: rgba(248, 113, 113, 0.3);
    background: rgba(248, 113, 113, 0.05);
}

.profile-btn.report-btn:hover {
    border-color: #f87171;
    background: rgba(248, 113, 113, 0.1);
}
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        .profile-card {
            background: #111;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .profile-card h2 {
            margin: 0 0 18px;
            font-size: 22px;
        }

        .profile-card h3 {
            margin: 0 0 12px;
        }

        .description {
            color: #ccc;
            line-height: 1.8;
            white-space: pre-line;
        }

        .info-list {
            display: grid;
            gap: 14px;
        }

        .info-item {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .info-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-label {
            color: #888;
            font-size: 14px;
        }

        .info-value {
            color: #eee;
            word-break: break-word;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .business-photo {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 12px;
            background: #1a1a1a;
        }

        #businessMap {
            width: 100%;
            height: 360px;
            border-radius: 14px;
            overflow: hidden;
            background: #1a1a1a;
        }

        .map-message {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #888;
            padding: 25px;
        }

        .review-list {
            display: grid;
            gap: 15px;
        }

        .review-item {
            padding: 17px;
            border-radius: 12px;
            background: #181818;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 8px;
        }

        .review-name {
            font-weight: 700;
        }

        .review-rating {
            color: #d4af37;
        }

        .review-comment {
            color: #bbb;
            line-height: 1.6;
        }

        .claim-card {
            border-color: rgba(212, 175, 55, 0.35);
        }

        .claim-intro {
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            gap: 14px;
        }

        .form-group {
            display: grid;
            gap: 7px;
        }

        .form-group label {
            font-size: 14px;
            color: #ccc;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 13px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #181818;
            color: #fff;
            outline: none;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #d4af37;
        }

        .form-message {
            margin-top: 12px;
            padding: 11px 13px;
            border-radius: 8px;
            display: none;
        }

        .form-message.success {
            display: block;
            color: #4ade80;
            background: rgba(34, 197, 94, 0.1);
        }

        .form-message.error {
            display: block;
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
        }

        .not-found {
            max-width: 700px;
            margin: 70px auto;
            text-align: center;
            background: #111;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 45px 25px;
        }

        .not-found h1 {
            margin-top: 0;
        }

        .not-found p {
            color: #999;
            line-height: 1.7;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }

        .empty-state {
            color: #888;
            line-height: 1.7;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat-box {
            background: #181818;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-number {
            display: block;
            color: #d4af37;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 850px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .profile-container {
                width: 94%;
                padding-top: 25px;
            }

            .profile-header,
            .profile-card {
                padding: 20px;
            }

            .profile-top {
                flex-direction: column;
            }

            .business-logo {
                width: 90px;
                height: 90px;
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .info-item {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            .stats-row {
                grid-template-columns: 1fr;
            }

            #businessMap {
                height: 280px;
            }
        }
    </style>
</head>

<body class="business-page">

<header>
    <nav>
        <a href="index.html" class="logo">
            NearAfrica
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="list-business.html">List Your Business</a>
        </div>
    </nav>
</header>

<main class="profile-container">

    <div id="businessContent">
        <div class="loading">
            Loading business...
        </div>
    </div>

</main>

<footer>
    <p>
        © 2026 NearAfrica. Discover businesses across Africa.
    </p>
</footer>

<!-- Leaflet JavaScript -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script>
(function () {

    "use strict";

    const API_URL =
        "https://nearafrica-api.nearafrica-onyxtech.workers.dev";

    const content =
        document.getElementById("businessContent");

    let activeMap = null;


    function getBusinessId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get("id");
    }


    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function normalizeCategory(category) {

        if (!category) {
            return "Other";
        }

        const value =
            String(category)
                .trim()
                .toLowerCase();

        const map = {

            "professional-services":
                "Professional Services",

            "professional services":
                "Professional Services",

            "restaurants & food":
                "Restaurants & Food",

            "restaurant":
                "Restaurants & Food",

            "restaurants":
                "Restaurants & Food",

            "food":
                "Restaurants & Food",

            "spa":
                "Beauty & Spa",

            "beauty & spa":
                "Beauty & Spa",

            "beauty":
                "Beauty & Spa",

            "hotels & accommodation":
                "Hotels & Accommodation",

            "hotel":
                "Hotels & Accommodation",

            "shopping & retail":
                "Shopping & Retail",

            "retail":
                "Shopping & Retail",

            "supermarkets":
                "Supermarkets",

            "banks & finance":
                "Banks & Finance",

            "health & medical":
                "Health & Medical",

            "education":
                "Education",

            "real estate":
                "Real Estate",

            "automotive":
                "Automotive",

            "travel & tourism":
                "Travel & Tourism",

            "logistics & delivery":
                "Logistics & Delivery",

            "technology":
                "Technology",

            "entertainment":
                "Entertainment",

            "fitness & sports":
                "Fitness & Sports",

            "construction & home services":
                "Construction & Home Services",

            "fashion":
                "Fashion",

            "agriculture":
                "Agriculture",

            "religious organizations":
                "Religious Organizations",

            "government & public services":
                "Government & Public Services",

            "other":
                "Other"
        };

        return map[value] || String(category);
    }


    function formatLocation(business) {

        const parts = [
            business.city,
            business.state,
            business.country
        ].filter(Boolean);

        return parts.length
            ? parts.map(escapeHtml).join(", ")
            : "Location not provided";
    }


    function formatDate(dateValue) {

        if (!dateValue) {
            return "";
        }

        const date =
            new Date(dateValue);

        if (Number.isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleDateString(
            "en-NG",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );
    }


    function renderStars(rating) {

        const numericRating =
            Number(rating) || 0;

        const rounded =
            Math.round(numericRating);

        let stars = "";

        for (let i = 1; i <= 5; i++) {
            stars +=
                i <= rounded ? "★" : "☆";
        }

        return stars;
    }


    function cleanWhatsAppNumber(number) {

        if (!number) {
            return "";
        }

        return String(number)
            .replace(/[^\d]/g, "");
    }


    function normalizeWebsite(url) {

        if (!url) {
            return "";
        }

        let value =
            String(url).trim();

        if (
            !value.startsWith("http://") &&
            !value.startsWith("https://")
        ) {
            value = "https://" + value;
        }

        return value;
    }


    function showNotFound(message) {

        content.innerHTML = `
            <div class="not-found">

                <h1>Business Not Found</h1>

                <p>
                    ${escapeHtml(
                        message ||
                        "This business could not be found."
                    )}
                </p>

                <a
                    href="explore.html"
                    class="profile-btn primary"
                >
                    Explore Businesses
                </a>

            </div>
        `;
    }


    function displayBusiness(
        business,
        result
    ) {

        const statistics =
            result.statistics || {};

        const ratingAverage =
            Number(
                statistics.average_rating ??
                business.rating_average ??
                0
            );

        const reviewCount =
            Number(
                statistics.review_count ??
                business.review_count ??
                0
            );

        const viewCount =
            Number(
                statistics.views ??
                business.views ??
                0
            );

        const reviews =
            Array.isArray(result.reviews)
                ? result.reviews
                : [];

        const images =
            Array.isArray(result.images)
                ? result.images
                : [];

        const isVerified =
            Number(business.verified) === 1;

        const isClaimed =
            Number(business.claimed) === 1;

        const category =
            normalizeCategory(
                business.category
            );

        const phone =
            business.phone
                ? String(business.phone)
                : "";

        const whatsapp =
            cleanWhatsAppNumber(
                business.whatsapp ||
                business.phone
            );

        const website =
            normalizeWebsite(
                business.website
            );

        const businessName =
            business.business_name ||
            "Unnamed Business";

        const initials =
            businessName
                .trim()
                .split(/\s+/)
                .slice(0, 2)
                .map(word => word[0])
                .join("")
                .toUpperCase();

        document.title =
            `${businessName} | NearAfrica`;

        const location =
            formatLocation(business);

        const description =
            business.description &&
            String(business.description).trim()
                ? escapeHtml(
                    business.description
                )
                : "No business description has been provided yet.";

        const address =
            business.address
                ? escapeHtml(
                    business.address
                )
                : "Not provided";

        const country =
            business.country
                ? escapeHtml(
                    business.country
                )
                : "Not provided";

        const state =
            business.state
                ? escapeHtml(
                    business.state
                )
                : "Not provided";

        const city =
            business.city
                ? escapeHtml(
                    business.city
                )
                : "Not provided";

        const email =
            business.email
                ? escapeHtml(
                    business.email
                )
                : "";

        const status =
            business.status
                ? String(
                    business.status
                )
                : "active";


        let logoHtml;

        if (business.logo_url) {

            logoHtml = `
                <img
                    src="${escapeHtml(
                        business.logo_url
                    )}"
                    alt="${escapeHtml(
                        businessName
                    )}"
                >
            `;

        } else if (business.image_url) {

            logoHtml = `
                <img
                    src="${escapeHtml(
                        business.image_url
                    )}"
                    alt="${escapeHtml(
                        businessName
                    )}"
                >
            `;

        } else {

            logoHtml = `
                <div class="business-logo-placeholder">
                    ${escapeHtml(initials || "N")}
                </div>
            `;
        }


        let actionButtons = "";

        if (phone) {

            actionButtons += `
                <a
                    class="profile-btn primary"
                    href="tel:${escapeHtml(phone)}"
                >
                    📞 Call
                </a>
            `;
        }

        if (whatsapp) {

            actionButtons += `
                <a
                    class="profile-btn"
                    href="https://wa.me/${escapeHtml(
                        whatsapp
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    💬 WhatsApp
                </a>
            `;
        }

        if (website) {

            actionButtons += `
                <a
                    class="profile-btn"
                    href="${escapeHtml(
                        website
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    🌐 Website
                </a>
            `;
        }


        let photosHtml = "";

        if (images.length > 0) {

            photosHtml = images
                .filter(image => {

                    if (!image) {
                        return false;
                    }

                    if (typeof image === "string") {
                        return true;
                    }

                    return Boolean(
                        image.url ||
                        image.image_url
                    );
                })
                .map(image => {

                    const imageUrl =
                        typeof image === "string"
                            ? image
                            : (
                                image.url ||
                                image.image_url
                            );

                    return `
                        <img
                            class="business-photo"
                            src="${escapeHtml(
                                imageUrl
                            )}"
                            alt="${escapeHtml(
                                businessName
                            )}"
                            loading="lazy"
                        >
                    `;
                })
                .join("");
        }

        if (!photosHtml && business.image_url) {

            photosHtml = `
                <img
                    class="business-photo"
                    src="${escapeHtml(
                        business.image_url
                    )}"
                    alt="${escapeHtml(
                        businessName
                    )}"
                >
            `;
        }


        const photosSection =
            photosHtml
                ? `
                    <section class="profile-card">

                        <h2>Photos</h2>

                        <div class="photo-grid">
                            ${photosHtml}
                        </div>

                    </section>
                `
                : "";


        let reviewsHtml = "";

        if (reviews.length > 0) {

            reviewsHtml =
                reviews.map(review => {

                    const reviewer =
                        review.name ||
                        review.reviewer_name ||
                        "Anonymous";

                    const rating =
                        Number(
                            review.rating
                        ) || 0;

                    const comment =
                        review.comment ||
                        review.review ||
                        "";

                    const date =
                        formatDate(
                            review.created_at
                        );

                    return `
                        <div class="review-item">

                            <div class="review-header">

                                <div class="review-name">
                                    ${escapeHtml(
                                        reviewer
                                    )}
                                </div>

                                <div class="review-rating">
                                    ${renderStars(
                                        rating
                                    )}
                                </div>

                            </div>

                            ${
                                comment
                                    ? `
                                        <div class="review-comment">
                                            ${escapeHtml(
                                                comment
                                            )}
                                        </div>
                                    `
                                    : ""
                            }

                            ${
                                date
                                    ? `
                                        <div
                                            style="
                                                margin-top:8px;
                                                color:#777;
                                                font-size:12px;
                                            "
                                        >
                                            ${escapeHtml(
                                                date
                                            )}
                                        </div>
                                    `
                                    : ""
                            }

                        </div>
                    `;

                }).join("");

        } else {

            reviewsHtml = `
                <div class="empty-state">
                    No reviews yet.
                    Be the first to review this business.
                </div>
            `;
        }


        const badges = `
            <div class="badge-row">

                ${
                    isVerified
                        ? `
                            <span class="badge verified-badge">
                                ✓ Verified
                            </span>
                        `
                        : ""
                }

                ${
                    isClaimed
                        ? `
                            <span class="badge claimed-badge">
                                ✓ Claimed
                            </span>
                        `
                        : ""
                }

                ${
                    status.toLowerCase() === "active"
                        ? `
                            <span class="badge active-badge">
                                Active Listing
                            </span>
                        `
                        : ""
                }

            </div>
        `;


        content.innerHTML = `

            <section class="profile-header">

                <div class="profile-top">

                    <div class="business-logo">
                        ${logoHtml}
                    </div>

                    <div class="profile-main">

                        <div class="business-category">
                            ${escapeHtml(category)}
                        </div>

                        <h1>
                            ${escapeHtml(
                                businessName
                            )}
                        </h1>

                        <div class="business-location">
                            📍 ${location}
                        </div>

                        <div class="business-rating">

                            <span class="stars">
                                ${renderStars(
                                    ratingAverage
                                )}
                            </span>

                            <span class="rating-text">
                                ${
                                    reviewCount > 0
                                        ? `${ratingAverage.toFixed(1)} (${reviewCount} ${
                                            reviewCount === 1
                                                ? "review"
                                                : "reviews"
                                        })`
                                        : "No reviews yet"
                                }
                            </span>

                        </div>

                        ${badges}

                        <div class="profile-actions">
                            ${actionButtons}
                        </div>

                    </div>

                </div>

                <div class="stats-row">

                    <div class="stat-box">

                        <span class="stat-number">
                            ${reviewCount}
                        </span>

                        <span class="stat-label">
                            Reviews
                        </span>

                    </div>

                    <div class="stat-box">

                        <span class="stat-number">
                            ${viewCount}
                        </span>

                        <span class="stat-label">
                            Views

            <div class="profile-grid">

                <div>

                    <section class="profile-card">

                        <h2>

                    <section class="profile-card">

                    <section class="profile-card">

                <div>

                    <section class="profile-card">

                        <h2>Business Information</h2>

                        <div class="info-list">

                            <div class="info-item">

                                <div class="info-label">

                            <div class="info-item">

                                <div class="info-label">

                                </div>

                                <div class="info-value">
                                    ${country}
                                </div>

                            </div>

                            <div class="info-item">

                                <div class="info-label">
                                    State
                                </div>

                                <div class="info-value">
                                    ${state}
                                </div>

                            </div>

                            <div class="info-item">

                                <div class="info-label">
                                    City
                                </div>

                                <div class="info-value">
                                    ${city}
                                </div>

                            </div>

                            <div class="info-item">

                                <div class="info-label">
                                    Address

                                    ${address}

                            </div>

                                phone
                                    ? `
                                        <div class="info-item">

                                            <div class="info-label">
                                                Phone
                                            </div>

                                            <div class="info-value">
                                                ${escapeHtml(
                                                    phone
                                                )}
                                            </div>

                                        </div>
                                    `
                                    : ""
                            }

                            ${
                                email
                                    ? `
                                        <div class="info-item">

                                            <div class="info-label">
                                                Email
                                            </div>

                                            <div class="info-value">
                                                ${email}
                                            </div>

                                        </div>
                                    `
                                    : ""
                            }

                            <div class="info-item">

                                <div class="info-label">
                                    Listing Status
                                </div>

                                <div class="info-value">
                                    ${escapeHtml(
                                        status
                                    )}
                                </div>

                            </div>

                        </div>

                    </section>


                    ${
                        !isClaimed
                            ? `
                                <section class="profile-card claim-card">

                                    <h2>
                                        Claim This Business
                                    </h2>

                                    <p class="claim-intro">
                                        Are you the owner or an
                                        authorized representative
                                        of this business?
                                        Submit a claim and provide
                                        evidence so the NearAfrica
                                        team can review it.
                                    </p>

                                    <form id="claimForm">

                                        <div class="form-grid">

                                            <div class="form-group">

                                                <label for="claimantName">
                                                    Your Name
                                                </label>

                                                <input
                                                    id="claimantName"
                                                    name="claimant_name"
                                                    type="text"
                                                    required
                                                >

                                            </div>

                                            <div class="form-group">

                                                <label for="claimantEmail">
                                                    Email
                                                </label>

                                                <input
                                                    id="claimantEmail"
                                                    name="claimant_email"
                                                    type="email"
                                                    required
                                                >

                                            </div>

                                            <div class="form-group">

                                                <label for="claimantPhone">
                                                    Phone
                                                </label>

                                                <input
                                                    id="claimantPhone"
                                                    name="claimant_phone"
                                                    type="tel"
                                                >

                                            </div>

                                            <div class="form-group">

                                                <label for="evidenceType">
                                                    Evidence Type
                                                </label>

                                                <select
                                                    id="evidenceType"
                                                    name="evidence_type"
                                                    required
                                                >

                                                    <option value="">
                                                        Select evidence
                                                    </option>

                                                    <option value="business_phone">
                                                        Business phone
                                                    </option>

                                                    <option value="business_email">
                                                        Business email
                                                    </option>

                                                    <option value="business_document">
                                                        Business document
                                                    </option>

                                                    <option value="website">
                                                        Official website
                                                    </option>

                                                    <option value="social_media">
                                                        Social media
                                                    </option>

                                                    <option value="other">
                                                        Other
                                                    </option>

                                                </select>

                                            </div>

                                            <div class="form-group">

                                                <label for="evidenceDetails">
                                                    Evidence Details
                                                </label>

                                                <textarea
                                                    id="evidenceDetails"
                                                    name="evidence_details"
                                                    placeholder="Explain how you can verify your connection to this business."
                                                    required
                                                ></textarea>

                                            </div>

                                            <button
                                                type="submit"
                                                class="profile-btn primary"
                                            >
                                                Submit Claim
                                            </button>

                                        </div>

                                        <div
                                            id="claimMessage"
                                            class="form-message"
                                        ></div>

                                    </form>

                                </section>
                            `
                            : `
                                <section class="profile-card">

                                    <h2>
                                        Business Claimed
                                    </h2>

                                    <p class="claim-intro">
                                        This business has already
                                        been claimed.
                                    </p>

                                </section>
                            `
                    }

                </div>

            </div>

        `;

        /*
         * IMPORTANT:
         *
         * Map is initialized ONLY here.
         * loadBusiness() must NOT initialize it again.
         */
        initializeMap(business);

        setupClaimForm(
            business.id
        );
    }


    function initializeMap(business) {

        const mapElement =
            document.getElementById(
                "businessMap"
            );

        if (!mapElement) {
            console.warn(
                "NearAfrica: Map container not found."
            );
            return;
        }


        /*
         * Prevent Leaflet from being initialized twice.
         */
        if (activeMap) {

            try {
                activeMap.remove();
            } catch (_) {}

            activeMap = null;
        }


        const latitude =
            Number(business.latitude);

        const longitude =
            Number(business.longitude);


        console.log(
            "NearAfrica: Map coordinates:",
            {
                latitude,
                longitude
            }
        );


        if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
        ) {

            mapElement.innerHTML = `
                <div class="map-message">
                    📍 Exact map coordinates are not
                    available for this business yet.
                </div>
            `;

            return;
        }


        /*
         * Basic geographic validation.
         */
        if (
            latitude < -90 ||
            latitude > 90 ||
            longitude < -180 ||
            longitude > 180
        ) {

            mapElement.innerHTML = `
                <div class="map-message">
                    📍 The business has invalid map coordinates.
                </div>
            `;

            console.error(
                "NearAfrica: Invalid coordinates:",
                latitude,
                longitude
            );

            return;
        }


        /*
         * Check Leaflet.
         */
        if (
            typeof window.L === "undefined"
        ) {

            mapElement.innerHTML = `
                <div class="map-message">
                    Map service could not be loaded.
                    Please refresh the page and try again.
                </div>
            `;

            console.error(
                "NearAfrica: Leaflet library was not loaded."
            );

            return;
        }


        try {

            mapElement.innerHTML = "";


            activeMap =
                L.map(
                    mapElement,
                    {
                        center: [
                            latitude,
                            longitude
                        ],
                        zoom: 15,
                        scrollWheelZoom: true
                    }
                );


            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,
                    attribution:
                        '&copy; OpenStreetMap contributors'
                }
            ).addTo(activeMap);


            const marker =
                L.marker([
                    latitude,
                    longitude
                ]).addTo(activeMap);


            marker.bindPopup(
                `<strong>${escapeHtml(
                    business.business_name ||
                    "Business"
                )}</strong>`
            );


            marker.openPopup();


            /*
             * Leaflet sometimes needs this after
             * being created inside dynamic HTML.
             */
            setTimeout(
                function () {

                    if (activeMap) {
                        activeMap.invalidateSize();
                    }

                },
                250
            );


            console.log(
                "NearAfrica: Map initialized successfully."
            );

        } catch (error) {

            console.error(
                "NearAfrica: Map initialization error:",
                error
            );

            activeMap = null;

            mapElement.innerHTML = `
                <div class="map-message">
                    Unable to load the map right now.
                </div>
            `;
        }
    }


    function setupClaimForm(
        businessId
    ) {

        const form =
            document.getElementById(
                "claimForm"
            );

        if (!form) {
            return;
        }

        const message =
            document.getElementById(
                "claimMessage"
            );


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const submitButton =
                    form.querySelector(
                        'button[type="submit"]'
                    );

                submitButton.disabled = true;

                submitButton.textContent =
                    "Submitting...";

                message.className =
                    "form-message";

                message.textContent =
                    "";


                const formData =
                    new FormData(form);


                const payload = {

                    business_id:
                        businessId,

                    claimant_name:
                        String(
                            formData.get(
                                "claimant_name"
                            ) || ""
                        ).trim(),

                    claimant_email:
                        String(
                            formData.get(
                                "claimant_email"
                            ) || ""
                        ).trim(),

                    claimant_phone:
                        String(
                            formData.get(
                                "claimant_phone"
                            ) || ""
                        ).trim(),

                    evidence_type:
                        String(
                            formData.get(
                                "evidence_type"
                            ) || ""
                        ).trim(),

                    evidence_details:
                        String(
                            formData.get(
                                "evidence_details"
                            ) || ""
                        ).trim()
                };


                try {

                    const response =
                        await fetch(
                            `${API_URL}/claims`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );


                    let result = {};

                    try {

                        result =
                            await response.json();

                    } catch (_) {

                        result = {};
                    }


                    if (!response.ok) {

                        throw new Error(
                            result.message ||
                            result.error ||
                            "Claim submission failed."
                        );
                    }


                    message.className =
                        "form-message success";

                    message.textContent =
                        result.message ||
                        "Your claim has been submitted successfully. NearAfrica will review it.";

                    form.reset();

                    submitButton.textContent =
                        "Claim Submitted";


                } catch (error) {

                    console.error(
                        "Claim submission error:",
                        error
                    );

                    message.className =
                        "form-message error";

                    message.textContent =
                        error.message ||
                        "Unable to submit your claim right now.";

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Submit Claim";
                }

            }
        );
    }


    async function loadBusiness() {

        const businessId =
            getBusinessId();


        if (!businessId) {

            showNotFound(
                "No business ID was provided."
            );

            return;
        }


        console.log(
            "NearAfrica: Loading business:",
            businessId
        );


        try {

            const response =
                await fetch(
                    `${API_URL}/businesses/${encodeURIComponent(
                        businessId
                    )}`
                );


            let result = {};

            try {

                result =
                    await response.json();

            } catch (jsonError) {

                console.error(
                    "Business API JSON error:",
                    jsonError
                );

                showNotFound(
                    "The server returned an invalid response."
                );

                return;
            }


            console.log(
                "NearAfrica: Business API response:",
                result
            );


            if (
                !response.ok ||
                result.status !== "ok" ||
                !result.business
            ) {

                showNotFound(
                    result.message ||
                    result.error ||
                    "This business could not be found."
                );

                return;
            }


            /*
             * IMPORTANT:
             *
             * displayBusiness() handles map
             * initialization.
             *
             * DO NOT call initializeMap()
             * again here.
             */
            displayBusiness(
                result.business,
                result
            );

        } catch (error) {

            console.error(
                "Business loading error:",
                error
            );

            showNotFound(
                "Unable to connect to NearAfrica right now."
            );
        }
    }


    loadBusiness();

})();
</script>
