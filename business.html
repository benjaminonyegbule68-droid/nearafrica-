<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Business Profile | NearAfrica</title>

  <style>
    :root {
      --bg: #0b0b0b;
      --bg-secondary: #121212;
      --card: #151515;
      --card-hover: #1b1b1b;
      --border: #292929;
      --gold: #d4af37;
      --gold-light: #e3c55b;
      --text: #f4f4f4;
      --text-muted: #a6a6a6;
      --danger: #e57373;
      --success: #81c784;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .site-header {
      border-bottom: 1px solid var(--border);
      background: rgba(11, 11, 11, 0.96);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .brand span {
      color: var(--gold);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 22px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .nav a:hover {
      color: var(--text);
    }

    .profile-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 34px 22px 60px;
    }

    .loading,
    .error-state {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      color: var(--text-muted);
    }

    .error-state h2 {
      color: var(--text);
      margin-top: 0;
    }

    .profile-header {
      background:
        linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.12),
          rgba(21, 21, 21, 0.95)
        );
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .profile-header-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 25px;
    }

    .business-title-wrap {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .business-logo {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .business-placeholder {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202020;
      border: 1px solid var(--border);
      color: var(--gold);
      font-size: 30px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .profile-header h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.15;
    }

    .business-category {
      color: var(--gold-light);
      font-size: 14px;
      margin-bottom: 7px;
    }

    .business-location {
      color: var(--text-muted);
      font-size: 14px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
    }

    .badge.gold {
      color: var(--gold-light);
      border-color: rgba(212, 175, 55, 0.35);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text);
      border-radius: 9px;
      padding: 10px 14px;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .btn:hover {
      background: var(--card-hover);
      border-color: #3a3a3a;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
    }

    .btn-danger {
      color: #ffaaaa;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .stat {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(0, 0, 0, 0.18);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
    }

    .profile-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 15px;
      padding: 23px;
      margin-bottom: 20px;
    }

    .profile-card h2 {
      margin: 0 0 15px;
      font-size: 19px;
    }

    .profile-card p {
      color: var(--text-muted);
      margin-top: 0;
    }

    .info-list {
      display: grid;
      gap: 13px;
    }

    .info-item {
      padding-bottom: 13px;
      border-bottom: 1px solid var(--border);
    }

    .info-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .info-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .info-value {
      word-break: break-word;
    }

    /* Opening Hours */

    .hours-list {
      display: grid;
      gap: 0;
    }

    .hours-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 15px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .hours-row:last-child {
      border-bottom: 0;
    }

    .hours-day {
      font-weight: 700;
      color: var(--text);
    }

    .hours-time {
      color: var(--text-muted);
    }

    .hours-closed {
      color: var(--danger);
    }

    .hours-open {
      color: var(--success);
    }

    .hours-today {
      background: rgba(212, 175, 55, 0.08);
      border-radius: 8px;
      padding-left: 10px;
      padding-right: 10px;
      margin-left: -10px;
      margin-right: -10px;
    }

    .photos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .review {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .review:last-child {
      border-bottom: 0;
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .review-name {
      font-weight: 700;
    }

    .review-date {
      color: var(--text-muted);
      font-size: 12px;
    }

    .stars {
      color: var(--gold);
      letter-spacing: 2px;
      margin: 5px 0;
    }

    .review-comment {
      color: var(--text-muted);
      margin: 0;
      white-space: pre-wrap;
    }

    .products-list {
      display: grid;
      gap: 12px;
    }

    .product-card {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 17px;
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .product-name {
      margin: 0;
      font-size: 17px;
    }

    .product-type {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .product-price {
      color: var(--gold-light);
      font-weight: 800;
      white-space: nowrap;
    }

    .product-description {
      color: var(--text-muted);
      margin: 10px 0 0;
    }

    .product-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .product-meta span {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .product-unavailable {
      color: #e6a6a6 !important;
    }

    .empty-state {
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      text-align: center;
    }

    .map {
      width: 100%;
      height: 340px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .claim-box {
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--bg-secondary);
    }

    .claim-box h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .claim-box p {
      font-size: 13px;
    }

    .claim-form {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .claim-form input,
    .claim-form textarea {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 11px;
      outline: none;
    }

    .claim-form input:focus,
    .claim-form textarea:focus {
      border-color: var(--gold);
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .status.info {
      color: var(--text-muted);
    }

    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .contact-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 850px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }

      .profile-header-main {
        flex-direction: column;
      }

      .header-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 620px) {
      .profile-container {
        padding: 20px 14px 45px;
      }

      .header-inner {
        padding: 13px 14px;
      }

      .nav {
        gap: 12px;
        font-size: 12px;
      }

      .profile-header {
        padding: 21px;
      }

      .business-title-wrap {
        flex-direction: column;
      }

      .profile-header h1 {
        font-size: 27px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .photos-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-top {
        flex-direction: column;
      }

      .product-price {
        white-space: normal;
      }

      .hours-row {
        grid-template-columns: 100px 1fr;
        gap: 10px;
      }
    }
  </style>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body class="business-page">

  <header class="site-header">
    <div class="header-inner">

      <a href="/" class="brand">
        Near<span>Africa</span>
      </a>

      <nav class="nav">
        <a href="/">Home</a>
        <a href="/explore.html">Explore</a>
        <a href="/submit.html">List Your Business</a>
      </nav>

    </div>
  </header>

  <main class="profile-container">

    <div id="businessContent">
      <div class="loading">
        Loading business...
      </div>
    </div>

  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script>
    (() => {

      const API_URL =
        "https://nearafrica-api.nearafrica-onyxtech.workers.dev";

      const content =
        document.getElementById(
          "businessContent"
        );

      let activeMap = null;

      function getBusinessId() {
        const params =
          new URLSearchParams(
            window.location.search
          );

        return (
          params.get("id") ||
          params.get("business_id") ||
          params.get("slug")
        );
      }

      function escapeHtml(value) {
        const div =
          document.createElement("div");

        div.textContent =
          value === null ||
          value === undefined
            ? ""
            : String(value);

        return div.innerHTML;
      }

      function normalizeCategory(
        category
      ) {
        if (!category) {
          return "";
        }

        return String(category)
          .replace(/[-_]/g, " ")
          .replace(/\b\w/g, c =>
            c.toUpperCase()
          );
      }

      function formatLocation(
        business
      ) {
        return [
          business.address,
          business.city,
          business.state,
          business.country
        ]
          .filter(Boolean)
          .join(", ");
      }

      function formatDate(
        value
      ) {
        if (!value) {
          return "";
        }

        const date =
          new Date(value);

        if (
          Number.isNaN(
            date.getTime()
          )
        ) {
          return String(value);
        }

        return date.toLocaleDateString(
          undefined,
          {
            year: "numeric",
            month: "short",
            day: "numeric"
          }
        );
      }

      function renderStars(
        rating
      ) {
        const numeric =
          Number(rating);

        if (
          !Number.isFinite(
            numeric
          )
        ) {
          return "";
        }

        const rounded =
          Math.max(
            0,
            Math.min(
              5,
              Math.round(numeric)
            )
          );

        return "★".repeat(
          rounded
        ) +
        "☆".repeat(
          5 - rounded
        );
      }

      function cleanWhatsAppNumber(
        value
      ) {
        if (!value) {
          return "";
        }

        return String(value)
          .replace(/[^\d]/g, "");
      }

      function normalizeWebsite(
        value
      ) {
        if (!value) {
          return "";
        }

        const trimmed =
          String(value).trim();

        if (
          /^https?:\/\//i.test(
            trimmed
          )
        ) {
          return trimmed;
        }

        return (
          "https://" +
          trimmed
        );
      }

      function showNotFound(
        message
      ) {
        content.innerHTML = `
          <div class="error-state">
            <h2>Business Not Found</h2>

            <p>
              ${escapeHtml(
                message ||
                "This business could not be found."
              )}
            </p>

            <a
              href="/"
              class="btn btn-primary"
            >
              Back to NearAfrica
            </a>
          </div>
        `;
      }

      function formatProductPrice(
        product
      ) {
        if (
          product.price === null ||
          product.price === undefined ||
          product.price === ""
        ) {
          return "Price not specified";
        }

        const price =
          Number(product.price);

        if (
          !Number.isFinite(
            price
          )
        ) {
          return "Price not specified";
        }

        const currency =
          product.currency ||
          "NGN";

        return (
          currency +
          " " +
          price.toLocaleString(
            undefined,
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }
          )
        );
      }

      function renderProducts(
        products
      ) {
        if (
          !Array.isArray(
            products
          ) ||
          products.length === 0
        ) {
          return `
            <div class="empty-state">
              No products or services have been added yet.
            </div>
          `;
        }

        return `
          <div class="products-list">
            ${products
              .map(product => {

                const type =
                  product.item_type ===
                  "service"
                    ? "Service"
                    : "Product";

                const available =
                  Number(
                    product.available
                  ) === 1;

                return `
                  <div class="product-card">

                    <div class="product-top">

                      <div>
                        <h3 class="product-name">
                          ${escapeHtml(
                            product.name ||
                            "Unnamed item"
                          )}
                        </h3>

                        <div class="product-type">
                          ${escapeHtml(
                            type
                          )}
                        </div>
                      </div>

                      <div class="product-price">
                        ${escapeHtml(
                          formatProductPrice(
                            product
                          )
                        )}
                      </div>

                    </div>

                    <p class="product-description">
                      ${escapeHtml(
                        product.description ||
                        "No description provided."
                      )}
                    </p>

                    <div class="product-meta">

                      ${
                        product.category
                          ? `
                            <span>
                              Category:
                              ${escapeHtml(
                                product.category
                              )}
                            </span>
                          `
                          : ""
                      }

                      <span
                        class="${
                          available
                            ? ""
                            : "product-unavailable"
                        }"
                      >
                        ${
                          available
                            ? "Available"
                            : "Currently unavailable"
                        }
                      </span>

                    </div>

                  </div>
                `;
              })
              .join("")}
          </div>
        `;
      }

      /*
       * Opening Hours
       *
       * This renderer accepts several common shapes so the
       * frontend remains compatible with the Worker as the
       * public hours endpoint is wired in.
       */

      function normalizeHours(hours) {

        if (!hours) {
          return null;
        }

        if (
          Array.isArray(hours)
        ) {
          return hours;
        }

        if (
          typeof hours === "object"
        ) {
          if (
            Array.isArray(
              hours.results
            )
          ) {
            return hours.results;
          }

          if (
            Array.isArray(
              hours.hours
            )
          ) {
            return hours.hours;
          }

          return hours;
        }

        return null;
      }

      function formatHoursValue(
        value
      ) {

        if (
          value === null ||
          value === undefined ||
          value === ""
        ) {
          return "Closed";
        }

        if (
          typeof value === "string"
        ) {
          return value;
        }

        return String(value);
      }

      function getDayName(
        value
      ) {

        if (!value) {
          return "";
        }

        return String(value)
          .trim()
          .toLowerCase();
      }

      function renderHours(
        hours
      ) {

        const normalized =
          normalizeHours(
            hours
          );

        if (
          !normalized
        ) {
          return `
            <div class="empty-state">
              Opening hours are not available yet.
            </div>
          `;
        }

        const dayOrder = [
          "monday",
          "tuesday",
          "wednesday",
          "thursday",
          "friday",
          "saturday",
          "sunday"
        ];

        const dayLabels = {
          monday: "Monday",
          tuesday: "Tuesday",
          wednesday: "Wednesday",
          thursday: "Thursday",
          friday: "Friday",
          saturday: "Saturday",
          sunday: "Sunday"
        };

        const today =
          new Date()
            .toLocaleDateString(
              "en-US",
              {
                weekday: "long"
              }
            )
            .toLowerCase();

        /*
         * Array format:
         * [
         *   {
         *     day: "monday",
         *     open_time: "08:00",
         *     close_time: "17:00",
         *     closed: 0
         *   }
         * ]
         */

        if (
          Array.isArray(
            normalized
          )
        ) {

          const byDay = {};

          normalized.forEach(
            item => {

              if (
                !item ||
                typeof item !==
                  "object"
              ) {
                return;
              }

              const day =
                getDayName(
                  item.day ||
                  item.day_name ||
                  item.weekday
                );

              if (day) {
                byDay[day] =
                  item;
              }
            }
          );

          return `
            <div class="hours-list">

              ${dayOrder
                .map(day => {

                  const item =
                    byDay[day];

                  if (!item) {
                    return `
                      <div
                        class="hours-row ${
                          today === day
                            ? "hours-today"
                            : ""
                        }"
                      >
                        <div class="hours-day">
                          ${dayLabels[day]}
                        </div>

                        <div class="hours-time hours-closed">
                          Hours not available
                        </div>
                      </div>
                    `;
                  }

                  const closed =
                    Number(
                      item.closed
                    ) === 1 ||
                    item.closed === true ||
                    String(
                      item.status ||
                      ""
                    ).toLowerCase() ===
                      "closed";

                  const open =
                    item.open_time ||
                    item.open ||
                    item.opens_at;

                  const close =
                    item.close_time ||
                    item.close ||
                    item.closes_at;

                  let display =
                    "Closed";

                  if (!closed) {

                    if (
                      open ||
                      close
                    ) {

                      display =
                        `${formatHoursValue(
                          open
                        )} – ${formatHoursValue(
                          close
                        )}`;

                    } else if (
                      item.hours
                    ) {

                      display =
                        item.hours;

                    } else {

                      display =
                        "Hours not available";

                    }
                  }

                  return `
                    <div
                      class="hours-row ${
                        today === day
                          ? "hours-today"
                          : ""
                      }"
                    >

                      <div class="hours-day">
                        ${dayLabels[day]}
                      </div>

                      <div
                        class="hours-time ${
                          closed
                            ? "hours-closed"
                            : "hours-open"
                        }"
                      >
                        ${escapeHtml(
                          display
                        )}
                      </div>

                    </div>
                  `;
                })
                .join("")}

            </div>
          `;
        }

        /*
         * Object format:
         *
         * {
         *   monday: {
         *     open: "08:00",
         *     close: "17:00"
         *   }
         * }
         */

        if (
          typeof normalized ===
            "object"
        ) {

          return `
            <div class="hours-list">

              ${dayOrder
                .map(day => {

                  const item =
                    normalized[day];

                  let display =
                    "Closed";

                  let closed =
                    false;

                  if (
                    typeof item ===
                      "string"
                  ) {

                    display =
                      item;

                    closed =
                      item
                        .toLowerCase()
                        .includes(
                          "closed"
                        );

                  } else if (
                    item &&
                    typeof item ===
                      "object"
                  ) {

                    closed =
                      Number(
                        item.closed
                      ) === 1 ||
                      item.closed ===
                        true;

                    if (!closed) {

                      const open =
                        item.open_time ||
                        item.open ||
                        item.opens_at;

                      const close =
                        item.close_time ||
                        item.close ||
                        item.closes_at;

                      if (
                        open ||
                        close
                      ) {

                        display =
                          `${formatHoursValue(
                            open
                          )} – ${formatHoursValue(
                            close
                          )}`;

                      } else if (
                        item.hours
                      ) {

                        display =
                          item.hours;

                      } else {

                        display =
                          "Hours not available";

                      }
                    }
                  }

                  return `
                    <div
                      class="hours-row ${
                        today === day
                          ? "hours-today"
                          : ""
                      }"
                    >

                      <div class="hours-day">
                        ${dayLabels[day]}
                      </div>

                      <div
                        class="hours-time ${
                          closed
                            ? "hours-closed"
                            : "hours-open"
                        }"
                      >
                        ${escapeHtml(
                          display
                        )}
                      </div>

                    </div>
                  `;
                })
                .join("")}

            </div>
          `;
        }

        return `
          <div class="empty-state">
            Opening hours are not available yet.
          </div>
        `;
      }

      function displayBusiness(
        business,
        result

        const statistics =
          result &&
          result.statistics

        const reviews =
          result &&

            result.reviews

            result.images
          )
            ? result.images

        const products =
          result &&

          )

            : [];

            result.business_hours

        const initial =

        const logo =

        const website =
          normalizeWebsite(
            business.website

        const whatsapp =
          cleanWhatsAppNumber(
            business.whatsapp ||
            business.phone
          );

        const phone =
          business.phone
            ? String(

        const email =
          business.email

              )

              )}"

        if (whatsapp) {
          actions += `
            <a

              href="https://wa.me/${escapeHtml(

              )}"
              target="_blank"
              rel="noopener noreferrer"

            </a>
          `;
        }

        if (email) {
          actions += `
            <a
              class="btn"
              href="mailto:${escapeHtml(
                email
              )}"
            >
              Email
            </a>
          `;
        }

        if (website) {
          actions += `
            <a
              class="btn"
              href="${escapeHtml(
                website
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Website
            </a>
          `;
        }

        const badges = [];

        if (
          Number(
            business.verified
          ) === 1
        ) {
          badges.push(`
            <span class="badge gold">
              ✓ Verified
            </span>
          `);
        }

        if (
          Number(
            business.claimed
          ) === 1
        ) {
          badges.push(`
            <span class="badge">
              ✓ Claimed
            </span>
          `);
        }

        if (
          Number(
            business.featured
          ) === 1
        ) {
          badges.push(`
            <span class="badge gold">
              Featured
            </span>
          `);
        }

        const photosHtml =
          images.length
            ? `
              <div class="photos-grid">
                ${images
                  .map(image => `
                    <img
                      class="photo"
                      src="${escapeHtml(
                        image.image_url ||
                        image.url ||
                        ""
                      )}"
                      alt="${escapeHtml(
                        business.business_name ||
                        "Business photo"
                      )}"
                      loading="lazy"
                    />
                  `)
                  .join("")}
              </div>
            `
            : `
              <div class="empty-state">
                No photos have been added yet.
              </div>
            `;

        const reviewsHtml =
          reviews.length
            ? reviews
                .map(review => `
                  <div class="review">

                    <div class="review-top">

                      <div class="review-name">
                        ${escapeHtml(
                          review.name ||
                          review.reviewer_name ||
                          "Anonymous"
                        )}
                      </div>

                      <div class="review-date">
                        ${escapeHtml(
                          formatDate(
                            review.created_at
                          )
                        )}
                      </div>

                    </div>

                    <div class="stars">
                      ${escapeHtml(
                        renderStars(
                          review.rating
                        )
                      )}
                    </div>

                    <p class="review-comment">
                      ${escapeHtml(
                        review.comment ||
                        review.review ||
                        ""
                      )}
                    </p>

                  </div>
                `)
                .join("")
            : `
              <div class="empty-state">
                No reviews yet.
              </div>
            `;

        const views =
          statistics.views !==
            undefined
            ? statistics.views
            : business.views ||
              0;

        const reviewCount =
          statistics.review_count !==
            undefined
            ? statistics.review_count
            : reviews.length;

        content.innerHTML = `

          <section class="profile-header">

            <div class="profile-header-main">

              <div class="business-title-wrap">

                ${
                  logo
                    ? `
                      <img
                        class="business-logo"
                        src="${escapeHtml(
                          logo
                        )}"
                        alt="${escapeHtml(
                          business.business_name ||
                          business.name ||
                          "Business"
                        )}"
                      />
                    `
                    : `
                      <div class="business-placeholder">
                        ${escapeHtml(
                          initial
                        )}
                      </div>
                    `
                }

                <div>

                  <h1>
                    ${escapeHtml(
                      business.business_name ||
                      business.name ||
                      "Business"
                    )}
                  </h1>

                  ${
                    category
                      ? `
                        <div class="business-category">
                          ${escapeHtml(
                            category
                          )}
                        </div>
                      `
                      : ""
                  }

                  ${
                    location
                      ? `
                        <div class="business-location">
                          ${escapeHtml(
                            location
                          )}
                        </div>
                      `
                      : ""
                  }

                  ${
                    badges.length
                      ? `
                        <div class="badge-row">
                          ${badges.join("")}
                        </div>
                      `
                      : ""
                  }

                </div>

              </div>

              ${
                actions
                  ? `
                    <div class="header-actions">
                      ${actions}
                    </div>
                  `
                  : ""
              }

            </div>

            <div class="stats">

              <div class="stat">
                <div class="stat-value">
                  ${escapeHtml(
                    views
                  )}
                </div>

                <div class="stat-label">
                  Views
                </div>
              </div>

              <div class="stat">
                <div class="stat-value">
                  ${escapeHtml(
                    reviewCount
                  )}
                </div>

                <div class="stat-label">
                  Reviews
                </div>
              </div>

              <div class="stat">
                <div class="stat-value">
                  ${escapeHtml(
                    products.length
                  )}
                </div>

                <div class="stat-label">
                  Products &amp; Services
                </div>
              </div>

            </div>

          </section>

          <div class="profile-grid">

            <div>

              <section class="profile-card">

                <h2>
                  About
                </h2>

                <p>
                  ${
                    business.description
                      ? escapeHtml(
                          business.description
                        )
                      : "No business description has been provided yet."
                  }
                </p>

              </section>


              <section class="profile-card">

                <h2>
                  Products &amp; Services
                </h2>

                ${renderProducts(
                  products
                )}

              </section>


              <section class="profile-card">

                <h2>
                  Opening Hours
                </h2>

                ${renderHours(
                  hours
                )}

              </section>


              <section class="profile-card">

                <h2>
                  Photos
                </h2>

                ${photosHtml}

              </section>


              <section class="profile-card">

                <h2>
                  Reviews
                </h2>

                ${reviewsHtml}

              </section>


              <section class="profile-card">

                <h2>
                  Location
                </h2>

                ${
                  business.latitude !==
                    null &&
                  business.latitude !==
                    undefined &&
                  business.longitude !==
                    null &&
                  business.longitude !==
                    undefined
                    ? `
                      <div
                        id="businessMap"
                        class="map"
                      ></div>
                    `
                    : `
                      <div class="empty-state">
                        Location coordinates are not available.
                      </div>
                    `
                }

              </section>

            </div>


            <div>

              <section class="profile-card">

                <h2>
                  Business Information
                </h2>

                <div class="info-list">

                  ${
                    business.business_name ||
                    business.name
                      ? `
                        <div class="info-item">

                          <div class="info-label">
                            Business Name
                          </div>

                          <div class="info-value">
                            ${escapeHtml(
                              business.business_name ||
                              business.name
                            )}
                          </div>

                        </div>
                      `
                      : ""
                  }

                  ${
                    category
                      ? `
                        <div class="info-item">

                          <div class="info-label">
                            Category
                          </div>

                          <div class="info-value">
                            ${escapeHtml(
                              category
                            )}
                          </div>

                        </div>
                      `
                      : ""
                  }

                  ${
                    location
                      ? `
                        <div class="info-item">

                          <div class="info-label">
                            Address
                          </div>

                          <div class="info-value">
                            ${escapeHtml(
                              location
                            )}
                          </div>

                        </div>
                      `
                      : ""
                  }

                  ${
                    phone
                      ? `
                        <div class="info-item">

                          <div class="info-label">
                            Phone
                          </div>

                          <div class="info-value">
                            ${escapeHtml(
                              phone
                            )}
                          </div>

                          <div class="contact-actions">

                            <a
                              class="btn"
                              href="tel:${escapeHtml(
                                phone
                              )}"
                            >
                              Call Us
                            </a>

                          </div>

                        </div>
                      `
                      : ""
                  }

                  ${
                    whatsapp
                      ? `
                        <div class="info-item">

                          <div class="info-label">
                            WhatsApp
                          </div>

                          <div class="contact-actions">

                            <a
                              class="btn"
                              href="https://wa.me/${escapeHtml(
                                whatsapp
                              )}"
                              target="_blank"
                              rel="noopener noreferrer"
                            >
                              WhatsApp Us
                            </a>

                          </div>

                        </div>
                      `
                      : ""
                  }

                  ${
                    email
                      ? `
                        <div class="info-item">

                          <div class="info-label">
                            Email
                          </div>

                          <div class="contact-actions">

                            <a
                              class="btn"
                              href="mailto:${escapeHtml(
                                email
                              )}"
                            >
                              Email Us
                            </a>

                          </div>

                        </div>
                      `
                      : ""
                  }

                  ${
                    website
                      ? `
                        <div class="info-item">

                          <div class="info-label">
                            Website
                          </div>

                          <div class="contact-actions">

                            <a
                              class="btn"
                              href="${escapeHtml(
                                website
                              )}"
                              target="_blank"
                              rel="noopener noreferrer"
                            >
                              Visit Website
                            </a>

                          </div>

                        </div>
                      `
                      : ""
                  }

                </div>

              </section>


              <section class="profile-card">

                ${
                  Number(
                    business.claimed
                  ) === 1

                    ? `

                      <div class="claim-box">

                        <h3>
                          Business Claimed
                        </h3>

                        <p>
                          This business has been claimed by its owner.
                        </p>

                      </div>

                    `

                    : `

                      <div class="claim-box">

                        <h3>
                          Claim This Business
                        </h3>

                        <p>
                          Are you the owner or authorized representative of this business?
                        </p>

                        <form
                          id="claimForm"
                          class="claim-form"
                        >

                          <input
                            type="text"
                            id="claimName"
                            placeholder="Your name"
                            required
                          />

                          <input
                            type="email"
                            id="claimEmail"
                            placeholder="Your email"
                            required
                          />

                          <textarea
                            id="claimEvidence"
                            rows="4"
                            placeholder="Tell us why you are authorized to claim this business."
                            required
                          ></textarea>

                          <button
                            type="submit"
                            class="btn btn-primary"
                          >
                            Submit Claim
                          </button>

                        </form>

                        <div
                          id="claimStatus"
                          class="status"
                        ></div>

                      </div>

                    `
                }

              </section>

            </div>

          </div>
        `;

        initializeMap(
          business
        );

        setupClaimForm(
          business
        );
      }


      function initializeMap(
        business
      ) {

        const mapElement =
          document.getElementById(
            "businessMap"
          );

        if (
          !mapElement ||
          typeof L ===
            "undefined"
        ) {
          return;
        }

        const latitude =
          Number(
            business.latitude
          );

        const longitude =
          Number(
            business.longitude
          );

        if (
          !Number.isFinite(
            latitude
          ) ||
          !Number.isFinite(
            longitude
          )
        ) {
          return;
        }

        if (activeMap) {
          activeMap.remove();
          activeMap = null;
        }

        activeMap =
          L.map(
            mapElement
          ).setView(
            [
              latitude,
              longitude
            ],
            15
          );

        L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            attribution:
              "&copy; OpenStreetMap contributors"
          }
        ).addTo(
          activeMap
        );

        L.marker([
          latitude,
          longitude
        ])
          .addTo(activeMap)
          .bindPopup(
            escapeHtml(
              business.business_name ||
              business.name ||
              "Business"
            )
          )
          .openPopup();
      }


      function setupClaimForm(
        business
      ) {

        const form =
          document.getElementById(
            "claimForm"
          );

        if (!form) {
          return;
        }

        const status =
          document.getElementById(
            "claimStatus"
          );

        form.addEventListener(
          "submit",
          async event => {

            event.preventDefault();

            const name =
              document.getElementById(
                "claimName"
              ).value.trim();

            const email =
              document.getElementById(
                "claimEmail"
              ).value.trim();

            const evidence =
              document.getElementById(
                "claimEvidence"
              ).value.trim();

            if (
              !name ||
              !email ||
              !evidence
            ) {

              status.className =
                "status error";

              status.textContent =
                "Please complete all fields.";

              return;
            }

            status.className =
              "status info";

            status.textContent =
              "Submitting claim...";

            try {

              const response =
                await fetch(
                  `${API_URL}/businesses/${encodeURIComponent(
                    business.id
                  )}/claim`,
                  {
                    method: "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body:
                      JSON.stringify({
                        claimant_name:
                          name,

                        claimant_email:
                          email,

                        evidence_type:
                          "email",

                        evidence_details:
                          evidence
                      })
                  }
                );

              const result =
                await response.json();

              if (
                !response.ok ||
                result.status !==
                  "ok"
              ) {

                throw new Error(
                  result.message ||
                  "Unable to submit claim."
                );
              }

              status.className =
                "status success";

              status.textContent =
                result.message ||
                "Claim submitted successfully.";

              form.reset();

            } catch (error) {

              console.error(
                "Claim submission failed:",
                error
              );

              status.className =
                "status error";

              status.textContent =
                "Unable to submit your claim. Please try again.";
            }
          }
        );
      }


      async function loadBusiness() {

        const businessId =
          getBusinessId();

        if (!businessId) {

          showNotFound(
            "No business ID was provided."
          );

          return;
        }

        try {

          const response =
            await fetch(
              `${API_URL}/businesses/${encodeURIComponent(
                businessId
              )}`
            );

          const result =
            await response.json();

          if (
            !response.ok ||
            result.status !==
              "ok" ||
            !result.business
          ) {

            showNotFound(
              result.message ||
              "This business could not be found."
            );

            return;
          }

          displayBusiness(
            result.business,
            result
          );

        } catch (error) {

          console.error(
            "Business loading failed:",
            error
          );

          showNotFound(
            "Unable to load this business right now."
          );
        }
      }


      loadBusiness();

    })();
  </script>

</body>
