<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Profile | NearAfrica</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root{
  --bg:#080808;
  --bg2:#101010;
  --card:#151515;
  --card2:#1b1b1b;
  --gold:#d4af37;
  --gold2:#f0c75e;
  --white:#f5f5f5;
  --muted:#a7a7a7;
  --border:#292929;
  --danger:#d9534f;
  --success:#39b96a;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top right,rgba(212,175,55,.08),transparent 32%),
    var(--bg);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
}

a{
  color:inherit;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1180px,92%);
  margin:0 auto;
}

/* =========================================================
   HEADER
========================================================= */

.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(8,8,8,.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

.header-inner{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:800;
  letter-spacing:.2px;
  white-space:nowrap;
}

.logo-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  color:#111;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  font-weight:900;
}

.logo span{
  color:var(--gold2);
}

.nav{
  display:flex;
  align-items:center;
  gap:22px;
}

.nav a{
  text-decoration:none;
  color:#d7d7d7;
  font-size:14px;
  transition:.2s;
}

.nav a:hover{
  color:var(--gold2);
}

.mobile-menu{
  display:none;
  background:none;
  border:1px solid var(--border);
  color:white;
  border-radius:8px;
  padding:8px 11px;
}

/* =========================================================
   PAGE
========================================================= */

.page{
  padding:40px 0 80px;
}

#statusMessage{
  display:none;
  padding:14px 16px;
  border-radius:10px;
  margin-bottom:22px;
  border:1px solid var(--border);
  background:var(--card);
}

.loading{
  min-height:60vh;
  display:grid;
  place-items:center;
  text-align:center;
}

.spinner{
  width:42px;
  height:42px;
  border:3px solid #333;
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================================================
   PROFILE HERO
========================================================= */

.profile-hero{
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:22px;
  background:
    radial-gradient(circle at 85% 15%,rgba(212,175,55,.16),transparent 28%),
    linear-gradient(145deg,#171717,#0e0e0e);
  box-shadow:var(--shadow);
  padding:30px;
  margin-bottom:25px;
}

.profile-top{
  display:flex;
  align-items:flex-start;
  gap:24px;
}

.business-logo{
  width:130px;
  height:130px;
  flex:0 0 130px;
  border-radius:18px;
  overflow:hidden;
  background:#222;
  border:1px solid #333;
  display:grid;
  place-items:center;
  color:var(--gold2);
  font-size:40px;
  font-weight:800;
}

.business-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-main{
  flex:1;
  min-width:0;
}

.profile-main h1{
  margin:0 0 7px;
  font-size:clamp(30px,5vw,48px);
  line-height:1.1;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  color:var(--muted);
  margin:8px 0 14px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  background:#202020;
  border:1px solid #333;
}

.badge.gold{
  color:#111;
  background:var(--gold2);
  border-color:var(--gold2);
}

.badge.green{
  color:#a9f0c4;
  border-color:#285b3d;
  background:#122319;
}

.badge.red{
  color:#ffb4b1;
  border-color:#65312f;
  background:#241211;
}

.profile-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:20px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  border:1px solid #363636;
  background:#202020;
  color:#eee;
  padding:10px 15px;
  border-radius:9px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:.2s;
}

.btn:hover{
  border-color:var(--gold);
  color:var(--gold2);
}

.btn-primary{
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#111;
  border-color:var(--gold2);
  font-weight:800;
}

.btn-primary:hover{
  color:#111;
  transform:translateY(-1px);
}

.btn-danger{
  border-color:#65312f;
  color:#ffb7b4;
  background:#211212;
}

.btn-danger:hover{
  border-color:#a74642;
  color:#fff;
}

.favorite-button.active{
  color:#111;
  background:var(--gold2);
  border-color:var(--gold2);
}

/* =========================================================
   STATISTICS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:24px;
}

.stat{
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:24px;
  color:var(--gold2);
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   CONTENT
========================================================= */

.profile-grid{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(280px,1fr);
  gap:22px;
}

.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  margin-bottom:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.profile-card h2{
  margin:0 0 18px;
  color:var(--gold2);
  font-size:22px;
}

.profile-card h3{
  color:#eee;
}

.description{
  color:#ccc;
  white-space:pre-line;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.info-item{
  padding:15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#111;
}

.info-label{
  color:#888;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:5px;
}

.info-value{
  color:#eee;
  word-break:break-word;
}

.contact-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

/* =========================================================
   PRODUCTS
========================================================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.product{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:#101010;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.product-body{
  padding:15px;
}

.product-body h3{
  margin:0 0 6px;
  color:#eee;
}

.product-body p{
  color:#aaa;
  margin:0 0 10px;
}

.price{
  color:var(--gold2);
  font-weight:800;
}

/* =========================================================
   HOURS
========================================================= */

.hours{
  display:grid;
  gap:7px;
}

.hours-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 12px;
  border-radius:8px;
  background:#111;
  border:1px solid #202020;
}

.hours-day{
  color:#ddd;
  font-weight:600;
}

.hours-time{
  color:#aaa;
  text-align:right;
}

/* =========================================================
   PHOTOS
========================================================= */

.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.photo-grid img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--border);
  cursor:pointer;
}

/* =========================================================
   REVIEWS
========================================================= */

.review-list{
  display:grid;
  gap:13px;
}

.review{
  padding:15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#101010;
}

.review-header{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.review-name{
  font-weight:700;
}

.review-rating{
  color:var(--gold2);
  white-space:nowrap;
}

.review-comment{
  color:#bbb;
  margin-top:8px;
  white-space:pre-line;
}

.review-date{
  color:#666;
  font-size:12px;
  margin-top:8px;
}

/* =========================================================
   MAP
========================================================= */

#businessMap{
  height:350px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
}

/* =========================================================
   CLAIM
========================================================= */

.claim-box{
  background:#101010;
  border:1px solid #2c2c2c;
  border-radius:12px;
  padding:20px;
}

.claim-form,
.verification-form{
  display:grid;
  gap:11px;
}

.claim-form input,
.claim-form textarea,
.verification-form input,
.modal input,
.modal textarea{
  width:100%;
  background:#090909;
  color:#eee;
  border:1px solid #333;
  border-radius:8px;
  padding:12px;
  outline:none;
}

.claim-form input:focus,
.claim-form textarea:focus,
.verification-form input:focus,
.modal input:focus,
.modal textarea:focus{
  border-color:var(--gold);
}

.verification-box{
  display:none;
  margin-top:16px;
}

.verification-box.active{
  display:block;
}

.verification-email{
  color:var(--gold2);
  font-weight:700;
  word-break:break-word;
}

.otp-input{
  text-align:center;
  letter-spacing:7px;
  font-size:24px;
}

.verification-meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
  color:#888;
  font-size:13px;
}

.verification-actions{
  margin-top:12px;
}

.small-note{
  color:#666;
  font-size:12px;
  margin-top:12px;
}

.claim-success{
  padding:16px;
  border:1px solid #285b3d;
  background:#101e15;
  border-radius:10px;
  color:#b8eac9;
}

.claim-success-title{
  color:#70dd98;
  font-weight:800;
  margin-bottom:5px;
}

/* =========================================================
   STATUS
========================================================= */

.status{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  display:none;
}

.status:not(:empty){
  display:block;
}

.status.info{
  color:#bbb;
  background:#171717;
  border:1px solid #2c2c2c;
}

.status.success{
  color:#9ee8b9;
  background:#102016;
  border:1px solid #285b3d;
}

.status.error{
  color:#ffb1ad;
  background:#241211;
  border:1px solid #65312f;
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-overlay.active{
  display:flex;
}

.modal{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#151515;
  border:1px solid #333;
  border-radius:16px;
  padding:23px;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:18px;
}

.modal-header h2{
  margin:0;
  color:var(--gold2);
}

.close-modal{
  border:0;
  background:none;
  color:#aaa;
  font-size:25px;
}

.modal form{
  display:grid;
  gap:11px;
}

.modal textarea{
  min-height:130px;
  resize:vertical;
}

/* =========================================================
   EMPTY / NOT FOUND
========================================================= */

.empty{
  padding:45px 20px;
  text-align:center;
  color:#888;
}

.empty h2{
  color:#ddd;
}

.hidden{
  display:none!important;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
  border-top:1px solid var(--border);
  padding:28px 0;
  color:#777;
  text-align:center;
}

footer a{
  color:var(--gold2);
  text-decoration:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

  .nav{
    display:none;
    position:absolute;
    top:72px;
    left:0;
    right:0;
    padding:15px;
    background:#0c0c0c;
    border-bottom:1px solid var(--border);
    flex-direction:column;
    align-items:stretch;
  }

  .nav.open{
    display:flex;
  }

  .mobile-menu{
    display:block;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }

  .profile-top{
    flex-direction:column;
  }

  .business-logo{
    width:105px;
    height:105px;
    flex-basis:105px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .product-grid{
    grid-template-columns:1fr;
  }

  .photo-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:550px){

  .page{
    padding-top:22px;
  }

  .profile-hero{
    padding:20px;
    border-radius:15px;
  }

  .profile-card{
    padding:18px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .photo-grid img{
    height:145px;
  }

  #businessMap{
    height:280px;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">

    <a class="logo" href="/pages/index.html">
      <div class="logo-mark">NA</div>
      Near<span>Africa</span>
    </a>

    <nav class="nav" id="mainNav">
      <a href="/pages/index.html">Home</a>
      <a href="/pages/search.html">Explore</a>
      <a href="/pages/list-business.html">List Your Business</a>
      <a href="/pages/claim-business.html">Claim Business</a>
    </nav>

    <button
      class="mobile-menu"
      id="mobileMenuButton"
      type="button"
      aria-label="Open menu"
    >
      ☰
    </button>

  </div>
</header>

<main class="page">
<div class="container">

  <div id="statusMessage"></div>

  <div id="loadingState" class="loading">
    <div>
      <div class="spinner"></div>
      <div>Loading business profile...</div>
    </div>
  </div>

  <div id="notFoundState" class="empty hidden">
    <h2>Business Not Found</h2>
    <p id="notFoundMessage">
      This business could not be loaded.
    </p>
    <a class="btn btn-primary" href="/pages/search.html">
      Back to Explore
    </a>
  </div>

  <div id="businessContent" class="hidden"></div>

</div>
</main>

<footer>
  <div class="container">
    <div>
      © <span id="year"></span> NearAfrica.
      Find Great Businesses Near You.
    </div>
  </div>
</footer>

<!-- ========================================================
     MODAL
======================================================== -->

<div
  class="modal-overlay"
  id="modalOverlay"
  aria-hidden="true"
>
  <div class="modal">

    <div class="modal-header">
      <h2 id="modalTitle">Action</h2>

      <button
        class="close-modal"
        id="closeModal"
        type="button"
      >
        ×
      </button>
    </div>

    <div id="modalBody"></div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(() => {

"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  "https://nearafrica-api.nearafrica-onyxtech.workers.dev";

const OWNER_TOKEN_KEY =
  "nearafrica_owner_token";

const VISITOR_KEY =
  "nearafrica_visitor_key";

let activeMap = null;
let activeBusiness = null;
let activeClaimId = null;
let resendCooldownSeconds = 0;
let resendCooldownTimer = null;

/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}

function clean(value) {
  return String(value ?? "").trim();
}

function normalizeUrl(url) {

  const value = clean(url);

  if (!value) return "";

  if (
    /^https?:\/\//i.test(value)
  ) {
    return value;
  }

  return "https://" + value;
}

function formatNumber(value) {

  const number = Number(value);

  if (!Number.isFinite(number)) {
    return "0";
  }

  return number.toLocaleString();
}

function stars(rating) {

  const value =
    Math.max(
      0,
      Math.min(
        5,
        Math.round(Number(rating) || 0)
      )
    );

  return "★".repeat(value) +
         "☆".repeat(5 - value);
}

function getVisitorKey() {

  try {

    let key =
      localStorage.getItem(
        VISITOR_KEY
      );

    if (!key) {

      key =
        "visitor_" +
        cryptoRandom();

      localStorage.setItem(
        VISITOR_KEY,
        key
      );
    }

    return key;

  } catch (error) {

    return "visitor_" +
      cryptoRandom();
  }
}

function cryptoRandom() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ) {
    return window.crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2)
  );
}

/* =========================================================
   API
========================================================= */

async function apiRequest(
  path,
  options = {}
) {

  const headers = {
    "Content-Type":
      "application/json",
    ...(options.headers || {})
  };

  const response =
    await fetch(
      API_URL + path,
      {
        ...options,
        headers,
        cache:
          options.cache || "no-store"
      }
    );

  let data = null;

  try {
    data = await response.json();
  } catch (_) {
    data = null;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.error ||
      `Request failed (${response.status})`
    );
  }

  if (
    data &&
    data.status === "error"
  ) {
    throw new Error(
      data.message ||
      "Request failed."
    );
  }

  return data || {};
}

/* =========================================================
   URL / IDENTIFIER
========================================================= */

function getIdentifier() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("business_id") ||
    params.get("slug") ||
    ""
  ).trim();
}

/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type = "info"
) {

  const element =
    document.getElementById(
      "statusMessage"
    );

  if (!element) return;

  element.style.display =
    message ? "block" : "none";

  element.textContent =
    message || "";

  element.style.color =
    type === "error"
      ? "#ffb1ad"
      : type === "success"
        ? "#9ee8b9"
        : "#ccc";

  element.style.borderColor =
    type === "error"
      ? "#65312f"
      : type === "success"
        ? "#285b3d"
        : "#292929";
}

/* =========================================================
   MODAL
========================================================= */

const modalOverlay =
  document.getElementById(
    "modalOverlay"
  );

const modalTitle =
  document.getElementById(
    "modalTitle"
  );

const modalBody =
  document.getElementById(
    "modalBody"
  );

function openModal(
  title,
  html
) {

  modalTitle.textContent =
    title;

  modalBody.innerHTML =
    html;

  modalOverlay.classList.add(
    "active"
  );

  modalOverlay.setAttribute(
    "aria-hidden",
    "false"
  );
}

function closeModal() {

  modalOverlay.classList.remove(
    "active"
  );

  modalOverlay.setAttribute(
    "aria-hidden",
    "true"
  );

  modalBody.innerHTML = "";
}

document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    closeModal
  );

function updateFavoriteButtons() {

  document
    .querySelectorAll(
      ".favorite-button"
    )
    .forEach(button => {

      const active =
        button.dataset.favorite ===
        "true";

      button.classList.toggle(
        "active",
        active
      );

      button.textContent =
        active
          ? "★ Saved"
          : "☆ Save";
    });
}

async function loadFavoriteStatus() {

  if (!activeBusiness?.id) {
    return;
  }

  try {

    const result =
      await apiRequest(
        `/businesses/${encodeURIComponent(
          activeBusiness.id
        )}/favorites`,
        {
          method:"GET"
        }
      );

    const favorited =
      result.favorited === true;

    document
      .querySelectorAll(
        ".favorite-button"
      )
      .forEach(button => {

        button.dataset.favorite =
          String(favorited);
      });

    updateFavoriteButtons();

  } catch (error) {

    /*
     * Favorite status should never prevent
     * the business profile from loading.
     */
    console.warn(
      "Favorite status unavailable:",
      error
    );
  }
}

async function toggleFavorite() {

  if (!activeBusiness?.id) {
    return;
  }

  const button =
    this;

  const currentlyFavorite =
    button.dataset.favorite ===
    "true";

  button.disabled = true;

  try {

    const method =
      currentlyFavorite
        ? "DELETE"
        : "POST";

    const result =
      await apiRequest(
        `/businesses/${encodeURIComponent(
          activeBusiness.id
        )}/favorites`,
        {
          method,
          body:
            method === "POST"
              ? JSON.stringify({
                  visitor_key:
                    getVisitorKey()
                })
              : JSON.stringify({
                  visitor_key:
                    getVisitorKey()
                })
        }
      );

    const favorited =
      result.favorited === true;

    document
      .querySelectorAll(
        ".favorite-button"
      )
      .forEach(element => {

        element.dataset.favorite =
          String(favorited);
      });

    updateFavoriteButtons();

  } catch (error) {

    showStatus(
      error.message ||
      "Unable to update favorite.",
      "error"
    );

  } finally {

    button.disabled = false;
  }
}

async function submitPublicAction(
  event,
  type
) {

  event.preventDefault();

  const status =
    document.getElementById(
      "actionStatus"
    );

  const name =
    document.getElementById(
      "actionName"
    ).value.trim();

  const email =
    document.getElementById(
      "actionEmail"
    ).value.trim();

  try {

    let endpoint;
    let body;

    if (type === "report") {

      const reason =
        document.getElementById(
          "actionReason"
        ).value.trim();

      endpoint =
        "/reports";

      body = {
        business_id:
          activeBusiness.id,
        report_type:
          "listing_report",
        reporter_name:
          name,
        reporter_email:
          email,
        reason
      };

    } else if (
      type === "correction"
    ) {

      const changes =
        document.getElementById(
          "actionChanges"
        ).value.trim();

      const reason =
        document.getElementById(
          "actionReason"
        )?.value.trim() || "";

      endpoint =
        `/businesses/${encodeURIComponent(
          activeBusiness.id
        )}/corrections`;

      body = {
        requester_name:
          name,
        requester_email:
          email,
        requested_changes:{
          description:
            changes
        },
        reason
      };

    } else {

      const reason =
        document.getElementById(
          "actionReason"
        ).value.trim();

      endpoint =
        `/businesses/${encodeURIComponent(
          activeBusiness.id
        )}/claim-disputes`;

      body = {
        requester_name:
          name,
        requester_email:
          email,
        reason
      };
    }

    status.className =
      "status info";

    status.textContent =
      "Submitting...";

    const result =
      await apiRequest(
        endpoint,
        {
          method:"POST",
          body:
            JSON.stringify(body)
        }
      );

    status.className =
      "status success";

    status.textContent =
      result.message ||
      "Submitted successfully.";

    setTimeout(
      closeModal,
      1600
    );

  } catch (error) {

    status.className =
      "status error";

    status.textContent =
      error.message ||
      "Unable to submit this request.";
  }
}

/* =========================================================
   CLAIM SYSTEM
========================================================= */

function setupClaimForm(
  business
) {

  const form =
    document.getElementById(
      "claimForm"
    );

  if (!form) return;

  const requestSection =
    document.getElementById(
      "claimRequestSection"
    );

  const verificationSection =
    document.getElementById(
      "claimVerificationSection"
    );

  const completedSection =
    document.getElementById(
      "claimCompletedSection"
    );

  const claimStatus =
    document.getElementById(
      "claimStatus"
    );

  const verificationForm =
    document.getElementById(
      "verificationForm"
    );

  const verificationStatus =
    document.getElementById(
      "verificationStatus"
    );

  const verificationEmail =
    document.getElementById(
      "verificationEmail"
    );

  const otpInput =
    document.getElementById(
      "claimOtp"
    );

  const claimSubmitButton =
    document.getElementById(
      "claimSubmitButton"
    );

  const verifyOtpButton =
    document.getElementById(
      "verifyOtpButton"
    );

  const resendOtpButton =
    document.getElementById(
      "resendOtpButton"
    );

  const otpExpiry =
    document.getElementById(
      "otpExpiry"
    );

  function setClaimStatus(
    message,
    type="info"
  ) {

    if (!claimStatus) return;

    claimStatus.className =
      `status ${type}`;

    claimStatus.textContent =
      message || "";
  }

  function setVerificationStatus(
    message,
    type="info"
  ) {

    if (!verificationStatus) return;

    verificationStatus.className =
      `status ${type}`;

    verificationStatus.textContent =
      message || "";
  }

  function setButtonLoading(
    button,
    loadingText,
    normalText,
    disabled
  ) {

    if (!button) return;

    button.disabled =
      Boolean(disabled);

    button.textContent =
      disabled
        ? loadingText
        : normalText;
  }

  function startResendCooldown(
    seconds=60
  ) {

    if (!resendOtpButton) return;

    if (resendCooldownTimer) {

      clearInterval(
        resendCooldownTimer
      );

      resendCooldownTimer =
        null;
    }

    resendCooldownSeconds =
      Math.max(
        0,
        Number(seconds) || 0
      );

    if (
      resendCooldownSeconds <= 0
    ) {

      resendOtpButton.disabled =
        false;

      resendOtpButton.textContent =
        "Resend Code";

      return;
    }

    resendOtpButton.disabled =
      true;

    resendOtpButton.textContent =
      `Resend Code (${resendCooldownSeconds}s)`;

    resendCooldownTimer =
      setInterval(
        () => {

          resendCooldownSeconds--;

          if (
            resendCooldownSeconds <= 0
          ) {

            clearInterval(
              resendCooldownTimer
            );

            resendCooldownTimer =
              null;

            resendOtpButton.disabled =
              false;

            resendOtpButton.textContent =
              "Resend Code";

            return;
          }

          resendOtpButton.textContent =
            `Resend Code (${resendCooldownSeconds}s)`;

        },
        1000
      );
  }

  function showVerificationStep(
    result
  ) {

    activeClaimId =
      result.claim_id || null;

    if (!activeClaimId) {

      setClaimStatus(
        "The claim was created, but no claim ID was returned.",
        "error"
      );

      return;
    }

    if (verificationEmail) {

      verificationEmail.textContent =
        result.verification_email ||
        "the business email currently listed on NearAfrica";
    }

    if (otpExpiry) {

      const minutes =
        Number(
          result.expires_in_minutes
        ) || 10;

      otpExpiry.textContent =
        `${minutes} minute${
          minutes === 1 ? "" : "s"
        }`;
    }

    if (requestSection) {
      requestSection.style.display =
        "none";
    }

    if (verificationSection) {
      verificationSection.classList.add(
        "active"
      );
    }

    setClaimStatus(
      result.message ||
      "Your claim was created. Enter the verification code sent to the business email.",
      "success"
    );

    setVerificationStatus(
      "Enter the 6-digit verification code.",
      "info"
    );

    if (otpInput) {

      otpInput.value = "";

      otpInput.focus();
    }

    startResendCooldown(60);
  }

  function showCompletedStep() {

    if (requestSection) {
      requestSection.style.display =
        "none";
    }

    if (verificationSection) {
      verificationSection.classList.remove(
        "active"
      );
    }

    if (completedSection) {
      completedSection.classList.add(
        "active"
      );
    }

    setClaimStatus(
      "",
      "success"
    );

    setVerificationStatus(
      "",
      "success"
    );
  }

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const name =
        document.getElementById(
          "claimName"
        ).value.trim();

      const email =
        document.getElementById(
          "claimEmail"
        ).value.trim()
        .toLowerCase();

      const evidence =
        document.getElementById(
          "claimEvidence"
        ).value.trim();

      if (
        !name ||
        !email ||
        !evidence
      ) {

        setClaimStatus(
          "Please complete all fields.",
          "error"
        );

        return;
      }

      if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
          email
        )
      ) {

        setClaimStatus(
          "Please enter a valid email address.",
          "error"
        );

        return;
      }

      /*
       * The current Worker requires the claimant email
       * to match the business email used for verification.
       */
      const businessEmail =
        clean(
          business.email
        ).toLowerCase();

      if (
        businessEmail &&
        businessEmail !== email
      ) {

        setClaimStatus(
          "For ownership verification, the email must match the business contact email currently listed on NearAfrica.",
          "error"
        );

        return;
      }

      setClaimStatus(
        "Submitting claim...",
        "info"
      );

      setButtonLoading(
        claimSubmitButton,
        "Submitting...",
        "Submit Claim",
        true
      );

      try {

        const result =
          await apiRequest(
            `/businesses/${encodeURIComponent(
              business.id
            )}/claim`,
            {
              method:"POST",
              body:
                JSON.stringify({
                  claimant_name:
                    name,
                  claimant_email:
                    email,
                  evidence_type:
                    "email",
                  evidence_details:
                    evidence,
                  business_email:
                    businessEmail
                })
            }
          );

        showVerificationStep(
          result
        );

      } catch (error) {

        console.error(
          "Claim submission failed:",
          error
        );

        setClaimStatus(
          error.message ||
          "Unable to submit your claim. Please try again.",
          "error"
        );

      } finally {

        setButtonLoading(
          claimSubmitButton,
          "Submitting...",
          "Submit Claim",
          false
        );
      }
    }
  );

  if (verificationForm) {

    verificationForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        if (!activeClaimId) {

          setVerificationStatus(
            "Your claim session is missing. Please submit the claim again.",
            "error"
          );

          return;
        }

        const otp =
          otpInput
            ? otpInput.value
                .replace(/\D/g,"")
                .slice(0,6)
            : "";

        if (
          !/^\d{6}$/.test(otp)
        ) {

          setVerificationStatus(
            "Please enter the 6-digit verification code.",
            "error"
          );

          otpInput?.focus();

          return;
        }

        setVerificationStatus(
          "Verifying code...",
          "info"
        );

        setButtonLoading(
          verifyOtpButton,
          "Verifying...",
          "Verify Code",
          true
        );

        try {

          const result =
            await apiRequest(
              `/claims/${encodeURIComponent(
                activeClaimId
              )}/verify`,
              {
                method:"POST",
                body:
                  JSON.stringify({
                    otp
                  })
              }
            );

          /*
           * Some verified/self-submission flows can
           * immediately activate owner access.
           */
          if (
            result.ownership_activated === true &&
            result.owner_token
          ) {

            try {

              localStorage.setItem(
                OWNER_TOKEN_KEY,
                result.owner_token
              );

            } catch (storageError) {

              console.error(
                "Owner session storage failed:",
                storageError
              );

              setVerificationStatus(
                "Ownership was verified, but this browser could not save the dashboard session.",
                "error"
              );

              return;
            }

            setVerificationStatus(
              "Ownership verified. Opening your owner dashboard...",
              "success"
            );

            window.location.href =
              result.dashboard_url ||
              "/pages/owner-dashboard.html";

            return;
          }

          showCompletedStep();

          setClaimStatus(
            result.message ||
            "Ownership verified. Your claim is now awaiting NearAfrica admin approval.",
            "success"
          );

        } catch (error) {

          console.error(
            "Claim verification failed:",
            error
          );

          setVerificationStatus(
            error.message ||
            "The verification code could not be verified.",
            "error"
          );

        } finally {

          setButtonLoading(
            verifyOtpButton,
            "Verifying...",
            "Verify Code",
            false
          );
        }
      }
    );
  }

  if (otpInput) {

    otpInput.addEventListener(
      "input",
      () => {

        otpInput.value =
          otpInput.value
            .replace(/\D/g,"")
            .slice(0,6);
      }
    );
  }

  if (resendOtpButton) {

    resendOtpButton.addEventListener(
      "click",
      async () => {

        if (!activeClaimId) {

          setVerificationStatus(
            "Your claim session is missing. Please submit the claim again.",
            "error"
          );

          return;
        }

        if (
          resendCooldownSeconds > 0
        ) {
          return;
        }

        resendOtpButton.disabled =
          true;

        resendOtpButton.textContent =
          "Sending...";

        setVerificationStatus(
          "Requesting a new verification code...",
          "info"
        );

        try {

          const result =
            await apiRequest(
              `/claims/${encodeURIComponent(
                activeClaimId
              )}/resend`,
              {
                method:"POST",
                body:
                  JSON.stringify({})
              }
            );

          if (
            verificationEmail &&
            result.verification_email
          ) {

            verificationEmail.textContent =
              result.verification_email;
          }

          if (otpExpiry) {

            const minutes =
              Number(
                result.expires_in_minutes
              ) || 10;

            otpExpiry.textContent =
              `${minutes} minute${
                minutes === 1 ? "" : "s"
              }`;
          }

          if (otpInput) {

            otpInput.value = "";

            otpInput.focus();
          }

          setVerificationStatus(
            result.message ||
            "A new verification code has been sent.",
            "success"
          );

          startResendCooldown(60);

        } catch (error) {

          console.error(
            "OTP resend failed:",
            error
          );

          setVerificationStatus(
            error.message ||
            "Unable to resend the verification code.",
            "error"
          );

          resendOtpButton.disabled =
            false;

          resendOtpButton.textContent =
            "Resend Code";
        }
      }
    );
  }
}

   MAP
========================================================= */

function initializeMap(
  business
) {

  const mapElement =
    document.getElementById(
      "businessMap"
    );

  if (
    !mapElement ||
    typeof L === "undefined"
  ) {
    return;
  }

  const latitude =
    Number(
      business.latitude
    );

  const longitude =
    Number(
      business.longitude
    );

  if (
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ) {

    mapElement.innerHTML = `
      <div style="
        height:100%;
        display:grid;
        place-items:center;
        color:#777;
        background:#111;
      ">
        Location coordinates are not available.
      </div>
    `;

    return;
  }

  if (activeMap) {

    activeMap.remove();

    activeMap = null;
  }

  activeMap =
    L.map(
      mapElement
    ).setView(
      [
        latitude,
        longitude
      ],
      15
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(
    activeMap
  );

  L.marker(
    [
      latitude,
      longitude
    ]
  )
  .addTo(
    activeMap
  )
  .bindPopup(
    escapeHtml(
      business.business_name ||
      business.name ||
      "Business"
    )
  )
  .openPopup();
}

/* =========================================================
   RENDER HELPERS
========================================================= */

function getLocation(
  business
) {

  return [
    business.address,
    business.area,
    business.city,
    business.state,
    business.country
  ]
    .map(clean)
    .filter(Boolean)
    .join(", ");
}

function getPhone(
  business
) {

  return clean(
    business.phone
  );
}

function getWhatsApp(
  business
) {

  return clean(
    business.whatsapp
  ).replace(
    /[^\d+]/g,
    ""
  );
}

function getWebsite(
  business
) {

  return normalizeUrl(
    business.website
  );
}

function getEmail(
  business
) {

  return clean(
    business.email
  );
}

function getBusinessName(
  business
) {

  return (
    business.business_name ||
    business.name ||
    "Business"
  );
}

function getLogo(
  business
) {

  return (
    business.logo_url ||
    business.image_url ||
    business.logo ||
    ""
  );
}

/* =========================================================
   NOT FOUND
========================================================= */

function showNotFound(
  message
) {

  document
    .getElementById(
      "loadingState"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "businessContent"
    )
    .classList.add(
      "hidden"
    );

  const state =
    document.getElementById(
      "notFoundState"
    );

  state.classList.remove(
    "hidden"
  );

  document.getElementById(
    "notFoundMessage"
  ).textContent =
    message ||
    "This business could not be found.";
}

/* =========================================================
   LOAD BUSINESS
========================================================= */

async function loadBusiness() {

  const identifier =
    getIdentifier();

  if (!identifier) {

    showNotFound(
      "No business ID or slug was provided."
    );

    return;
  }

  try {

    const result =
      await apiRequest(
        `/businesses/${encodeURIComponent(
          identifier
        )}?_=${Date.now()}`,
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if (!result.business) {

      showNotFound(
        result.message ||
        "This business could not be found."
      );

      return;
    }

    displayBusiness(
      result.business,
      result
    );

    /*
     * Use the canonical Worker-returned ID
     * for view tracking even if the visitor
     * opened the page using a slug.
     */
    recordBusinessView(
      result.business.id ||
      identifier
    );

  } catch (error) {

    console.error(
      "Business loading failed:",
      error
    );

    showNotFound(
      error.message ||
      "Unable to load this business right now."
    );
  }
}

/* =========================================================

========================================================= */
