<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Profile | NearAfrica</title>

    <meta
        name="description"
        content="Discover and connect with businesses across Africa with NearAfrica."
    >

    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        .business-page {
            min-height: 100vh;
            background: #0d0d0d;
            color: #fff;
        }

        .profile-container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px 70px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #d4af37;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .profile-header {
            background: #171717;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .profile-category {
            display: inline-block;
            margin-bottom: 10px;
            color: #d4af37;
            font-size: .9rem;
            font-weight: 700;
        }

        .verified-badge {
            display: none;
            margin-left: 8px;
            padding: 4px 9px;
            border-radius: 20px;
            background: rgba(212,175,55,.15);
            border: 1px solid rgba(212,175,55,.4);
            color: #d4af37;
            font-size: .75rem;
            vertical-align: middle;
        }

        .profile-header h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 3.2rem);
        }

        .profile-location {
            color: #aaa;
            margin-bottom: 15px;
        }

        .profile-rating {
            color: #d4af37;
            margin-bottom: 20px;
        }

        .profile-description {
            color: #bbb;
            line-height: 1.7;
            max-width: 750px;
        }

        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .profile-btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid #333;
            color: #fff;
            background: #202020;
        }

        .profile-btn.primary {
            background: #d4af37;
            color: #111;
            border-color: #d4af37;
        }

        .profile-btn:hover {
            opacity: .9;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .profile-section {
            background: #171717;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 25px;
        }

        .profile-section h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.2rem;
        }

        .detail-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            color: #bbb;
        }

        .detail-label {
            min-width: 100px;
            color: #d4af37;
            font-weight: 600;
        }

        #business-map {
            width: 100%;
            height: 350px;
            border-radius: 12px;
            overflow: hidden;
        }

        /* CLAIM SECTION */

        .claim-section {
            margin-top: 25px;
            background:
                linear-gradient(
                    135deg,
                    rgba(212,175,55,.12),
                    rgba(212,175,55,.03)
                );
            border: 1px solid rgba(212,175,55,.3);
            border-radius: 18px;
            padding: 30px;
        }

        .claim-section h2 {
            margin-top: 0;
        }

        .claim-section p {
            color: #aaa;
            line-height: 1.6;
        }

        .claim-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 18px;
            background: #d4af37;
            color: #111;
            border: none;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .claim-btn:hover {
            opacity: .9;
        }

        /* CLAIM FORM */

        #claimFormContainer {
            display: none;
            margin-top: 25px;
        }

        .claim-form {
            display: grid;
            gap: 15px;
        }

        .form-group {
            display: grid;
            gap: 7px;
        }

        .form-group label {
            color: #ddd;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border-radius: 9px;
            border: 1px solid #333;
            background: #101010;
            color: #fff;
            font-family: inherit;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #d4af37;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-help {
            color: #777;
            font-size: .85rem;
            line-height: 1.5;
        }

        .submit-claim-btn {
            padding: 13px 18px;
            border: none;
            border-radius: 9px;
            background: #d4af37;
            color: #111;
            font-weight: 800;
            cursor: pointer;
        }

        .submit-claim-btn:hover {
            opacity: .9;
        }

        .submit-claim-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .claim-message {
            display: none;
            padding: 14px;
            border-radius: 9px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .claim-success {
            display: block;
            background: rgba(46, 160, 67, .12);
            border: 1px solid rgba(46, 160, 67, .4);
            color: #8be28f;
        }

        .claim-error {
            display: block;
            background: rgba(220, 60, 60, .12);
            border: 1px solid rgba(220, 60, 60, .4);
            color: #ff9b9b;
        }

        .review {
            padding: 15px 0;
            border-bottom: 1px solid #292929;
        }

        .review:last-child {
            border-bottom: none;
        }

        .review-name {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .review-rating {
            color: #d4af37;
            margin-bottom: 5px;
        }

        .review-text {
            color: #999;
            line-height: 1.5;
        }

        .not-found {
            text-align: center;
            padding: 70px 20px;
            background: #171717;
            border: 1px solid #292929;
            border-radius: 18px;
        }

        .not-found h1 {
            margin-bottom: 10px;
        }

        .not-found p {
            color: #999;
            margin-bottom: 25px;
        }

        .not-found a {
            display: inline-block;
            padding: 12px 18px;
            background: #d4af37;
            color: #111;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
        }

        .profile-footer {
            border-top: 1px solid #222;
            margin-top: 50px;
            padding: 30px 20px;
            text-align: center;
            color: #777;
        }

        .profile-footer a {
            color: #d4af37;
            text-decoration: none;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }

        @media (max-width: 800px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }

            .profile-header {
                padding: 22px;
            }

            .profile-section {
                padding: 20px;
            }

            .detail-row {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>

<body class="business-page">

<header class="site-header">
    <div class="container header-inner">

        <a href="index.html" class="logo">
            <img
                src="logo.png"
                alt="NearAfrica"
                class="logo-img"
            >

            <span class="logo-text">
                NearAfrica
            </span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="list-business.html">
                List Your Business
            </a>
        </nav>

    </div>
</header>


<main class="profile-container">

    <a
        href="explore.html"
        class="back-link"
    >
        ← Back to Explore
    </a>


    <div id="businessContent">

        <div class="loading">
            Loading business...
        </div>

    </div>

</main>


<footer class="profile-footer">

    <p>
        © 2026 NearAfrica ·
        <a href="index.html">
            Back to Home
        </a>
    </p>

</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =====================================================
   NEARAFRICA API
   =====================================================

   IMPORTANT:
   Replace the URL below with your actual
   nearafrica-api Worker URL.

   Example:
   https://nearafrica-api.your-subdomain.workers.dev

===================================================== */

const API_URL =
    "PASTE-YOUR-NEARAFRICA-API-URL-HERE";


/* =====================================================
   GET BUSINESS ID
===================================================== */

function getBusinessId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   SHOW NOT FOUND
===================================================== */

function showNotFound(message = "This business could not be found.") {

    document.getElementById("businessContent").innerHTML = `

        <section class="not-found">

            <h1>
                Business Not Found
            </h1>

            <p>
                ${escapeHTML(message)}
            </p>

            <a href="explore.html">
                Explore Businesses
            </a>

        </section>

    `;

}


/* =====================================================
   LOAD BUSINESS FROM D1 API
===================================================== */

async function loadBusiness() {

    const businessId =
        getBusinessId();

    if (!businessId) {

        showNotFound(
            "No business ID was provided."
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/businesses/${encodeURIComponent(businessId)}`
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success ||
            !result.business
        ) {

            showNotFound();

            return;

        }


        displayBusiness(
            result.business
        );


    } catch (error) {

        console.error(
            "Business loading error:",
            error
        );


        showNotFound(
            "Unable to connect to NearAfrica right now."
        );

    }

}


/* =====================================================
   DISPLAY BUSINESS
===================================================== */

function displayBusiness(business) {

    document.title =
        `${business.business_name} | NearAfrica`;


    document.getElementById(
        "businessContent"
    ).innerHTML = `

        <section class="profile-header">

            <span class="profile-category">
                ${escapeHTML(
                    business.category || "Business"
                )}

                ${
                    Number(business.verified) === 1
                    ? `<span class="verified-badge"
                            style="display:inline-block;">
                            ✓ Verified
                       </span>`
                    : ""
                }

            </span>


            <h1 id="businessName">
                ${escapeHTML(
                    business.business_name
                )}
            </h1>


            <div class="profile-location">

                📍 ${escapeHTML(
                    business.address ||
                    `${business.city}, ${business.state}`
                )}

            </div>


            <div class="profile-rating">
                ⭐ No rating yet
            </div>


            <p class="profile-description">

                ${escapeHTML(
                    business.description ||
                    "No description available."
                )}

            </p>


            <div class="profile-actions">

                ${
                    business.phone
                    ? `
                    <a
                        href="tel:${escapeHTML(business.phone)}"
                        class="profile-btn primary"
                    >
                        📞 Call
                    </a>
                    `
                    : ""
                }


                ${
                    business.whatsapp
                    ? `
                    <a
                        href="https://wa.me/${cleanWhatsAppNumber(
                            business.whatsapp
                        )}"
                        class="profile-btn"
                        target="_blank"
                        rel="noopener"
                    >
                        💬 WhatsApp
                    </a>
                    `
                    : ""
                }


                ${
                    business.website
                    ? `
                    <a
                        href="${escapeHTML(
                            normalizeWebsite(
                                business.website
                            )
                        )}"
                        class="profile-btn"
                        target="_blank"
                        rel="noopener"
                    >
                        🌐 Website
                    </a>
                    `
                    : ""
                }

            </div>

        </section>


        <div class="profile-grid">


            <section class="profile-section">

                <h2>
                    Business Information
                </h2>


                <div class="detail-row">

                    <span class="detail-label">
                        Category
                    </span>

                    <span>
                        ${escapeHTML(
                            business.category ||
                            "Business"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Country
                    </span>

                    <span>
                        ${escapeHTML(
                            business.country ||
                            "Nigeria"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        State
                    </span>

                    <span>
                        ${escapeHTML(
                            business.state ||
                            "—"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        City
                    </span>

                    <span>
                        ${escapeHTML(
                            business.city ||
                            "—"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Address
                    </span>

                    <span>
                        ${escapeHTML(
                            business.address ||
                            "Not provided"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Phone
                    </span>

                    <span>
                        ${escapeHTML(
                            business.phone ||
                            "Not provided"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Status
                    </span>

                    <span>
                        ${
                            Number(business.verified) === 1
                            ? "✓ Verified"
                            : "Pending verification"
                        }
                    </span>

                </div>

            </section>


            <section class="profile-section">

                <h2>
                    Location
                </h2>

                <div id="business-map"></div>

            </section>

        </div>


        <!-- REVIEWS -->

        <section
            class="profile-section"
            style="margin-top:25px;"
        >

            <h2>
                Reviews
            </h2>


            <div class="review">

                <div class="review-name">
                    No reviews yet
                </div>

                <div class="review-text">
                    Be the first person to review
                    this business.
                </div>

            </div>

        </section>


        <!-- CLAIM -->

        ${
            Number(business.verified) === 1

            ?

            `
            <section class="claim-section">

                <h2>
                    ✓ This business is verified
                </h2>

                <p>
                    This business has already been
                    claimed and verified on NearAfrica.
                    If you believe this verification
                    is incorrect, you can report the
                    listing for review.
                </p>

                <a
                    href="list-business.html"
                    class="claim-btn"
                >
                    Report a Problem
                </a>

            </section>
            `

            :

            `
            <section class="claim-section">

                <h2>
                    Are you the owner?
                </h2>

                <p>
                    Is this your business?
                    Submit a claim to request control
                    of this listing. NearAfrica will
                    review your information before
                    verification.
                </p>


                <button
                    type="button"
                    class="claim-btn"
                    id="showClaimFormButton"
                >
                    Claim This Business
                </button>


                <div id="claimFormContainer">

                    <form
                        id="claimForm"
                        class="claim-form"
                    >

                        <div class="form-group">

                            <label for="claimantName">
                                Full Name *
                            </label>

                            <input
                                type="text"
                                id="claimantName"
                                name="claimant_name"
                                placeholder="Your full name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="claimantEmail">
                                Email *
                            </label>

                            <input
                                type="email"
                                id="claimantEmail"
                                name="claimant_email"
                                placeholder="you@example.com"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="claimantPhone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="claimantPhone"
                                name="claimant_phone"
                                placeholder="08012345678"
                            >

                        </div>


                        <div class="form-group">

                            <label for="evidenceType">
                                Proof / Evidence *
                            </label>

                            <select
                                id="evidenceType"
                                name="evidence_type"
                                required
                            >

                                <option value="">
                                    Select an option
                                </option>

                                <option value="phone">
                                    Business phone number
                                </option>

                                <option value="email">
                                    Business email
                                </option>

                                <option value="website">
                                    Business website
                                </option>

                                <option value="social_media">
                                    Business social media
                                </option>

                                <option value="business_document">
                                    Business document
                                </option>

                                <option value="other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="evidenceDetails">
                                Evidence Details *
                            </label>

                            <textarea
                                id="evidenceDetails"
                                name="evidence_details"
                                placeholder="Explain how you can prove that you represent this business."
                                required
                            ></textarea>

                            <div class="form-help">
                                NearAfrica may contact you for
                                additional verification.
                            </div>

                        </div>


                        <button
                            type="submit"
                            class="submit-claim-btn"
                            id="submitClaimButton"
                        >
                            Submit Claim
                        </button>

                    </form>


                    <div
                        id="claimMessage"
                        class="claim-message"
                    ></div>

                </div>

            </section>
            `
        }

    `;


    /* Initialize map */

    initializeMap(
        business
    );


    /* Setup claim form */

    setupClaimForm(
        business.id
    );

}


/* =====================================================
   WHATSAPP NUMBER
===================================================== */

function cleanWhatsAppNumber(number) {

    return String(number)
        .replace(/[^0-9]/g, "");

}


/* =====================================================
   WEBSITE URL
===================================================== */

function normalizeWebsite(url) {

    if (!url) {
        return "";
    }

    if (
        url.startsWith("http://") ||
        url.startsWith("https://")
    ) {
        return url;
    }

    return `https://${url}`;

}


/* =====================================================
   MAP
===================================================== */

function initializeMap(business) {

    const mapElement =
        document.getElementById(
            "business-map"
        );


    if (!mapElement) {
        return;
    }


    const map =
        L.map(
            "business-map"
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    const latitude =
        Number(business.latitude);


    const longitude =
        Number(business.longitude);


    if (
        Number.isFinite(latitude) &&
        Number.isFinite(longitude) &&
        latitude !== 0 &&
        longitude !== 0
    ) {

        map.setView(
            [
                latitude,
                longitude
            ],
            15
        );


        L.marker([
            latitude,
            longitude
        ])
        .addTo(map)
        .bindPopup(
            `<strong>
                ${escapeHTML(
                    business.business_name
                )}
            </strong>`
        )
        .openPopup();


    } else {

        /*
           No coordinates have been saved for
           this business yet.

           We show Nigeria as the fallback
           map location rather than pretending
           the business is at a specific point.
        */

        map.setView(
            [9.0820, 8.6753],
            6
        );

    }

}


/* =====================================================
   CLAIM FORM
===================================================== */

function setupClaimForm(
    businessId
) {

    const showButton =
        document.getElementById(
            "showClaimFormButton"
        );


    const formContainer =
        document.getElementById(
            "claimFormContainer"
        );


    const form =
        document.getElementById(
            "claimForm"
        );


    if (
        !showButton ||
        !formContainer ||
        !form
    ) {
        return;
    }


    showButton.addEventListener(
        "click",
        function () {

            formContainer.style.display =
                "block";

            showButton.style.display =
                "none";

            formContainer.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }
    );


    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const submitButton =
                document.getElementById(
                    "submitClaimButton"
                );


            const message =
                document.getElementById(
                    "claimMessage"
                );


            const claimantName =
                document.getElementById(
                    "claimantName"
                ).value.trim();


            const claimantEmail =
                document.getElementById(
                    "claimantEmail"
                ).value.trim();


            const claimantPhone =
                document.getElementById(
                    "claimantPhone"
                ).value.trim();


            const evidenceType =
                document.getElementById(
                    "evidenceType"
                ).value;


            const evidenceDetails =
                document.getElementById(
                    "evidenceDetails"
                ).value.trim();


            if (
                !claimantName ||
                !claimantEmail ||
                !evidenceType ||
                !evidenceDetails
            ) {

                showClaimMessage(
                    "Please complete all required fields.",
                    "error"
                );

                return;

            }


            submitButton.disabled =
                true;


            submitButton.textContent =
                "Submitting...";


            message.className =
                "claim-message";


            message.textContent =
                "";


            try {

                const response =
                    await fetch(
                        `${API_URL}/claims`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    business_id:
                                        businessId,

                                    claimant_name:
                                        claimantName,

                                    claimant_email:
                                        claimantEmail,

                                    claimant_phone:
                                        claimantPhone,

                                    evidence_type:
                                        evidenceType,

                                    evidence_details:
                                        evidenceDetails

                                })
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to submit claim."
                    );

                }


                showClaimMessage(
                    "✓ Your claim has been submitted successfully. NearAfrica will review your information before verification.",
                    "success"
                );


                form.reset();


                submitButton.textContent =
                    "Claim Submitted";


                submitButton.disabled =
                    true;


            } catch (error) {

                console.error(
                    "Claim submission error:",
                    error
                );


                showClaimMessage(
                    error.message ||
                    "Something went wrong while submitting your claim.",
                    "error"
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "Submit Claim";

            }

        }
    );

}


/* =====================================================
   CLAIM MESSAGE
===================================================== */

function showClaimMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "claimMessage"
        );


    if (!message) {
        return;
    }


    message.textContent =
        text;


    message.className =
        `claim-message ${
            type === "success"
            ? "claim-success"
            : "claim-error"
        }`;

}
