<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title data-i18n="siteName">
    NearAfrica — Discover Businesses Near You
  </title>

  <meta
    name="description"
    content="Discover businesses, services, shops and opportunities near you across Africa. Start with Nigeria."
  >

  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>
    /* =====================================================
       HOME PAGE
       ===================================================== */

    .home-hero {
      padding: 75px 20px 55px;
      text-align: center;
    }

    .home-hero-inner {
      max-width: 950px;
      margin: 0 auto;
    }

    .home-eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      color: #d4af37;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .home-hero h1 {
      margin: 0 0 18px;
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1.02;
      letter-spacing: -2.5px;
    }

    .home-hero h1 span {
      color: #d4af37;
    }

    .home-hero p {
      max-width: 720px;
      margin: 0 auto;
      color: #aaa;
      font-size: 17px;
      line-height: 1.75;
    }

    /* =====================================================
       SEARCH
       ===================================================== */

    .home-search-wrapper {
      max-width: 950px;
      margin: 38px auto 0;
    }

    .home-search {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
    }

    .home-search-field {
      text-align: left;
    }

    .home-search-field label {
      display: block;
      margin: 0 0 7px 3px;
      color: #999;
      font-size: 12px;
      font-weight: 700;
    }

    .home-search-field input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #181818;
      color: #fff;
      outline: none;
    }

    .home-search-field input::placeholder {
      color: #777;
    }

    .home-search-field input:focus {
      border-color: #d4af37;
    }

    .home-search-button {
      align-self: end;
      height: 54px;
      padding: 0 25px;
      border: 0;
      border-radius: 10px;
      background: #d4af37;
      color: #111;
      font-weight: 800;
    }

    .home-search-button:hover {
      background: #e2c35c;
    }

    /* =====================================================
       LOCATION
       ===================================================== */

    .home-location {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .home-location button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #181818;
      color: #fff;
      font-weight: 700;
    }

    .home-location button:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .home-location-message {
      color: #aaa;
      font-size: 13px;
    }

    .home-location-message.success {
      color: #d4af37;
    }

    .home-location-message.error {
      color: #ff9999;
    }

    /* =====================================================
       COUNTRY STRIP
       ===================================================== */

    .country-strip {
      overflow: hidden;
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
      background: #0c0c0c;
    }

    .country-list {
      width: min(1200px, calc(100% - 30px));
      margin: 0 auto;
      padding: 16px 0;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;

      color: #999;
      font-size: 12px;
      font-weight: 600;
    }

    .country-list span {
      white-space: nowrap;
    }

    /* =====================================================
       SECTIONS
       ===================================================== */

    .home-section {
      width: min(1150px, calc(100% - 32px));
      margin: 0 auto;
      padding: 75px 0;
    }

    .home-section-heading {
      margin-bottom: 30px;
    }

    .home-section-heading h2 {
      margin: 0 0 9px;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -1px;
    }

    .home-section-heading p {
      max-width: 650px;
      color: #777;
      line-height: 1.7;
    }

    /* =====================================================
       CATEGORIES
       ===================================================== */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .category-card {
      display: block;
      padding: 22px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      background: #fff;
      transition: 0.2s ease;
    }

    .category-card:hover {
      transform: translateY(-3px);
      border-color: #d4af37;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    .category-icon {
      margin-bottom: 12px;
      font-size: 25px;
    }

    .category-card h3 {
      margin: 0 0 5px;
      font-size: 15px;
    }

    .category-card p {
      margin: 0;
      color: #777;
      font-size: 12px;
    }

    /* =====================================================
       OWNER CTA
       ===================================================== */

    .owner-section {
      background: #111;
      color: #fff;
    }

    .owner-inner {
      width: min(1150px, calc(100% - 32px));
      margin: 0 auto;
      padding: 70px 0;

      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 45px;
      align-items: center;
    }

    .owner-content h2 {
      margin: 0 0 14px;
      font-size: clamp(28px, 4vw, 42px);
    }

    .owner-content p {
      max-width: 650px;
      color: #bbb;
      line-height: 1.75;
    }

    .owner-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .owner-button {
      display: inline-block;
      padding: 13px 18px;
